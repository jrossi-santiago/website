name: Send Motivation Emails

on:
  schedule:
    # Morning slots — 7am, 8am, 9am, 10am EST (12,13,14,15 UTC)
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    # Afternoon slots — 12pm, 1pm, 2pm, 3pm EST (17,18,19,20 UTC)
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    # Evening slots — 8pm, 9pm EST (1,2 UTC next day)
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron trigger
        run: |
          curl -X POST https://motivation-app-theta.vercel.app/api/cron-trigger \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --fail-with-body
