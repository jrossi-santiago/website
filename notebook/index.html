<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notebook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Karla:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #2B2D22;
      --card-today:    #F5F2EB;
      --card-someday:  #EDE8DF;
      --card-future:   #E3DAC9;
      --card-wb:       #E8E4DA;
      --text-dark:     #2A2825;
      --text-mid:      #76706A;
      --text-light:    #B3ADA5;
      --circle-stroke: #C5BFB7;
      --line-rule:     rgba(42, 40, 37, 0.07);
      --streak-gold:   #C4A066;
      --shadow-card:   0 6px 32px rgba(0,0,0,0.28), 0 1px 6px rgba(0,0,0,0.14);
      --shadow-mini:   0 3px 18px rgba(0,0,0,0.22), 0 1px 4px rgba(0,0,0,0.10);
      --radius-lg:     14px;
      --radius-md:     10px;
      --font-display:  'Cormorant Garamond', Georgia, serif;
      --font-body:     'Karla', system-ui, sans-serif;
    }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      font-family: var(--font-body);
      color: var(--text-dark);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    #page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 80px;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      width: 100%;
      max-width: 720px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 24px;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 500;
      color: rgba(245,242,235,0.55);
      letter-spacing: 0.01em;
      line-height: 1;
    }

    .page-slogan {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 300;
      color: rgba(245,242,235,0.2);
      font-style: italic;
      letter-spacing: 0.04em;
    }

    /* ── CARD BASE ── */
    .panel-card {
      width: 100%;
      max-width: 720px;
      background: var(--card-today);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
      animation: cardRise 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .panel-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255,255,255,0.55);
      pointer-events: none;
    }

    .entries-card { background: var(--card-wb); animation-delay: 0.06s; }

    @keyframes cardRise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── CARD TOP ── */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--line-rule);
    }

    .card-label {
      font-family: var(--font-display);
      font-size: 23px;
      font-weight: 500;
      color: var(--text-dark);
      letter-spacing: 0.01em;
      line-height: 1;
    }

    .card-top-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-dots {
      display: flex;
      flex-direction: column;
      gap: 3.5px;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      border: 1px solid var(--circle-stroke);
      display: block;
    }

    .dot-filled { background: var(--circle-stroke); border-color: var(--circle-stroke); }

    /* ── CARD BODY ── */
    .card-body { padding: 20px 22px 22px; }

    /* ── FIELD LABELS ── */
    .field-label {
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 6px;
    }

    /* ── TITLE INPUT ── */
    .title-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--circle-stroke);
      color: var(--text-dark);
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 500;
      padding: 6px 0 10px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 24px;
      caret-color: var(--text-dark);
    }

    .title-input:focus { border-bottom-color: var(--text-mid); }

    .title-input::placeholder {
      color: var(--text-light);
      font-style: italic;
      font-size: 16px;
    }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex;
      gap: 3px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar-btn {
      background: transparent;
      border: 1px solid var(--circle-stroke);
      color: var(--text-light);
      font-family: var(--font-body);
      font-size: 12px;
      width: 30px;
      height: 28px;
      cursor: pointer;
      border-radius: 5px;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .toolbar-btn:hover {
      border-color: var(--text-mid);
      color: var(--text-dark);
      background: rgba(42,40,37,0.05);
    }

    .toolbar-divider {
      width: 1px;
      height: 20px;
      background: var(--circle-stroke);
      margin: 0 3px;
    }

    .toolbar-img-btn {
      background: transparent;
      border: 1px solid var(--circle-stroke);
      color: var(--text-light);
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      height: 28px;
      padding: 0 12px;
      cursor: pointer;
      border-radius: 5px;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .toolbar-img-btn:hover {
      border-color: var(--text-mid);
      color: var(--text-dark);
      background: rgba(42,40,37,0.05);
    }

    /* ── EDITOR ── */
    .editor {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--circle-stroke);
      color: var(--text-dark);
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 14px;
      line-height: 1.9;
      padding: 8px 0 20px;
      outline: none;
      min-height: 220px;
      transition: border-color 0.2s;
      caret-color: var(--text-dark);
    }

    .editor:focus { border-bottom-color: var(--text-mid); }

    .editor:empty:before {
      content: attr(data-placeholder);
      color: var(--text-light);
      font-style: italic;
      pointer-events: none;
    }

    .editor b, .editor strong { font-weight: 700; }
    .editor i, .editor em     { font-style: italic; }
    .editor u                  { text-decoration: underline; }

    .editor img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 12px 0;
    }

    /* ── IMAGE PREVIEWS ── */
    .image-preview-area {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .preview-thumb-wrap { position: relative; display: inline-block; }

    .preview-thumb {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border: 1px solid var(--circle-stroke);
      border-radius: 5px;
      display: block;
    }

    .preview-remove {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--card-today);
      border: 1px solid var(--circle-stroke);
      color: var(--text-light);
      font-size: 9px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
      line-height: 1;
    }

    .preview-remove:hover { color: var(--text-dark); }

    /* ── FORM ACTIONS ── */
    .form-actions {
      margin-top: 22px;
      display: flex;
      justify-content: flex-end;
    }

    .save-btn {
      font-family: var(--font-body);
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 11px;
      background: var(--text-dark);
      color: var(--card-today);
      border: 1px solid var(--text-dark);
      border-radius: var(--radius-md);
      padding: 10px 28px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .save-btn:hover    { opacity: 0.8; }
    .save-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── ENTRIES CARD ── */
    .entries-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 22px;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.25s;
    }

    .entries-card-top.open { border-bottom-color: var(--line-rule); }

    .entries-toggle-label {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 500;
      color: var(--text-dark);
      letter-spacing: 0.01em;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .entries-arrow {
      font-size: 9px;
      color: var(--text-light);
      transition: transform 0.22s;
      display: inline-block;
    }

    .entries-arrow.open { transform: rotate(90deg); }

    .load-btn {
      font-family: var(--font-body);
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 10px;
      background: transparent;
      color: var(--text-mid);
      border: 1px solid var(--circle-stroke);
      border-radius: 20px;
      padding: 5px 14px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .load-btn:hover    { border-color: var(--text-mid); color: var(--text-dark); }
    .load-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Collapsible entries list */
    .entries-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.38s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .entries-body.open { max-height: 9000px; }

    .entries-inner { padding: 8px 22px 16px; }

    /* Individual entry rows */
    .entry-item { border-bottom: 1px solid var(--line-rule); }
    .entry-item:last-child { border-bottom: none; }

    .entry-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 12px 0;
      gap: 10px;
      cursor: pointer;
    }

    .entry-expand-arrow {
      font-size: 8px;
      color: var(--text-light);
      margin-top: 4px;
      flex-shrink: 0;
      transition: transform 0.2s, color 0.15s;
    }

    .entry-row:hover .entry-expand-arrow { color: var(--text-mid); }
    .entry-expand-arrow.open { transform: rotate(90deg); }

    .entry-info { flex: 1; min-width: 0; }

    .entry-item-title {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 400;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s;
    }

    .entry-row:hover .entry-item-title { color: var(--text-mid); }

    .entry-item-date {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 300;
      color: var(--text-light);
      margin-top: 2px;
      font-style: italic;
    }

    .entry-delete-btn {
      background: transparent;
      border: 1px solid var(--circle-stroke);
      color: var(--text-light);
      font-size: 10px;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      transition: border-color 0.15s, color 0.15s;
    }

    .entry-delete-btn:hover { border-color: var(--text-mid); color: var(--text-dark); }

    /* Expandable content */
    .entry-content { display: none; padding: 0 0 16px 16px; }
    .entry-content.open { display: block; }

    .entry-content-inner {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 13px;
      line-height: 1.85;
      color: var(--text-mid);
      border-left: 1px solid var(--circle-stroke);
      padding-left: 14px;
    }

    .entry-content-inner b,
    .entry-content-inner strong { font-weight: 500; color: var(--text-dark); }
    .entry-content-inner i,
    .entry-content-inner em     { font-style: italic; }
    .entry-content-inner u      { text-decoration: underline; }

    .entry-content-inner img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 10px 0;
      border-radius: 4px;
    }

    .entry-content-loading {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 12px;
      font-style: italic;
      color: var(--text-light);
      padding: 6px 0 6px 14px;
      border-left: 1px solid var(--circle-stroke);
    }

    .entries-empty,
    .entries-loading {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 12px;
      font-style: italic;
      color: var(--text-light);
      padding: 16px 0 8px;
    }

    /* ── STATUS TOAST ── */
    .status-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-wb);
      border-top: 1px solid var(--circle-stroke);
      padding: 14px 24px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 300;
      font-style: italic;
      color: var(--text-mid);
      text-align: center;
      transform: translateY(100%);
      transition: transform 0.3s;
      z-index: 200;
    }

    .status-bar.show    { transform: translateY(0); }
    .status-bar.success { color: var(--text-dark); }
    .status-bar.error   { color: var(--text-mid); }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(42,40,37,0.18); border-radius: 4px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      #page { padding: 16px 12px 72px; }
      .card-label { font-size: 20px; }
    }
  </style>
</head>
<body>

<div id="site-header"></div>
<script src="/header.js"></script>

<div id="page">

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Notebook</h1>
      <p class="page-slogan">Write it down. Let it go.</p>
    </div>
  </div>

  <!-- WRITE CARD -->
  <div class="panel-card">
    <div class="card-top">
      <span class="card-label">New Entry</span>
      <div class="card-top-right">
        <div class="card-dots">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot dot-filled"></span>
        </div>
      </div>
    </div>
    <div class="card-body">

      <div class="field-label">Title</div>
      <input
        class="title-input"
        type="text"
        id="entry-title"
        placeholder="What's this about?"
        autocomplete="off"
      />

      <div class="field-label">Body</div>
      <div class="toolbar">
        <button class="toolbar-btn" title="Bold"      onclick="fmt('bold')"><b>B</b></button>
        <button class="toolbar-btn" title="Italic"    onclick="fmt('italic')"><i>I</i></button>
        <button class="toolbar-btn" title="Underline" onclick="fmt('underline')"><u>U</u></button>
        <div class="toolbar-divider"></div>
        <button class="toolbar-img-btn" onclick="document.getElementById('image-file-input').click()">+ Image</button>
        <input type="file" id="image-file-input" accept="image/*" multiple onchange="handleImageUpload(event)" style="display:none;" />
      </div>

      <div
        class="editor"
        id="entry-body"
        contenteditable="true"
        data-placeholder="Start writing..."
      ></div>

      <div class="image-preview-area" id="image-preview-area"></div>

      <div class="form-actions">
        <button class="save-btn" id="submit-btn" onclick="handleSubmit()">Save Entry</button>
      </div>

    </div>
  </div>

  <!-- ENTRIES CARD -->
  <div class="panel-card entries-card">
    <div class="entries-card-top" id="entries-card-top" onclick="toggleEntriesList()">
      <span class="entries-toggle-label">
        <span class="entries-arrow" id="toggle-arrow">▶</span>
        Past Entries
      </span>
      <button class="load-btn" id="load-btn" onclick="event.stopPropagation(); handleLoadEntries();">Load</button>
    </div>

    <div class="entries-body" id="entries-body">
      <div class="entries-inner">
        <div class="entries-loading" id="entries-loading" style="display:none;">Loading…</div>
        <div id="entries-items"></div>
      </div>
    </div>
  </div>

</div><!-- /page -->

<div class="status-bar" id="status-bar"></div>

<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>

<script>
  var CLIENT_ID     = '1014290983612-sg3a714jt49n6k8i77thbk3q065016dp.apps.googleusercontent.com';
  var SCOPE         = 'https://www.googleapis.com/auth/drive.file';
  var tokenClient;
  var gapiReady     = false;
  var pendingImages = [];
  var pendingAction = 'save';
  var entriesOpen   = false;

  // ── TOKEN STORAGE ──
  // We save the Google token in localStorage so the browser remembers it
  // between button clicks and page refreshes. A token lasts ~1 hour.
  var TOKEN_KEY = 'nb_google_token';
  var EXPIRY_KEY = 'nb_google_expiry';

  function saveToken(token, expiresInSeconds) {
    // expiresInSeconds is how long the token is valid (Google gives ~3600 = 1 hour)
    // We save the exact moment it expires so we can check later
    var expiryTime = Date.now() + (expiresInSeconds - 120) * 1000; // subtract 2 min buffer
    localStorage.setItem(TOKEN_KEY, token);
    localStorage.setItem(EXPIRY_KEY, String(expiryTime));
  }

  function getSavedToken() {
    var token  = localStorage.getItem(TOKEN_KEY);
    var expiry = localStorage.getItem(EXPIRY_KEY);
    if (!token || !expiry) return null;
    if (Date.now() > parseInt(expiry)) {
      // Token has expired — clear it out
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(EXPIRY_KEY);
      return null;
    }
    return token;
  }

  function applyToken(token) {
    // Tell the Google API library to use this token for all requests
    gapi.client.setToken({ access_token: token });
  }

  gapi.load('client', function() {
    gapi.client.init({}).then(function() {
      return gapi.client.load('https://www.googleapis.com/discovery/v1/apis/drive/v3/rest');
    }).then(function() {
      gapiReady = true;
      // If we have a saved token from a previous visit, apply it immediately
      // so the user doesn't need to sign in again
      var saved = getSavedToken();
      if (saved) applyToken(saved);
    });
  });

  window.addEventListener('load', function() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback: function(response) {
        if (response.error) {
          showStatus('Sign-in cancelled or failed.', 'error');
          document.getElementById('submit-btn').disabled = false;
          document.getElementById('load-btn').disabled   = false;
          return;
        }
        // Save the token so next time we don't need to ask Google again
        saveToken(response.access_token, response.expires_in || 3600);
        applyToken(response.access_token);

        if (pendingAction === 'load') loadEntries();
        else                          saveEntry();
      }
    });
  });

  // ── GET TOKEN — use saved one if valid, otherwise ask Google ──
  // This is the key function. Every action calls this instead of
  // going straight to Google's sign-in popup.
  function ensureToken(onReady) {
    if (!gapiReady) {
      showStatus('Still loading — try again in a moment.', 'error');
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('load-btn').disabled   = false;
      return;
    }

    var saved = getSavedToken();
    if (saved) {
      // We already have a valid token — use it right away, no popup needed
      applyToken(saved);
      onReady();
      return;
    }

    // No valid token — ask Google to sign in
    // prompt: '' means "try silently first, only show popup if really needed"
    tokenClient.requestAccessToken({ prompt: '' });
    // The callback above handles calling onReady after sign-in
  }

  // ── FORMATTING ──
  function fmt(command) {
    document.execCommand(command, false, null);
    document.getElementById('entry-body').focus();
  }

  // ── IMAGE HANDLING ──
  function handleImageUpload(event) {
    var files = Array.from(event.target.files);
    if (!files.length) return;
    files.forEach(function(file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var base64Data = e.target.result;
        var imageId = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        pendingImages.push({ id: imageId, data: base64Data, name: file.name });
        addPreviewThumb(imageId, base64Data);
      };
      reader.readAsDataURL(file);
    });
    event.target.value = '';
  }

  function addPreviewThumb(imageId, base64Data) {
    var area = document.getElementById('image-preview-area');
    var wrap = document.createElement('div');
    wrap.className = 'preview-thumb-wrap';
    wrap.id = 'thumb_' + imageId;
    var img = document.createElement('img');
    img.className = 'preview-thumb';
    img.src = base64Data;
    var removeBtn = document.createElement('button');
    removeBtn.className = 'preview-remove';
    removeBtn.textContent = '✕';
    removeBtn.onclick = function() { removeImage(imageId); };
    wrap.appendChild(img);
    wrap.appendChild(removeBtn);
    area.appendChild(wrap);
  }

  function removeImage(imageId) {
    pendingImages = pendingImages.filter(function(img) { return img.id !== imageId; });
    var thumb = document.getElementById('thumb_' + imageId);
    if (thumb) thumb.remove();
  }

  // ── SAVING ──
  function handleSubmit() {
    var title    = document.getElementById('entry-title').value.trim();
    var bodyText = document.getElementById('entry-body').innerText.trim();
    if (!title && !bodyText && pendingImages.length === 0) {
      showStatus('Nothing to save — write something first.', 'error');
      return;
    }
    pendingAction = 'save';
    document.getElementById('submit-btn').disabled = true;

    ensureToken(saveEntry);
  }

  async function saveEntry() {
    var title        = document.getElementById('entry-title').value.trim();
    var bodyHtml     = document.getElementById('entry-body').innerHTML.trim();
    var displayTitle = title || 'Untitled';
    var now          = new Date();
    var dateStr      = now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    var timeStr      = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    var fileDate     = now.toISOString().slice(0, 10);

    var imagesHtml = '';
    if (pendingImages.length > 0) {
      imagesHtml = '<div class="images-section">';
      pendingImages.forEach(function(img) {
        imagesHtml += '<img src="' + img.data + '" alt="' + escapeHtml(img.name) + '" style="max-width:100%;height:auto;display:block;margin:16px 0;" />';
      });
      imagesHtml += '</div>';
    }

    var fileContent =
      '<!DOCTYPE html>' +
      '<html><head><meta charset="UTF-8">' +
      '<title>' + escapeHtml(displayTitle) + '</title>' +
      '<style>' +
        'body { font-family: Georgia, serif; max-width: 620px; margin: 60px auto; padding: 0 24px; color: #222; line-height: 1.8; }' +
        'h1 { font-size: 26px; font-weight: normal; margin-bottom: 6px; }' +
        '.meta { color: #999; font-size: 13px; margin-bottom: 40px; }' +
        '.body { font-size: 16px; margin-bottom: 32px; }' +
        '.images-section img { max-width: 100%; height: auto; margin: 16px 0; display: block; }' +
      '</style>' +
      '</head><body>' +
      '<h1>' + escapeHtml(displayTitle) + '</h1>' +
      '<div class="meta">' + dateStr + ' at ' + timeStr + '</div>' +
      '<div class="body">' + bodyHtml + '</div>' +
      imagesHtml +
      '</body></html>';

    var fileName = fileDate + ' \u2014 ' + displayTitle + '.html';
    var boundary = 'nb_boundary_' + Date.now();
    var metadata = JSON.stringify({ name: fileName, mimeType: 'text/html' });
    var multipart =
      '--' + boundary + '\r\n' +
      'Content-Type: application/json\r\n\r\n' +
      metadata + '\r\n' +
      '--' + boundary + '\r\n' +
      'Content-Type: text/html\r\n\r\n' +
      fileContent + '\r\n' +
      '--' + boundary + '--';

    try {
      await gapi.client.request({
        path: '/upload/drive/v3/files',
        method: 'POST',
        params: { uploadType: 'multipart' },
        headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
        body: multipart
      });
      document.getElementById('entry-title').value = '';
      document.getElementById('entry-body').innerHTML = '';
      document.getElementById('image-preview-area').innerHTML = '';
      pendingImages = [];
      showStatus('Saved to Google Drive.', 'success');
      if (entriesOpen) loadEntries();
    } catch(e) {
      console.error('Drive save error:', e);
      // If save failed due to auth, clear the saved token so next attempt re-authenticates
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(EXPIRY_KEY);
      showStatus('Something went wrong. Try again.', 'error');
    }
    document.getElementById('submit-btn').disabled = false;
  }

  // ── LOADING ENTRIES ──
  function toggleEntriesList() {
    entriesOpen = !entriesOpen;
    var body  = document.getElementById('entries-body');
    var top   = document.getElementById('entries-card-top');
    var arrow = document.getElementById('toggle-arrow');
    body.classList.toggle('open', entriesOpen);
    top.classList.toggle('open', entriesOpen);
    arrow.classList.toggle('open', entriesOpen);
  }

  function handleLoadEntries() {
    if (!entriesOpen) toggleEntriesList();
    pendingAction = 'load';
    document.getElementById('load-btn').disabled = true;

    ensureToken(loadEntries);
  }

  async function loadEntries() {
    var loadingEl = document.getElementById('entries-loading');
    var itemsEl   = document.getElementById('entries-items');
    loadingEl.style.display = 'block';
    itemsEl.innerHTML = '';

    try {
      var response = await gapi.client.drive.files.list({
        q: "mimeType='text/html' and trashed=false",
        fields: 'files(id,name,createdTime)',
        orderBy: 'createdTime desc',
        pageSize: 100
      });

      var files = (response.result.files || []).filter(function(f) {
        return f.name && f.name.indexOf('\u2014') !== -1 && f.name.endsWith('.html');
      });

      loadingEl.style.display = 'none';

      if (files.length === 0) {
        itemsEl.innerHTML = '<div class="entries-empty">No entries yet.</div>';
        document.getElementById('load-btn').disabled = false;
        return;
      }

      files.forEach(function(file) {
        var name      = file.name.replace('.html', '');
        var parts     = name.split(' \u2014 ');
        var datepart  = parts[0] ? parts[0].trim() : '';
        var titlepart = parts.slice(1).join(' \u2014 ').trim() || 'Untitled';

        var item = document.createElement('div');
        item.className = 'entry-item';
        item.id = 'entry_' + file.id;

        var row = document.createElement('div');
        row.className = 'entry-row';
        row.onclick = function(e) {
          if (e.target.classList.contains('entry-delete-btn') || e.target.closest('.entry-delete-btn')) return;
          toggleEntryContent(file.id);
        };

        row.innerHTML =
          '<span class="entry-expand-arrow" id="arrow_' + file.id + '">▶</span>' +
          '<div class="entry-info">' +
            '<div class="entry-item-title">' + escapeHtml(titlepart) + '</div>' +
            '<div class="entry-item-date">'  + escapeHtml(datepart)  + '</div>' +
          '</div>' +
          '<button class="entry-delete-btn" onclick="handleDeleteEntry(\'' + file.id + '\', \'' + escapeHtml(titlepart).replace(/'/g, "\\'") + '\')">✕</button>';

        var contentArea = document.createElement('div');
        contentArea.className = 'entry-content';
        contentArea.id = 'content_' + file.id;

        item.appendChild(row);
        item.appendChild(contentArea);
        itemsEl.appendChild(item);
      });

    } catch(e) {
      console.error('Drive list error:', e);
      loadingEl.style.display = 'none';
      // If loading failed due to auth, clear the saved token
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(EXPIRY_KEY);
      itemsEl.innerHTML = '<div class="entries-empty">Could not load entries. Try again.</div>';
    }

    document.getElementById('load-btn').disabled = false;
  }

  // ── EXPANDING ENTRIES ──
  var openEntryId = null;

  async function toggleEntryContent(fileId) {
    var contentArea = document.getElementById('content_' + fileId);
    var arrow       = document.getElementById('arrow_' + fileId);

    if (openEntryId === fileId) {
      contentArea.classList.remove('open');
      arrow.classList.remove('open');
      openEntryId = null;
      return;
    }

    if (openEntryId) {
      var prev      = document.getElementById('content_' + openEntryId);
      var prevArrow = document.getElementById('arrow_'   + openEntryId);
      if (prev)      prev.classList.remove('open');
      if (prevArrow) prevArrow.classList.remove('open');
    }

    openEntryId = fileId;
    contentArea.classList.add('open');
    arrow.classList.add('open');

    if (contentArea.dataset.loaded === 'true') return;

    contentArea.innerHTML = '<div class="entry-content-loading">Loading…</div>';

    try {
      var response = await gapi.client.request({
        path: '/drive/v3/files/' + fileId,
        method: 'GET',
        params: { alt: 'media' }
      });
      var parser  = new DOMParser();
      var doc     = parser.parseFromString(response.body, 'text/html');
      var bodyDiv = doc.querySelector('.body');
      var imgDiv  = doc.querySelector('.images-section');
      var extracted = '';
      if (bodyDiv) extracted += bodyDiv.innerHTML;
      if (imgDiv)  extracted += imgDiv.innerHTML;
      if (!extracted.trim()) extracted = '<em>No content.</em>';
      contentArea.innerHTML = '<div class="entry-content-inner">' + extracted + '</div>';
      contentArea.dataset.loaded = 'true';
    } catch(e) {
      console.error('Drive read error:', e);
      contentArea.innerHTML = '<div class="entry-content-loading">Could not load content.</div>';
    }
  }

  // ── DELETING ──
  function handleDeleteEntry(fileId, title) {
    if (!window.confirm('Delete "' + title + '"? This cannot be undone.')) return;
    deleteEntry(fileId);
  }

  async function deleteEntry(fileId) {
    var row = document.getElementById('entry_' + fileId);
    if (row) row.style.opacity = '0.35';
    try {
      await gapi.client.drive.files.delete({ fileId: fileId });
      if (row) row.remove();
      var itemsEl = document.getElementById('entries-items');
      if (itemsEl && itemsEl.children.length === 0) {
        itemsEl.innerHTML = '<div class="entries-empty">No entries yet.</div>';
      }
      if (openEntryId === fileId) openEntryId = null;
      showStatus('Entry deleted.', 'success');
    } catch(e) {
      console.error('Drive delete error:', e);
      if (row) row.style.opacity = '1';
      showStatus('Could not delete. Try again.', 'error');
    }
  }

  // ── UTILITIES ──
  function escapeHtml(str) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(str || ''));
    return d.innerHTML;
  }

  function showStatus(msg, type) {
    var bar = document.getElementById('status-bar');
    bar.textContent = msg;
    bar.className = 'status-bar show ' + (type || '');
    if (type === 'success' || type === 'error') {
      setTimeout(function() { bar.className = 'status-bar'; }, 3500);
    }
  }
</script>
</body>
