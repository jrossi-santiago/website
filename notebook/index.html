<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notebook</title>
  <link href="https://fonts.googleapis.com/css2?family=Lustria&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111111;
      color: #e8e8e8;
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 32px 64px;
    }

    .page-title-block {
      margin: 40px 0 40px;
      padding-bottom: 28px;
      border-bottom: 1px solid #2a2a2a;
    }

    .page-title {
      font-family: 'Lustria', serif;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: normal;
      color: #e0e0e0;
      margin-bottom: 8px;
    }

    .page-slogan {
      font-size: 13px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      color: #555555;
      font-style: italic;
    }

    .write-form {
      margin-bottom: 48px;
    }

    .form-section-label {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 20px;
    }

    .field-label {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 6px;
    }

    .field-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #2a2a2a;
      color: #e0e0e0;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 14px;
      padding: 8px 0;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      margin-bottom: 28px;
    }

    .field-input:focus { border-bottom-color: #555555; }
    .field-input::placeholder { color: #333333; font-style: italic; }

    .toolbar {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .toolbar-btn {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #555555;
      font-size: 13px;
      width: 32px;
      height: 30px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .toolbar-btn:hover {
      border-color: #555555;
      color: #e0e0e0;
    }

    .toolbar-divider {
      width: 1px;
      background: #2a2a2a;
      margin: 0 4px;
    }

    .toolbar-img-btn {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #555555;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      height: 30px;
      padding: 0 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .toolbar-img-btn:hover {
      border-color: #555555;
      color: #e0e0e0;
    }

    .editor {
      background: transparent;
      border: none;
      border-bottom: 1px solid #2a2a2a;
      color: #e0e0e0;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 14px;
      line-height: 1.9;
      padding: 8px 0 20px;
      outline: none;
      min-height: 260px;
      transition: border-color 0.2s;
      width: 100%;
    }

    .editor:focus { border-bottom-color: #555555; }

    .editor:empty:before {
      content: attr(data-placeholder);
      color: #333333;
      font-style: italic;
      pointer-events: none;
    }

    .editor b, .editor strong { font-weight: 700; }
    .editor i, .editor em { font-style: italic; }
    .editor u { text-decoration: underline; }

    .editor img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 12px 0;
      opacity: 0.9;
    }

    .image-preview-area {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .preview-thumb-wrap {
      position: relative;
      display: inline-block;
    }

    .preview-thumb {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border: 1px solid #2a2a2a;
      display: block;
    }

    .preview-remove {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #111111;
      border: 1px solid #2a2a2a;
      color: #555555;
      font-size: 10px;
      width: 18px;
      height: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
      line-height: 1;
    }

    .preview-remove:hover { color: #e0e0e0; }

    #image-file-input { display: none; }

    .form-actions {
      margin-top: 28px;
      display: flex;
      justify-content: flex-end;
    }

    .submit-btn {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 13px;
      background: transparent;
      color: #e0e0e0;
      border: 1px solid #e0e0e0;
      padding: 10px 32px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .submit-btn:hover { background: #e0e0e0; color: #111111; }
    .submit-btn:disabled { border-color: #2a2a2a; color: #333333; cursor: not-allowed; background: transparent; }

    /* ── ENTRIES SECTION ── */

    .entries-section {
      margin-top: 8px;
      border-top: 1px solid #2a2a2a;
      padding-top: 32px;
    }

    .entries-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .entries-toggle {
      background: transparent;
      border: none;
      color: #555555;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .entries-toggle:hover { color: #e0e0e0; }

    .entries-toggle-arrow {
      font-size: 9px;
      transition: transform 0.2s;
      display: inline-block;
    }

    .entries-toggle-arrow.open { transform: rotate(90deg); }

    .load-btn {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 10px;
      background: transparent;
      color: #555555;
      border: 1px solid #2a2a2a;
      padding: 6px 16px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .load-btn:hover { border-color: #555555; color: #e0e0e0; }
    .load-btn:disabled { color: #333333; border-color: #1e1e1e; cursor: not-allowed; }

    .entries-list {
      display: none;
    }

    .entries-list.open {
      display: block;
    }

    .entry-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #1e1e1e;
      gap: 12px;
    }

    .entry-item:last-child { border-bottom: none; }

    .entry-info {
      flex: 1;
      min-width: 0;
    }

    .entry-item-title {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 14px;
      color: #c0c0c0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry-item-date {
      font-size: 11px;
      color: #444444;
      margin-top: 3px;
      font-style: italic;
    }

    .entry-delete-btn {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #444444;
      font-size: 11px;
      width: 24px;
      height: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
      margin-top: 2px;
    }

    .entry-delete-btn:hover { border-color: #888888; color: #e0e0e0; }

    .entries-empty {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 13px;
      font-style: italic;
      color: #444444;
      padding: 16px 0;
    }

    .entries-loading {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 13px;
      font-style: italic;
      color: #444444;
      padding: 16px 0;
    }

    /* ── STATUS BAR ── */

    .status-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      padding: 14px 24px;
      font-size: 13px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-style: italic;
      color: #555555;
      text-align: center;
      transform: translateY(100%);
      transition: transform 0.3s;
      z-index: 100;
    }

    .status-bar.show { transform: translateY(0); }
    .status-bar.success { color: #e0e0e0; }
    .status-bar.error { color: #888888; }

    @media (max-width: 480px) {
      .wrap { padding: 0 20px 48px; }
      .page-title { font-size: 26px; }
    }
  </style>
</head>
<body>

<div id="site-header"></div>
<script src="/header.js"></script>

<div class="wrap">

  <div class="page-title-block">
    <div class="page-title">Notebook</div>
    <div class="page-slogan">Write it down. Let it go.</div>
  </div>

  <div class="write-form">
    <div class="form-section-label">New entry</div>

    <div class="field-label">Title</div>
    <input
      class="field-input"
      type="text"
      id="entry-title"
      placeholder="What's this about?"
      autocomplete="off"
    />

    <div class="field-label">Body</div>

    <div class="toolbar">
      <button class="toolbar-btn" title="Bold" onclick="fmt('bold')"><b>B</b></button>
      <button class="toolbar-btn" title="Italic" onclick="fmt('italic')"><i>I</i></button>
      <button class="toolbar-btn" title="Underline" onclick="fmt('underline')"><u>U</u></button>
      <div class="toolbar-divider"></div>
      <button class="toolbar-img-btn" onclick="document.getElementById('image-file-input').click()">+ Image</button>
      <input type="file" id="image-file-input" accept="image/*" multiple onchange="handleImageUpload(event)" />
    </div>

    <div
      class="editor"
      id="entry-body"
      contenteditable="true"
      data-placeholder="Start writing..."
    ></div>

    <div class="image-preview-area" id="image-preview-area"></div>

    <div class="form-actions">
      <button class="submit-btn" id="submit-btn" onclick="handleSubmit()">Save Entry</button>
    </div>
  </div>

  <!-- ── PAST ENTRIES SECTION ── -->
  <div class="entries-section">
    <div class="entries-header">
      <button class="entries-toggle" onclick="toggleEntriesList()">
        <span class="entries-toggle-arrow" id="toggle-arrow">▶</span>
        Past entries
      </button>
      <button class="load-btn" id="load-btn" onclick="handleLoadEntries()">Load</button>
    </div>

    <div class="entries-list" id="entries-list">
      <div class="entries-loading" id="entries-loading" style="display:none;">Loading...</div>
      <div id="entries-items"></div>
    </div>
  </div>

</div>

<div class="status-bar" id="status-bar"></div>

<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>

<script>
  var CLIENT_ID = '1014290983612-sg3a714jt49n6k8i77thbk3q065016dp.apps.googleusercontent.com';
  var SCOPE = 'https://www.googleapis.com/auth/drive.file';

  var tokenClient;
  var gapiReady = false;
  var pendingImages = [];

  // pendingAction tracks what we do AFTER the user signs in:
  // 'save' means we're saving a new entry, 'load' means we're loading the list
  var pendingAction = 'save';

  // entriesOpen tracks whether the past entries list is showing or hidden
  var entriesOpen = false;

  gapi.load('client', function() {
    gapi.client.init({}).then(function() {
      return gapi.client.load('https://www.googleapis.com/discovery/v1/apis/drive/v3/rest');
    }).then(function() {
      gapiReady = true;
    });
  });

  window.addEventListener('load', function() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback: function(response) {
        if (response.error) {
          showStatus('Sign-in cancelled or failed.', 'error');
          document.getElementById('submit-btn').disabled = false;
          document.getElementById('load-btn').disabled = false;
          return;
        }
        // Once signed in, do whatever action was requested
        if (pendingAction === 'load') {
          loadEntries();
        } else {
          saveEntry();
        }
      }
    });
  });

  // ── FORMATTING ──

  function fmt(command) {
    document.execCommand(command, false, null);
    document.getElementById('entry-body').focus();
  }

  // ── IMAGE HANDLING ──

  function handleImageUpload(event) {
    var files = Array.from(event.target.files);
    if (!files.length) return;
    files.forEach(function(file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var base64Data = e.target.result;
        var imageId = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        pendingImages.push({ id: imageId, data: base64Data, name: file.name });
        addPreviewThumb(imageId, base64Data);
      };
      reader.readAsDataURL(file);
    });
    event.target.value = '';
  }

  function addPreviewThumb(imageId, base64Data) {
    var area = document.getElementById('image-preview-area');
    var wrap = document.createElement('div');
    wrap.className = 'preview-thumb-wrap';
    wrap.id = 'thumb_' + imageId;
    var img = document.createElement('img');
    img.className = 'preview-thumb';
    img.src = base64Data;
    var removeBtn = document.createElement('button');
    removeBtn.className = 'preview-remove';
    removeBtn.textContent = '✕';
    removeBtn.title = 'Remove image';
    removeBtn.onclick = function() { removeImage(imageId); };
    wrap.appendChild(img);
    wrap.appendChild(removeBtn);
    area.appendChild(wrap);
  }

  function removeImage(imageId) {
    pendingImages = pendingImages.filter(function(img) { return img.id !== imageId; });
    var thumb = document.getElementById('thumb_' + imageId);
    if (thumb) thumb.remove();
  }

  // ── SAVING ──

  function handleSubmit() {
    var title = document.getElementById('entry-title').value.trim();
    var bodyText = document.getElementById('entry-body').innerText.trim();

    if (!title && !bodyText && pendingImages.length === 0) {
      showStatus('Nothing to save — write something first.', 'error');
      return;
    }
    if (!gapiReady) {
      showStatus('Still loading — try again in a moment.', 'error');
      return;
    }

    pendingAction = 'save';
    document.getElementById('submit-btn').disabled = true;
    showStatus('Opening Google sign-in...', '');
    tokenClient.requestAccessToken({ prompt: '' });
  }

  async function saveEntry() {
    var title = document.getElementById('entry-title').value.trim();
    var bodyHtml = document.getElementById('entry-body').innerHTML.trim();
    var displayTitle = title || 'Untitled';
    var now = new Date();
    var dateStr = now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    var timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    var fileDate = now.toISOString().slice(0, 10);

    var imagesHtml = '';
    if (pendingImages.length > 0) {
      imagesHtml = '<div class="images-section">';
      pendingImages.forEach(function(img) {
        imagesHtml += '<img src="' + img.data + '" alt="' + escapeHtml(img.name) + '" style="max-width:100%;height:auto;display:block;margin:16px 0;" />';
      });
      imagesHtml += '</div>';
    }

    var fileContent =
      '<!DOCTYPE html>' +
      '<html><head><meta charset="UTF-8">' +
      '<title>' + escapeHtml(displayTitle) + '</title>' +
      '<style>' +
        'body { font-family: Georgia, serif; max-width: 620px; margin: 60px auto; padding: 0 24px; color: #222; line-height: 1.8; }' +
        'h1 { font-size: 26px; font-weight: normal; margin-bottom: 6px; }' +
        '.meta { color: #999; font-size: 13px; margin-bottom: 40px; }' +
        '.body { font-size: 16px; margin-bottom: 32px; }' +
        '.images-section img { max-width: 100%; height: auto; margin: 16px 0; display: block; }' +
      '</style>' +
      '</head><body>' +
      '<h1>' + escapeHtml(displayTitle) + '</h1>' +
      '<div class="meta">' + dateStr + ' at ' + timeStr + '</div>' +
      '<div class="body">' + bodyHtml + '</div>' +
      imagesHtml +
      '</body></html>';

    var fileName = fileDate + ' \u2014 ' + displayTitle + '.html';
    var boundary = 'nb_boundary_' + Date.now();
    var metadata = JSON.stringify({ name: fileName, mimeType: 'text/html' });

    var multipart =
      '--' + boundary + '\r\n' +
      'Content-Type: application/json\r\n\r\n' +
      metadata + '\r\n' +
      '--' + boundary + '\r\n' +
      'Content-Type: text/html\r\n\r\n' +
      fileContent + '\r\n' +
      '--' + boundary + '--';

    try {
      await gapi.client.request({
        path: '/upload/drive/v3/files',
        method: 'POST',
        params: { uploadType: 'multipart' },
        headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
        body: multipart
      });

      document.getElementById('entry-title').value = '';
      document.getElementById('entry-body').innerHTML = '';
      document.getElementById('image-preview-area').innerHTML = '';
      pendingImages = [];
      showStatus('Saved to Google Drive.', 'success');

      // Automatically refresh the entries list if it's open
      if (entriesOpen) {
        loadEntries();
      }

    } catch(e) {
      console.error('Drive save error:', e);
      showStatus('Something went wrong. Try again.', 'error');
    }

    document.getElementById('submit-btn').disabled = false;
  }

  // ── LOADING ENTRIES ──

  function toggleEntriesList() {
    entriesOpen = !entriesOpen;
    var list = document.getElementById('entries-list');
    var arrow = document.getElementById('toggle-arrow');
    if (entriesOpen) {
      list.classList.add('open');
      arrow.classList.add('open');
    } else {
      list.classList.remove('open');
      arrow.classList.remove('open');
    }
  }

  function handleLoadEntries() {
    if (!gapiReady) {
      showStatus('Still loading — try again in a moment.', 'error');
      return;
    }

    // Open the list if it isn't already
    if (!entriesOpen) {
      toggleEntriesList();
    }

    pendingAction = 'load';
    document.getElementById('load-btn').disabled = true;
    tokenClient.requestAccessToken({ prompt: '' });
  }

  async function loadEntries() {
    var loadingEl = document.getElementById('entries-loading');
    var itemsEl = document.getElementById('entries-items');

    loadingEl.style.display = 'block';
    itemsEl.innerHTML = '';

    try {
      // Ask Google Drive for all HTML files this app created,
      // sorted newest first. "trashed=false" means don't show deleted files.
      var response = await gapi.client.drive.files.list({
        q: "mimeType='text/html' and trashed=false",
        fields: 'files(id,name,createdTime)',
        orderBy: 'createdTime desc',
        pageSize: 100
      });

      var files = response.result.files || [];

      // Only show files that match our naming pattern (contain " — " and end in .html)
      // The \u2014 character is the em-dash we use in file names
      files = files.filter(function(f) {
        return f.name && f.name.indexOf('\u2014') !== -1 && f.name.endsWith('.html');
      });

      loadingEl.style.display = 'none';

      if (files.length === 0) {
        itemsEl.innerHTML = '<div class="entries-empty">No entries yet.</div>';
        document.getElementById('load-btn').disabled = false;
        return;
      }

      files.forEach(function(file) {
        // Parse the file name back into a date and title
        // File names look like: "2025-04-27 — My title.html"
        var name = file.name.replace('.html', '');
        var parts = name.split(' \u2014 ');
        var datepart = parts[0] ? parts[0].trim() : '';
        var titlepart = parts.slice(1).join(' \u2014 ').trim() || 'Untitled';

        var item = document.createElement('div');
        item.className = 'entry-item';
        item.id = 'entry_' + file.id;

        item.innerHTML =
          '<div class="entry-info">' +
            '<div class="entry-item-title">' + escapeHtml(titlepart) + '</div>' +
            '<div class="entry-item-date">' + escapeHtml(datepart) + '</div>' +
          '</div>' +
          '<button class="entry-delete-btn" title="Delete this entry" onclick="handleDeleteEntry(\'' + file.id + '\', \'' + escapeHtml(titlepart).replace(/'/g, "\\'") + '\')">✕</button>';

        itemsEl.appendChild(item);
      });

    } catch(e) {
      console.error('Drive list error:', e);
      loadingEl.style.display = 'none';
      itemsEl.innerHTML = '<div class="entries-empty">Could not load entries. Try again.</div>';
    }

    document.getElementById('load-btn').disabled = false;
  }

  // ── DELETING ──

  function handleDeleteEntry(fileId, title) {
    // Ask the user to confirm before deleting — this is permanent
    var confirmed = window.confirm('Delete "' + title + '"? This cannot be undone.');
    if (!confirmed) return;
    deleteEntry(fileId);
  }

  async function deleteEntry(fileId) {
    // Gray out the row immediately so the user knows something is happening
    var row = document.getElementById('entry_' + fileId);
    if (row) row.style.opacity = '0.3';

    try {
      // This tells Google Drive to permanently delete the file
      await gapi.client.drive.files.delete({ fileId: fileId });

      // Remove the row from the page smoothly
      if (row) row.remove();

      // If the list is now empty, show the empty message
      var itemsEl = document.getElementById('entries-items');
      if (itemsEl && itemsEl.children.length === 0) {
        itemsEl.innerHTML = '<div class="entries-empty">No entries yet.</div>';
      }

      showStatus('Entry deleted.', 'success');

    } catch(e) {
      console.error('Drive delete error:', e);
      if (row) row.style.opacity = '1';
      showStatus('Could not delete. Try again.', 'error');
    }
  }

  // ── UTILITIES ──

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(str || ''));
    return d.innerHTML;
  }

  function showStatus(msg, type) {
    var bar = document.getElementById('status-bar');
    bar.textContent = msg;
    bar.className = 'status-bar show ' + (type || '');
    if (type === 'success' || type === 'error') {
      setTimeout(function() { bar.className = 'status-bar'; }, 3500);
    }
  }
</script>
</body>
</html>
