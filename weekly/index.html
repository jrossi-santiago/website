<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly — Analog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Karla:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #2B2D22;
      --card:      #F5F2EB;
      --text-dark: #2A2825;
      --text-mid:  #76706A;
      --text-lt:   #B3ADA5;
      --line:      rgba(42,40,37,0.07);
      --shadow:    0 6px 32px rgba(0,0,0,0.28), 0 1px 6px rgba(0,0,0,0.14);
      --radius:    14px;
      --fd:        'Cormorant Garamond', Georgia, serif;
      --fb:        'Karla', system-ui, sans-serif;
    }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: var(--fb);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    #page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 80px;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .page-title {
      font-family: var(--fd);
      font-size: 19px;
      font-weight: 500;
      color: rgba(245,242,235,0.32);
      letter-spacing: 0.03em;
    }

    .page-week {
      font-family: var(--fb);
      font-size: 11px;
      font-weight: 300;
      color: rgba(245,242,235,0.2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── ACCORDION CARD ── */
    .week-card {
      width: 100%;
      max-width: 680px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: rise 0.45s cubic-bezier(0.22,1,0.36,1) both;
      position: relative;
    }

    .week-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.55);
      pointer-events: none;
      z-index: 2;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── DAY SECTIONS ── */
    .day-section { border-bottom: 1px solid var(--line); }
    .day-section:last-child { border-bottom: none; }

    .day-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 24px;
      cursor: pointer;
      background: transparent;
      border: none;
      text-align: left;
      transition: background 0.12s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .day-header:hover { background: rgba(42,40,37,0.025); }

    .day-header-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .day-name {
      font-family: var(--fd);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
    }

    .is-today .day-name  { color: var(--text-dark); }
    .is-past .day-name   { color: var(--text-mid); }
    .is-future .day-name { color: var(--text-lt); }

    .day-meta {
      font-family: var(--fb);
      font-size: 11px;
      font-weight: 300;
      color: var(--text-mid);
      letter-spacing: 0.05em;
    }

    .is-future .day-meta { color: var(--text-lt); }

    .day-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .day-prog {
      font-family: var(--fb);
      font-size: 10px;
      font-weight: 400;
      color: var(--text-lt);
      letter-spacing: 0.08em;
      min-width: 28px;
      text-align: right;
    }

    .day-chev {
      width: 14px;
      height: 14px;
      color: var(--text-lt);
      transition: transform 0.2s cubic-bezier(0.22,1,0.36,1);
      flex-shrink: 0;
    }

    .is-open .day-chev { transform: rotate(180deg); }

    /* ── DAY BODY ── */
    .day-body {
      display: none;
      padding: 0 24px 20px;
    }

    .is-open .day-body { display: block; }

    /* ── TASK LIST ── */
    .task-list { list-style: none; margin-bottom: 2px; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(42,40,37,0.05);
    }

    .task-item:last-of-type { border-bottom: none; }

    .empty-msg {
      font-family: var(--fb);
      font-size: 12px;
      font-style: italic;
      color: var(--text-lt);
      padding: 10px 0 8px;
    }

    /* Custom checkbox */
    .cb {
      width: 18px;
      height: 18px;
      border: 1.5px solid #C5BFB7;
      border-radius: 4px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.12s, background 0.12s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .cb.on { background: var(--text-dark); border-color: var(--text-dark); }
    .cb svg { display: none; width: 10px; height: 10px; color: var(--card); }
    .cb.on svg { display: block; }

    .task-txt {
      flex: 1;
      font-family: var(--fb);
      font-size: 14px;
      font-weight: 300;
      color: var(--text-dark);
      line-height: 1.4;
      transition: color 0.12s;
    }

    .task-item.done .task-txt {
      text-decoration: line-through;
      color: var(--text-lt);
    }

    .task-del {
      width: 24px;
      height: 24px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-lt);
      opacity: 0;
      transition: opacity 0.12s, color 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      touch-action: manipulation;
    }

    @media (hover: none) { .task-del { opacity: 0.35; } }
    .task-item:hover .task-del { opacity: 0.55; }
    .task-del:hover { opacity: 1 !important; color: var(--text-dark); }
    .task-del svg { width: 11px; height: 11px; }

    /* ── ADD TASK ── */
    .add-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .add-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(42,40,37,0.1);
      padding: 6px 0;
      font-family: var(--fb);
      font-size: 13px;
      font-weight: 300;
      font-style: italic;
      color: var(--text-mid);
      outline: none;
      transition: border-color 0.12s, color 0.12s;
    }

    .add-input::placeholder { color: #C5BFB7; }
    .add-input:focus {
      border-color: rgba(42,40,37,0.25);
      font-style: normal;
      color: var(--text-dark);
    }

    .add-btn {
      width: 26px;
      height: 26px;
      background: transparent;
      border: 1px solid rgba(42,40,37,0.15);
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-lt);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
      touch-action: manipulation;
      padding: 0;
    }

    .add-btn:hover {
      border-color: rgba(42,40,37,0.35);
      color: var(--text-dark);
      background: rgba(42,40,37,0.04);
    }

    .add-btn svg { width: 11px; height: 11px; }

    /* ── GRID SECTION ── */
    .grid-section {
      width: 100%;
      max-width: 680px;
      margin-top: 44px;
      animation: rise 0.5s 0.08s cubic-bezier(0.22,1,0.36,1) both;
    }

    .grid-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .grid-title {
      font-family: var(--fd);
      font-size: 16px;
      font-weight: 500;
      color: rgba(245,242,235,0.3);
      letter-spacing: 0.04em;
    }

    .grid-sub {
      font-family: var(--fb);
      font-size: 9px;
      font-weight: 300;
      color: rgba(245,242,235,0.15);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .grid-labels {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 5px;
    }

    .grid-lbl {
      font-family: var(--fb);
      font-size: 9px;
      font-weight: 400;
      color: rgba(245,242,235,0.2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
    }

    .grid-body {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .grid-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cell {
      aspect-ratio: 1;
      border-radius: 3px;
      position: relative;
      transition: transform 0.12s;
      cursor: default;
    }

    .cell:hover { transform: scale(1.2); z-index: 10; }

    /* Completion levels — cream fading in on dark olive */
    .lv0     { background: rgba(245,242,235,0.07); }
    .lv1     { background: rgba(245,242,235,0.20); }
    .lv2     { background: rgba(245,242,235,0.36); }
    .lv3     { background: rgba(245,242,235,0.52); }
    .lv4     { background: rgba(245,242,235,0.72); }
    .lv5     { background: rgba(245,242,235,0.92); }
    .future  { background: rgba(245,242,235,0.03); }
    .today-r { box-shadow: 0 0 0 1.5px rgba(245,242,235,0.4); }

    /* Tooltip */
    .cell .tip {
      position: absolute;
      bottom: calc(100% + 7px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18,20,13,0.95);
      color: rgba(245,242,235,0.88);
      font-family: var(--fb);
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.05em;
      padding: 5px 9px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 50;
    }

    .cell:hover .tip { opacity: 1; }

    /* ── SAVE TOAST ── */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(28,30,21,0.93);
      border: 1px solid rgba(245,242,235,0.1);
      border-radius: 8px;
      padding: 7px 14px;
      font-family: var(--fb);
      font-size: 11px;
      font-weight: 300;
      color: rgba(245,242,235,0.5);
      letter-spacing: 0.06em;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.18s, transform 0.18s;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(245,242,235,0.12); border-radius: 4px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      #page { padding: 16px 12px 64px; }
      .day-name { font-size: 19px; }
      .day-header { padding: 14px 18px; }
      .day-body { padding: 0 18px 18px; }
    }
  </style>
</head>
<body>

<div id="site-header"></div>
<script src="/header.js"></script>

<div id="page">

  <header class="page-header">
    <span class="page-title">Weekly</span>
    <span class="page-week" id="week-range"></span>
  </header>

  <div class="week-card" id="week-card">
    <div style="padding:44px 24px;font-family:var(--fb);font-size:13px;font-style:italic;color:#B3ADA5;text-align:center;">Loading…</div>
  </div>

  <div class="grid-section">
    <div class="grid-top">
      <span class="grid-title">Last 12 weeks</span>
      <span class="grid-sub">task completion</span>
    </div>
    <div class="grid-labels" id="grid-labels"></div>
    <div class="grid-body" id="grid-body"></div>
  </div>

</div>

<div class="toast" id="toast">Saved</div>

<script>
// ============================================================
//  CONFIG — your existing motivation Supabase project
// ============================================================
var DB  = 'https://urfsijczxmngbixprdkq.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZnNpamN6eG1uZ2JpeHByZGtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0OTU1NzIsImV4cCI6MjA5MTA3MTU3Mn0.KxNLu5Rg0A0IdxQbaAapDa-vmTkVmeUlub689o0ZOaM';

// ============================================================
//  CONSTANTS
// ============================================================
var DAYS   = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var DAYS_S = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ============================================================
//  STATE
// ============================================================
var weekData = {};   // { 'YYYY-MM-DD': [ {id,text,completed}, ... ] }
var histData = {};   // { 'YYYY-MM-DD': completion_pct }
var openDay  = null;
var toastTmr = null;

// ============================================================
//  DATE HELPERS
// ============================================================
function fmt(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function getMonday(d) {
  var c = new Date(d);
  var day = c.getDay();
  c.setDate(c.getDate() + (day === 0 ? -6 : 1 - day));
  c.setHours(0, 0, 0, 0);
  return c;
}

function getWeekDays() {
  var mon = getMonday(new Date());
  return Array.from({ length: 7 }, function(_, i) {
    var d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return d;
  });
}

function isToday(d) {
  var t = new Date();
  return d.getFullYear() === t.getFullYear() &&
         d.getMonth()    === t.getMonth()    &&
         d.getDate()     === t.getDate();
}

function isPast(d) {
  var t = new Date(); t.setHours(0,0,0,0);
  var c = new Date(d); c.setHours(0,0,0,0);
  return c < t;
}

function uid() { return Math.random().toString(36).slice(2, 11); }

function esc(s) {
  var el = document.createElement('div');
  el.appendChild(document.createTextNode(s));
  return el.innerHTML;
}

// ============================================================
//  API HELPERS
// ============================================================
function hdrs(extra) {
  return Object.assign({
    'Content-Type': 'application/json',
    'apikey': KEY,
    'Authorization': 'Bearer ' + KEY
  }, extra || {});
}

function api(path) {
  return fetch(DB + path, { headers: hdrs() })
    .then(function(r) { return r.text().then(function(t) { return t ? JSON.parse(t) : []; }); });
}

// ============================================================
//  TOAST
// ============================================================
function showSaved() {
  var el = document.getElementById('toast');
  el.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(function() { el.classList.remove('show'); }, 1600);
}

// ============================================================
//  SAVE TASKS
// ============================================================
function saveTasks(dk) {
  fetch(DB + '/rest/v1/weekly_tasks', {
    method: 'POST',
    headers: hdrs({ 'Prefer': 'resolution=merge-duplicates' }),
    body: JSON.stringify({ id: dk, tasks: weekData[dk] || [], updated_at: new Date().toISOString() })
  }).then(showSaved).catch(function(e) { console.error('Save error:', e); });
}

// ============================================================
//  TASK OPERATIONS
// ============================================================
function getTasks(dk) { return weekData[dk] || []; }

function setAndSave(dk, tasks) {
  weekData[dk] = tasks;
  saveTasks(dk);
  updateProg(dk);
}

function updateProg(dk) {
  var el = document.querySelector('.day-prog[data-d="' + dk + '"]');
  if (!el) return;
  var t = getTasks(dk);
  el.textContent = t.length === 0 ? '' : t.filter(function(x) { return x.completed; }).length + '/' + t.length;
}

function toggleTask(dk, id) {
  var tasks = getTasks(dk).map(function(t) {
    return t.id === id ? Object.assign({}, t, { completed: !t.completed }) : t;
  });
  setAndSave(dk, tasks);
  var item = document.querySelector('.task-item[data-id="' + id + '"]');
  if (!item) return;
  var task = tasks.find(function(t) { return t.id === id; });
  item.classList.toggle('done', task.completed);
  var cb = item.querySelector('.cb');
  cb.classList.toggle('on', task.completed);
  cb.setAttribute('aria-checked', String(task.completed));
}

function deleteTask(dk, id) {
  setAndSave(dk, getTasks(dk).filter(function(t) { return t.id !== id; }));
  var item = document.querySelector('.task-item[data-id="' + id + '"]');
  if (!item) return;
  item.style.cssText = 'opacity:0;transform:translateX(-8px);transition:opacity 0.14s,transform 0.14s;pointer-events:none;';
  setTimeout(function() {
    if (item.parentNode) item.parentNode.removeChild(item);
    var list = document.getElementById('tasks-' + dk);
    if (list && list.querySelectorAll('.task-item').length === 0) {
      list.innerHTML = '<li class="empty-msg">No tasks yet — add one below</li>';
    }
  }, 140);
}

function addTask(dk, input) {
  var text = input.value.trim();
  if (!text) return;
  var task = { id: uid(), text: text, completed: false };
  setAndSave(dk, getTasks(dk).concat(task));
  var list = document.getElementById('tasks-' + dk);
  if (list) {
    var em = list.querySelector('.empty-msg');
    if (em) list.removeChild(em);
    list.insertAdjacentHTML('beforeend', taskHTML(task));
  }
  input.value = '';
  input.focus();
}

// ============================================================
//  HTML BUILDERS
// ============================================================
function taskHTML(t) {
  return '<li class="task-item' + (t.completed ? ' done' : '') + '" data-id="' + t.id + '">' +
    '<div class="cb' + (t.completed ? ' on' : '') + '" role="checkbox" aria-checked="' + t.completed + '" tabindex="0">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">' +
        '<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>' +
      '</svg>' +
    '</div>' +
    '<span class="task-txt">' + esc(t.text) + '</span>' +
    '<button class="task-del" aria-label="Delete task" tabindex="-1">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">' +
        '<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>' +
      '</svg>' +
    '</button>' +
  '</li>';
}

function bodyHTML(dk) {
  var tasks = getTasks(dk);
  return '<ul class="task-list" id="tasks-' + dk + '">' +
    (tasks.length === 0
      ? '<li class="empty-msg">No tasks yet — add one below</li>'
      : tasks.map(taskHTML).join('')) +
    '</ul>' +
    '<div class="add-row">' +
      '<input class="add-input" type="text" placeholder="Add a new task…" autocomplete="off" />' +
      '<button class="add-btn" aria-label="Add task">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">' +
          '<path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>' +
        '</svg>' +
      '</button>' +
    '</div>';
}

// ============================================================
//  RENDER WEEK ACCORDION
// ============================================================
function renderWeek(weekDays) {
  var card = document.getElementById('week-card');
  card.innerHTML = '';

  weekDays.forEach(function(day, i) {
    var dk     = fmt(day);
    var tasks  = getTasks(dk);
    var done   = tasks.filter(function(t) { return t.completed; }).length;
    var prog   = tasks.length > 0 ? done + '/' + tasks.length : '';
    var state  = isToday(day) ? 'is-today' : (isPast(day) ? 'is-past' : 'is-future');
    var isOpen = openDay === dk;

    var section = document.createElement('div');
    section.className = 'day-section ' + state + (isOpen ? ' is-open' : '');

    var header = document.createElement('button');
    header.className = 'day-header';
    header.setAttribute('aria-expanded', String(isOpen));
    header.innerHTML =
      '<div class="day-header-left">' +
        '<span class="day-name">' + DAYS[i] + '</span>' +
        '<span class="day-meta">' + MONTHS[day.getMonth()] + ' ' + day.getDate() + '</span>' +
      '</div>' +
      '<div class="day-header-right">' +
        '<span class="day-prog" data-d="' + dk + '">' + prog + '</span>' +
        '<svg class="day-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">' +
          '<path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>' +
        '</svg>' +
      '</div>';

    var body = document.createElement('div');
    body.className = 'day-body';
    body.innerHTML = bodyHTML(dk);

    // Accordion toggle
    header.addEventListener('click', function() {
      var wasOpen = section.classList.contains('is-open');
      document.querySelectorAll('.day-section.is-open').forEach(function(s) {
        s.classList.remove('is-open');
        s.querySelector('.day-header').setAttribute('aria-expanded', 'false');
      });
      if (!wasOpen) {
        section.classList.add('is-open');
        header.setAttribute('aria-expanded', 'true');
        openDay = dk;
      } else {
        openDay = null;
      }
    });

    // Event delegation for task interactions
    body.addEventListener('click', function(e) {
      var cb  = e.target.closest('.cb');
      if (cb)  { toggleTask(dk, cb.closest('.task-item').dataset.id); return; }
      var del = e.target.closest('.task-del');
      if (del) { deleteTask(dk, del.closest('.task-item').dataset.id); return; }
      var btn = e.target.closest('.add-btn');
      if (btn) { addTask(dk, body.querySelector('.add-input')); return; }
    });

    body.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var inp = e.target.closest('.add-input');
        if (inp) { e.preventDefault(); addTask(dk, inp); return; }
      }
      if (e.key === 'Enter' || e.key === ' ') {
        var cb = e.target.closest('.cb');
        if (cb) { e.preventDefault(); toggleTask(dk, cb.closest('.task-item').dataset.id); }
      }
    });

    section.appendChild(header);
    section.appendChild(body);
    card.appendChild(section);
  });
}

// ============================================================
//  RENDER GRID
// ============================================================
function renderGrid() {
  var labelsEl = document.getElementById('grid-labels');
  var bodyEl   = document.getElementById('grid-body');
  labelsEl.innerHTML = '';
  bodyEl.innerHTML   = '';

  DAYS_S.forEach(function(d) {
    var el = document.createElement('div');
    el.className   = 'grid-lbl';
    el.textContent = d;
    labelsEl.appendChild(el);
  });

  var today    = new Date(); today.setHours(0,0,0,0);
  var todayStr = fmt(today);
  var start    = new Date(getMonday(today));
  start.setDate(start.getDate() - 11 * 7); // 11 weeks back from current Monday = 12 weeks total

  for (var w = 0; w < 12; w++) {
    var row = document.createElement('div');
    row.className = 'grid-row';

    for (var d = 0; d < 7; d++) {
      var cd  = new Date(start);
      cd.setDate(start.getDate() + w * 7 + d);
      var ds  = fmt(cd);
      var fut = cd > today;

      var cell = document.createElement('div');
      cell.className = 'cell';

      if (ds === todayStr) cell.classList.add('today-r');

      if (fut) {
        cell.classList.add('future');
      } else if (histData[ds] !== undefined) {
        var pct = histData[ds];
        var lv  = pct === 0 ? 0 : pct <= 20 ? 1 : pct <= 40 ? 2 : pct <= 60 ? 3 : pct <= 80 ? 4 : 5;
        cell.classList.add('lv' + lv);
      } else {
        cell.classList.add('lv0');
      }

      var tipTxt = MONTHS[cd.getMonth()] + ' ' + cd.getDate();
      tipTxt += fut ? ' · —' : histData[ds] !== undefined ? ' · ' + histData[ds] + '%' : ' · no tasks';

      var tip = document.createElement('div');
      tip.className   = 'tip';
      tip.textContent = tipTxt;
      cell.appendChild(tip);
      row.appendChild(cell);
    }

    bodyEl.appendChild(row);
  }
}

// ============================================================
//  ARCHIVE PAST DAYS
// ============================================================
function archivePast(pastRows, histRows) {
  var done = {};
  (histRows || []).forEach(function(h) { done[h.task_date] = true; });

  var toInsert = (pastRows || []).filter(function(r) {
    if (done[r.id]) return false;
    return (r.tasks || []).length > 0;
  }).map(function(r) {
    var t  = r.tasks || [];
    var c  = t.filter(function(x) { return x.completed; }).length;
    return { task_date: r.id, completion_pct: Math.round((c / t.length) * 100), total_tasks: t.length, completed_tasks: c };
  });

  if (!toInsert.length) return Promise.resolve();

  return fetch(DB + '/rest/v1/task_history', {
    method: 'POST',
    headers: hdrs({ 'Prefer': 'resolution=ignore-duplicates' }),
    body: JSON.stringify(toInsert)
  }).catch(function(e) { console.warn('Archive warn:', e); });
}

// ============================================================
//  BOOT
// ============================================================
(function init() {
  var weekDays = getWeekDays();
  var today    = new Date(); today.setHours(0,0,0,0);
  var todayStr = fmt(today);
  openDay = todayStr;

  // Week range label in header
  var mon = weekDays[0], sun = weekDays[6];
  document.getElementById('week-range').textContent =
    MONTHS[mon.getMonth()] + ' ' + mon.getDate() + ' – ' +
    MONTHS[sun.getMonth()] + ' ' + sun.getDate();

  // Grid window: 12 weeks back from current Monday
  var gridMon   = getMonday(today);
  var gridStart = new Date(gridMon);
  gridStart.setDate(gridMon.getDate() - 11 * 7);
  var gridStartStr = fmt(gridStart);

  var weekParam = '(' + weekDays.map(fmt).join(',') + ')';

  Promise.all([
    api('/rest/v1/weekly_tasks?id=in.' + weekParam),
    api('/rest/v1/weekly_tasks?id=gte.' + gridStartStr + '&id=lt.' + todayStr + '&order=id.asc'),
    api('/rest/v1/task_history?task_date=gte.' + gridStartStr + '&order=task_date.asc')
  ]).then(function(res) {
    var weekRows = Array.isArray(res[0]) ? res[0] : [];
    var pastRows = Array.isArray(res[1]) ? res[1] : [];
    var histRows = Array.isArray(res[2]) ? res[2] : [];

    weekRows.forEach(function(r) { weekData[r.id] = r.tasks || []; });
    histRows.forEach(function(h) { histData[h.task_date] = h.completion_pct; });

    renderWeek(weekDays);
    renderGrid();

    // Archive silently in background, then refresh grid
    archivePast(pastRows, histRows).then(function() {
      return api('/rest/v1/task_history?task_date=gte.' + gridStartStr + '&order=task_date.asc');
    }).then(function(fresh) {
      if (Array.isArray(fresh)) {
        histData = {};
        fresh.forEach(function(h) { histData[h.task_date] = h.completion_pct; });
        renderGrid();
      }
    }).catch(function() { /* grid already rendered, this is fine */ });

  }).catch(function(err) {
    console.error('Load error:', err);
    document.getElementById('week-card').innerHTML =
      '<div style="padding:44px 24px;text-align:center;font-family:var(--fb);font-size:13px;font-style:italic;color:#B3ADA5;">Could not connect — check that your Supabase tables are created</div>';
  });
})();
</script>
