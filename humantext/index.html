<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human Text</title>
  <link href="https://fonts.googleapis.com/css2?family=Lustria&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111111;
      color: #e8e8e8;
      font-family: 'Lato', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 32px 80px;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 48px 0 36px;
    }

    .page-header h1 {
      font-family: 'Lustria', serif;
      font-size: 2rem;
      font-weight: normal;
      color: #e0e0e0;
      letter-spacing: -0.5px;
    }

    .page-header p {
      margin-top: 6px;
      color: #555555;
      font-size: 0.88rem;
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    /* ── CARD ── */
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 16px;
    }

    /* ── SLIDER ── */
    .slider-section {
      margin-bottom: 28px;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .slider-labels span {
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #444444;
      transition: color 0.2s;
    }

    .slider-labels span.active {
      color: #e0e0e0;
    }

    .slider-track {
      position: relative;
      height: 4px;
      background: #2a2a2a;
      border-radius: 99px;
      cursor: pointer;
    }

    .slider-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: #e0e0e0;
      border-radius: 99px;
      transition: width 0.15s;
      pointer-events: none;
    }

    .slider-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      background: #e0e0e0;
      border-radius: 50%;
      cursor: grab;
      transition: left 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .slider-thumb:active { cursor: grabbing; }

    .mode-badge {
      display: inline-block;
      margin-top: 14px;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .mode-badge.subtle { background: #222222; color: #555555; border: 1px solid #2a2a2a; }
    .mode-badge.human  { background: #2a2200; color: #a88a00; border: 1px solid #3a3000; }
    .mode-badge.ceo    { background: #e0e0e0; color: #111111; }

    /* ── LABEL ── */
    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 10px;
    }

    /* ── TEXTAREA ── */
    textarea {
      width: 100%;
      background: #111111;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #e0e0e0;
      font-size: 0.92rem;
      line-height: 1.7;
      padding: 14px;
      resize: vertical;
      min-height: 160px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #444444;
    }

    textarea::placeholder { color: #333333; }

    /* ── BUTTON ── */
    .btn {
      width: 100%;
      padding: 14px;
      background: #e0e0e0;
      color: #111111;
      border: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 14px;
      font-family: 'Lato', sans-serif;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: #ffffff; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { background: #2a2a2a; color: #444444; cursor: not-allowed; transform: none; }

    /* ── LOADING ── */
    .loading-wrap {
      text-align: center;
      padding: 48px 0;
      display: none;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #2a2a2a;
      border-top-color: #e0e0e0;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-wrap p {
      color: #444444;
      font-size: 0.82rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── RESULTS ── */
    .results { display: none; }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .result-text {
      background: #111111;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 16px;
      font-size: 0.92rem;
      line-height: 1.75;
      color: #e0e0e0;
      font-weight: 300;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .highlight {
      background: #3a3000;
      color: #e0c040;
      border-radius: 3px;
      padding: 1px 3px;
    }

    .highlight-ceo {
      background: #2a1a00;
      color: #e08030;
      border-radius: 3px;
      padding: 1px 3px;
    }

    .copy-btn {
      background: #222222;
      color: #555555;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      transition: all 0.2s;
    }

    .copy-btn:hover { background: #2a2a2a; color: #e0e0e0; }
    .copy-btn.copied { background: #1a2a1a; color: #50a050; border-color: #2a3a2a; }

    .iphone-footer {
      font-size: 0.82rem;
      color: #444444;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2a2a2a;
      display: none;
      font-weight: 300;
    }

    /* ── CHANGES LIST ── */
    .changes-list {
      list-style: none;
      padding: 0;
    }

    .changes-list li {
      padding: 9px 0 9px 20px;
      border-bottom: 1px solid #1e1e1e;
      font-size: 0.85rem;
      color: #555555;
      font-weight: 300;
      line-height: 1.5;
      position: relative;
    }

    .changes-list li:last-child { border-bottom: none; }

    .changes-list li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: #333333;
    }

    /* ── ERROR ── */
    .error-box {
      background: #1e0000;
      border: 1px solid #3a1010;
      border-radius: 10px;
      padding: 12px 14px;
      color: #c07070;
      font-size: 0.85rem;
      font-weight: 300;
      display: none;
      margin-top: 12px;
    }

    /* ── RESET ── */
    .reset-btn {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #444444;
      border-radius: 10px;
      padding: 12px;
      width: 100%;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .reset-btn:hover { border-color: #444444; color: #e0e0e0; }

    @media (max-width: 480px) {
      .wrap { padding: 0 20px 60px; }
      .page-header h1 { font-size: 1.6rem; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="/header.js"></script>

  <div class="wrap">

    <div class="page-header">
      <h1>Human Text</h1>
      <p>Make AI emails sound real.</p>
    </div>

    <!-- Input card -->
    <div class="card">

      <!-- Slider -->
      <div class="slider-section">
        <div class="slider-labels">
          <span id="label-subtle">Subtle</span>
          <span id="label-human">Human</span>
          <span id="label-ceo">CEO</span>
        </div>
        <div class="slider-track" id="sliderTrack">
          <div class="slider-fill" id="sliderFill"></div>
          <div class="slider-thumb" id="sliderThumb"></div>
        </div>
        <div>
          <span class="mode-badge human" id="modeBadge">Human</span>
        </div>
      </div>

      <label>Your AI-written email</label>
      <textarea id="inputText" placeholder="Paste your AI email here..."></textarea>
      <div class="error-box" id="errorBox"></div>
      <button class="btn" id="humanizeBtn" onclick="humanize()">Humanize it →</button>

    </div>

    <!-- Loading -->
    <div class="loading-wrap" id="loadingWrap">
      <div class="spinner"></div>
      <p id="loadingMsg">Making it sound human...</p>
    </div>

    <!-- Results -->
    <div class="results" id="results">

      <div class="card">
        <div class="result-header">
          <label style="margin-bottom:0">Humanized</label>
          <button class="copy-btn" id="copyBtn" onclick="copyText()">Copy</button>
        </div>
        <div class="result-text" id="rewrittenText"></div>
        <div class="iphone-footer" id="iphoneFooter">Sent from my iPhone</div>
      </div>

      <div class="card">
        <label>What changed</label>
        <ul class="changes-list" id="changesList"></ul>
      </div>

      <button class="reset-btn" onclick="reset()">← Start over</button>

    </div>

  </div>

<script>
  // ── SLIDER ──────────────────────────────────────────
  const track = document.getElementById('sliderTrack');
  const thumb = document.getElementById('sliderThumb');
  const fill  = document.getElementById('sliderFill');
  const badge = document.getElementById('modeBadge');

  let sliderValue = 0.5;

  const loadingMessages = {
    subtle: 'Softening the edges...',
    human:  'Making it sound human...',
    ceo:    'Stripping it down to nothing...'
  };

  function getMode(val) {
    if (val < 0.33) return 'subtle';
    if (val < 0.67) return 'human';
    return 'ceo';
  }

  function updateSlider(val) {
    sliderValue = Math.max(0, Math.min(1, val));
    const pct = sliderValue * 100;

    thumb.style.left = pct + '%';
    fill.style.width = pct + '%';

    const mode = getMode(sliderValue);

    ['subtle','human','ceo'].forEach(m => {
      document.getElementById('label-' + m).classList.toggle('active', m === mode);
    });

    badge.textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
    badge.className = 'mode-badge ' + mode;
  }

  updateSlider(0.5);

  let dragging = false;

  thumb.addEventListener('mousedown', () => dragging = true);
  thumb.addEventListener('touchstart', () => dragging = true, { passive: true });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const rect = track.getBoundingClientRect();
    updateSlider((e.clientX - rect.left) / rect.width);
  });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    const rect = track.getBoundingClientRect();
    updateSlider((e.touches[0].clientX - rect.left) / rect.width);
  }, { passive: true });

  document.addEventListener('mouseup',  () => dragging = false);
  document.addEventListener('touchend', () => dragging = false);

  track.addEventListener('click', e => {
    const rect = track.getBoundingClientRect();
    updateSlider((e.clientX - rect.left) / rect.width);
  });

  // ── DIFF HIGHLIGHT ──────────────────────────────────
  function buildHighlightedHTML(original, rewritten, mode) {
    const origWords = original.trim().split(/\s+/);
    const newWords  = rewritten.trim().split(/\s+/);

    const m = origWords.length;
    const n = newWords.length;
    const cap = 300;
    const om = Math.min(m, cap);
    const nm = Math.min(n, cap);
    const dp = Array.from({length: om + 1}, () => new Array(nm + 1).fill(0));

    for (let i = 1; i <= om; i++) {
      for (let j = 1; j <= nm; j++) {
        if (origWords[i-1].toLowerCase().replace(/[^a-z0-9]/g,'') ===
            newWords[j-1].toLowerCase().replace(/[^a-z0-9]/g,'')) {
          dp[i][j] = dp[i-1][j-1] + 1;
        } else {
          dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
        }
      }
    }

    const inLCS = new Array(Math.min(n, cap)).fill(false);
    let i = om, j = nm;
    while (i > 0 && j > 0) {
      const ow = origWords[i-1].toLowerCase().replace(/[^a-z0-9]/g,'');
      const nw = newWords[j-1].toLowerCase().replace(/[^a-z0-9]/g,'');
      if (ow === nw) {
        inLCS[j-1] = true;
        i--; j--;
      } else if (dp[i-1][j] > dp[i][j-1]) {
        i--;
      } else {
        j--;
      }
    }

    const hlClass = mode === 'ceo' ? 'highlight-ceo' : 'highlight';

    const htmlParts = newWords.map((word, idx) => {
      const changed = idx < cap ? !inLCS[idx] : true;
      if (changed) {
        return `<span class="${hlClass}">${escapeHTML(word)}</span>`;
      }
      return escapeHTML(word);
    });

    return htmlParts.join(' ');
  }

  function escapeHTML(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── HUMANIZE ────────────────────────────────────────
  let lastOriginal = '';

  async function humanize() {
    const text = document.getElementById('inputText').value.trim();
    const errorBox = document.getElementById('errorBox');
    const btn = document.getElementById('humanizeBtn');
    const mode = getMode(sliderValue);

    errorBox.style.display = 'none';

    if (!text) {
      errorBox.textContent = 'Please paste an email first.';
      errorBox.style.display = 'block';
      return;
    }

    if (text.length < 20) {
      errorBox.textContent = 'Paste a full email for best results.';
      errorBox.style.display = 'block';
      return;
    }

    lastOriginal = text;

    btn.disabled = true;
    btn.textContent = 'Working...';
    document.getElementById('loadingMsg').textContent = loadingMessages[mode];
    document.getElementById('loadingWrap').style.display = 'block';
    document.getElementById('results').style.display = 'none';

    try {
      const response = await fetch('/api/humanize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, mode })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Something went wrong');

      let rewritten = data.rewritten;
      let showIphone = false;

      if (mode === 'ceo') {
        rewritten = rewritten.replace(/\n?sent from my iphone\.?/gi, '').trim();
        showIphone = true;
      }

      const highlighted = buildHighlightedHTML(lastOriginal, rewritten, mode);
      document.getElementById('rewrittenText').innerHTML = highlighted;
      document.getElementById('iphoneFooter').style.display = showIphone ? 'block' : 'none';

      const changesList = document.getElementById('changesList');
      changesList.innerHTML = '';
      const lines = (data.changes || '').split('\n').filter(l => l.trim().length > 0);
      lines.forEach(line => {
        const li = document.createElement('li');
        li.textContent = line.replace(/^[-•*]\s*/, '').trim();
        changesList.appendChild(li);
      });

      document.getElementById('loadingWrap').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      document.getElementById('loadingWrap').style.display = 'none';
      errorBox.textContent = '⚠️ ' + err.message;
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Humanize it →';
    }
  }

  function copyText() {
    const text = document.getElementById('rewrittenText').innerText;
    const footer = document.getElementById('iphoneFooter');
    const full = footer.style.display !== 'none'
      ? text + '\n\nSent from my iPhone'
      : text;

    navigator.clipboard.writeText(full).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function reset() {
    document.getElementById('results').style.display = 'none';
    document.getElementById('inputText').value = '';
    document.getElementById('humanizeBtn').disabled = false;
    document.getElementById('humanizeBtn').textContent = 'Humanize it →';
    document.getElementById('errorBox').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
