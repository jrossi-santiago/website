<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human Text</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Karla:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #2B2D22;
      --card:          #F5F2EB;
      --card-alt:      #E8E4DA;
      --text-dark:     #2A2825;
      --text-mid:      #76706A;
      --text-light:    #B3ADA5;
      --circle-stroke: #C5BFB7;
      --line-rule:     rgba(42, 40, 37, 0.07);
      --shadow-card:   0 6px 32px rgba(0,0,0,0.28), 0 1px 6px rgba(0,0,0,0.14);
      --radius-lg:     14px;
      --radius-md:     10px;
      --font-display:  'Cormorant Garamond', Georgia, serif;
      --font-body:     'Karla', system-ui, sans-serif;
    }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      font-family: var(--font-body);
      color: var(--text-dark);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Noise texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* ── PAGE ── */
    #page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 56px;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 500;
      color: rgba(255,255,255,0.32);
      letter-spacing: 0.03em;
    }

    .page-subtitle {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 300;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.1em;
    }

    /* ── CARD ── */
    .panel-card {
      width: 100%;
      max-width: 680px;
      background: var(--card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
      animation: cardRise 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .panel-card:nth-child(2) { animation-delay: 0.05s; }
    .panel-card:nth-child(3) { animation-delay: 0.10s; }

    /* Subtle inner border — same as Daily */
    .panel-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255,255,255,0.55);
      pointer-events: none;
      z-index: 2;
    }

    .panel-card.alt { background: var(--card-alt); }

    @keyframes cardRise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── CARD TOP ── */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--line-rule);
    }

    .card-label {
      font-family: var(--font-display);
      font-size: 23px;
      font-weight: 500;
      color: var(--text-dark);
      letter-spacing: 0.01em;
      line-height: 1;
    }

    .card-dots {
      display: flex;
      flex-direction: column;
      gap: 3.5px;
      margin-top: 2px;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      border: 1px solid var(--circle-stroke);
      display: block;
    }

    .dot-filled { background: var(--circle-stroke); border-color: var(--circle-stroke); }

    /* ── CARD BODY ── */
    .card-body { padding: 22px 22px 22px; }

    /* ── EYEBROW LABEL ── */
    .eyebrow {
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-light);
      display: block;
      margin-bottom: 10px;
    }

    /* ── SLIDER ── */
    .slider-section { margin-bottom: 24px; }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .slider-labels span {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-light);
      transition: color 0.2s;
    }

    .slider-labels span.active { color: var(--text-dark); font-weight: 500; }

    .slider-track {
      position: relative;
      height: 3px;
      background: var(--circle-stroke);
      border-radius: 99px;
      cursor: pointer;
    }

    .slider-fill {
      position: absolute;
      left: 0; top: 0;
      height: 100%;
      background: var(--text-dark);
      border-radius: 99px;
      transition: width 0.15s;
      pointer-events: none;
    }

    .slider-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
      background: var(--text-dark);
      border-radius: 50%;
      cursor: grab;
      transition: left 0.15s;
      box-shadow: 0 2px 8px rgba(42,40,37,0.25);
    }

    .slider-thumb:active { cursor: grabbing; }

    .mode-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 3px 11px;
      border-radius: 99px;
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .mode-badge.subtle {
      background: rgba(42,40,37,0.06);
      color: var(--text-light);
      border: 1px solid var(--circle-stroke);
    }

    .mode-badge.human {
      background: rgba(42,40,37,0.10);
      color: var(--text-mid);
      border: 1px solid var(--circle-stroke);
    }

    .mode-badge.ceo {
      background: var(--text-dark);
      color: var(--card);
      border: 1px solid var(--text-dark);
    }

    /* ── DIVIDER ── */
    .divider {
      border: none;
      border-top: 1px solid var(--line-rule);
      margin: 20px 0;
    }

    /* ── TEXTAREA ── */
    textarea {
      width: 100%;
      background: rgba(42,40,37,0.04);
      border: 1px solid var(--circle-stroke);
      border-radius: var(--radius-md);
      color: var(--text-dark);
      font-size: 14px;
      line-height: 1.75;
      padding: 14px;
      resize: vertical;
      min-height: 160px;
      font-family: var(--font-body);
      font-weight: 300;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--text-mid);
    }

    textarea::placeholder {
      color: var(--text-light);
      font-style: italic;
      font-size: 13px;
    }

    /* ── BUTTON ── */
    .btn {
      width: 100%;
      padding: 13px;
      background: var(--text-dark);
      color: var(--card);
      border: none;
      border-radius: var(--radius-md);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 14px;
      font-family: var(--font-body);
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:active { transform: scale(0.99); }

    .btn:disabled {
      background: var(--circle-stroke);
      color: var(--text-light);
      cursor: not-allowed;
      transform: none;
    }

    /* ── ERROR ── */
    .error-box {
      background: rgba(160,80,60,0.08);
      border: 1px solid rgba(160,80,60,0.2);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      color: rgba(140,60,40,0.9);
      font-size: 12px;
      font-weight: 300;
      display: none;
      margin-top: 12px;
    }

    /* ── LOADING ── */
    .loading-wrap {
      width: 100%;
      max-width: 680px;
      text-align: center;
      padding: 40px 0;
      display: none;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--circle-stroke);
      border-top-color: var(--text-dark);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-wrap p {
      color: rgba(255,255,255,0.25);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: var(--font-body);
    }

    /* ── RESULTS ── */
    .results { display: none; width: 100%; max-width: 680px; }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .result-text {
      font-family: var(--font-display);
      font-size: 16px;
      line-height: 1.85;
      color: var(--text-dark);
      font-weight: 500;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .highlight {
      background: rgba(196,160,102,0.22);
      color: #7A5C20;
      border-radius: 3px;
      padding: 1px 3px;
    }

    .highlight-ceo {
      background: rgba(42,40,37,0.10);
      color: var(--text-mid);
      border-radius: 3px;
      padding: 1px 3px;
    }

    .copy-btn {
      background: transparent;
      color: var(--text-light);
      border: 1px solid var(--circle-stroke);
      border-radius: 8px;
      padding: 5px 13px;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 400;
      transition: all 0.2s;
    }

    .copy-btn:hover { color: var(--text-dark); border-color: var(--text-mid); }

    .copy-btn.copied {
      background: rgba(42,40,37,0.06);
      color: var(--text-mid);
      border-color: var(--circle-stroke);
    }

    .iphone-footer {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--text-light);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line-rule);
      display: none;
      font-weight: 300;
      font-style: italic;
    }

    /* ── CHANGES LIST ── */
    .changes-list { list-style: none; padding: 0; }

    .changes-list li {
      padding: 9px 0 9px 18px;
      border-bottom: 1px solid var(--line-rule);
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-mid);
      font-weight: 300;
      line-height: 1.6;
      position: relative;
    }

    .changes-list li:last-child { border-bottom: none; }

    .changes-list li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--text-light);
      font-size: 11px;
    }

    /* ── RESET ── */
    .reset-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.22);
      border-radius: var(--radius-md);
      padding: 11px;
      width: 100%;
      max-width: 680px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 300;
      transition: all 0.2s;
      margin-top: 6px;
    }

    .reset-btn:hover { border-color: rgba(255,255,255,0.22); color: rgba(255,255,255,0.4); }

    @media (max-width: 480px) {
      #page { padding: 16px 12px 48px; }
      .card-label { font-size: 20px; }
    }
  </style>
</head>
<body>

<div id="site-header"></div>
<script src="/header.js"></script>

<div id="page">

  <!-- PAGE HEADER -->
  <header class="page-header">
    <span class="page-title">Human Text</span>
    <span class="page-subtitle">Make AI emails sound real.</span>
  </header>

  <!-- INPUT CARD -->
  <div class="panel-card">
    <div class="card-top">
      <span class="card-label">Humanize</span>
      <div class="card-dots">
        <span class="dot"></span>
        <span class="dot dot-filled"></span>
        <span class="dot dot-filled"></span>
      </div>
    </div>

    <div class="card-body">

      <!-- Slider -->
      <div class="slider-section">
        <div class="slider-labels">
          <span id="label-subtle">Subtle</span>
          <span id="label-human">Human</span>
          <span id="label-ceo">CEO</span>
        </div>
        <div class="slider-track" id="sliderTrack">
          <div class="slider-fill" id="sliderFill"></div>
          <div class="slider-thumb" id="sliderThumb"></div>
        </div>
        <span class="mode-badge human" id="modeBadge">Human</span>
      </div>

      <hr class="divider" />

      <span class="eyebrow">Your AI-written email</span>
      <textarea id="inputText" placeholder="Paste your AI email here…"></textarea>
      <div class="error-box" id="errorBox"></div>
      <button class="btn" id="humanizeBtn" onclick="humanize()">Humanize it →</button>

    </div>
  </div>

  <!-- LOADING -->
  <div class="loading-wrap" id="loadingWrap">
    <div class="spinner"></div>
    <p id="loadingMsg">Making it sound human…</p>
  </div>

  <!-- RESULTS -->
  <div class="results" id="results">

    <div class="panel-card alt">
      <div class="card-top">
        <span class="card-label">Rewritten</span>
        <button class="copy-btn" id="copyBtn" onclick="copyText()">Copy</button>
      </div>
      <div class="card-body">
        <div class="result-text" id="rewrittenText"></div>
        <div class="iphone-footer" id="iphoneFooter">Sent from my iPhone</div>
      </div>
    </div>

    <div class="panel-card">
      <div class="card-top">
        <span class="card-label">What changed</span>
        <div class="card-dots">
          <span class="dot dot-filled"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
      <div class="card-body">
        <ul class="changes-list" id="changesList"></ul>
      </div>
    </div>

    <button class="reset-btn" onclick="reset()">← Start over</button>

  </div>

</div><!-- /page -->

<script>
  // ── SLIDER ──────────────────────────────────────────
  const track = document.getElementById('sliderTrack');
  const thumb = document.getElementById('sliderThumb');
  const fill  = document.getElementById('sliderFill');
  const badge = document.getElementById('modeBadge');

  let sliderValue = 0.5;

  const loadingMessages = {
    subtle: 'Softening the edges…',
    human:  'Making it sound human…',
    ceo:    'Stripping it down to nothing…'
  };

  function getMode(val) {
    if (val < 0.33) return 'subtle';
    if (val < 0.67) return 'human';
    return 'ceo';
  }

  function updateSlider(val) {
    sliderValue = Math.max(0, Math.min(1, val));
    const pct = sliderValue * 100;
    thumb.style.left = pct + '%';
    fill.style.width = pct + '%';
    const mode = getMode(sliderValue);
    ['subtle','human','ceo'].forEach(m => {
      document.getElementById('label-' + m).classList.toggle('active', m === mode);
    });
    badge.textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
    badge.className = 'mode-badge ' + mode;
  }

  updateSlider(0.5);

  let dragging = false;
  thumb.addEventListener('mousedown', () => dragging = true);
  thumb.addEventListener('touchstart', () => dragging = true, { passive: true });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const rect = track.getBoundingClientRect();
    updateSlider((e.clientX - rect.left) / rect.width);
  });
  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    const rect = track.getBoundingClientRect();
    updateSlider((e.touches[0].clientX - rect.left) / rect.width);
  }, { passive: true });
  document.addEventListener('mouseup',  () => dragging = false);
  document.addEventListener('touchend', () => dragging = false);
  track.addEventListener('click', e => {
    const rect = track.getBoundingClientRect();
    updateSlider((e.clientX - rect.left) / rect.width);
  });

  // ── DIFF HIGHLIGHT ──────────────────────────────────
  function buildHighlightedHTML(original, rewritten, mode) {
    const origWords = original.trim().split(/\s+/);
    const newWords  = rewritten.trim().split(/\s+/);
    const m = origWords.length;
    const n = newWords.length;
    const cap = 300;
    const om = Math.min(m, cap);
    const nm = Math.min(n, cap);
    const dp = Array.from({length: om + 1}, () => new Array(nm + 1).fill(0));
    for (let i = 1; i <= om; i++) {
      for (let j = 1; j <= nm; j++) {
        if (origWords[i-1].toLowerCase().replace(/[^a-z0-9]/g,'') ===
            newWords[j-1].toLowerCase().replace(/[^a-z0-9]/g,'')) {
          dp[i][j] = dp[i-1][j-1] + 1;
        } else {
          dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
        }
      }
    }
    const inLCS = new Array(Math.min(n, cap)).fill(false);
    let i = om, j = nm;
    while (i > 0 && j > 0) {
      const ow = origWords[i-1].toLowerCase().replace(/[^a-z0-9]/g,'');
      const nw = newWords[j-1].toLowerCase().replace(/[^a-z0-9]/g,'');
      if (ow === nw) { inLCS[j-1] = true; i--; j--; }
      else if (dp[i-1][j] > dp[i][j-1]) { i--; }
      else { j--; }
    }
    const hlClass = mode === 'ceo' ? 'highlight-ceo' : 'highlight';
    return newWords.map((word, idx) => {
      const changed = idx < cap ? !inLCS[idx] : true;
      return changed
        ? `<span class="${hlClass}">${escapeHTML(word)}</span>`
        : escapeHTML(word);
    }).join(' ');
  }

  function escapeHTML(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── HUMANIZE ────────────────────────────────────────
  let lastOriginal = '';

  async function humanize() {
    const text = document.getElementById('inputText').value.trim();
    const errorBox = document.getElementById('errorBox');
    const btn = document.getElementById('humanizeBtn');
    const mode = getMode(sliderValue);

    errorBox.style.display = 'none';

    if (!text) {
      errorBox.textContent = 'Please paste an email first.';
      errorBox.style.display = 'block';
      return;
    }

    if (text.length < 20) {
      errorBox.textContent = 'Paste a full email for best results.';
      errorBox.style.display = 'block';
      return;
    }

    lastOriginal = text;
    btn.disabled = true;
    btn.textContent = 'Working…';
    document.getElementById('loadingMsg').textContent = loadingMessages[mode];
    document.getElementById('loadingWrap').style.display = 'block';
    document.getElementById('results').style.display = 'none';

    try {
      const response = await fetch('/api/humanize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, mode })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Something went wrong');

      let rewritten = data.rewritten;
      let showIphone = false;

      if (mode === 'ceo') {
        rewritten = rewritten.replace(/\n?sent from my iphone\.?/gi, '').trim();
        showIphone = true;
      }

      const highlighted = buildHighlightedHTML(lastOriginal, rewritten, mode);
      document.getElementById('rewrittenText').innerHTML = highlighted;
      document.getElementById('iphoneFooter').style.display = showIphone ? 'block' : 'none';

      const changesList = document.getElementById('changesList');
      changesList.innerHTML = '';
      const lines = (data.changes || '').split('\n').filter(l => l.trim().length > 0);
      lines.forEach(line => {
        const li = document.createElement('li');
        li.textContent = line.replace(/^[-•*]\s*/, '').trim();
        changesList.appendChild(li);
      });

      document.getElementById('loadingWrap').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      document.getElementById('loadingWrap').style.display = 'none';
      errorBox.textContent = '⚠️ ' + err.message;
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Humanize it →';
    }
  }

  function copyText() {
    const text = document.getElementById('rewrittenText').innerText;
    const footer = document.getElementById('iphoneFooter');
    const full = footer.style.display !== 'none'
      ? text + '\n\nSent from my iPhone'
      : text;
    navigator.clipboard.writeText(full).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function reset() {
    document.getElementById('results').style.display = 'none';
    document.getElementById('inputText').value = '';
    document.getElementById('humanizeBtn').disabled = false;
    document.getElementById('humanizeBtn').textContent = 'Humanize it →';
    document.getElementById('errorBox').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
