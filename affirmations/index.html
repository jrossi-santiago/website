<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Affirmations</title>
  <link href="https://fonts.googleapis.com/css2?family=Lustria&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111111;
      color: #e8e8e8;
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── STREAK ── */
    #streak-display {
      text-align: center;
      padding: 12px 24px;
      font-size: 11px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: #555555;
      border-bottom: 1px solid #2a2a2a;
      text-transform: uppercase;
    }

    #streak-display span {
      font-family: 'Lustria', serif;
      color: #e0e0e0;
      font-size: 14px;
      margin-left: 6px;
    }

    /* ── MAIN ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
    }

    /* ── LOADING ── */
    #loading-view {
      text-align: center;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #333333;
    }

    /* ── ACTIVE VIEW ── */
    #active-view {
      display: none;
      text-align: center;
      max-width: 560px;
      width: 100%;
    }

    #dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 48px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2a2a2a;
      transition: background 0.3s;
    }

    .dot.done { background: #555555; }
    .dot.current { background: #e0e0e0; }

    #progress-indicator {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #333333;
      margin-bottom: 10px;
    }

    #category-label {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 32px;
    }

    #prompt-text {
      font-family: 'Lustria', serif;
      font-size: clamp(18px, 3vw, 24px);
      line-height: 1.8;
      color: #e0e0e0;
      margin-bottom: 52px;
    }

    #type-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #2a2a2a;
      color: #e0e0e0;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 16px;
      padding: 10px 0;
      outline: none;
      text-align: center;
      caret-color: #e0e0e0;
      transition: border-color 0.2s;
    }

    #type-input::placeholder {
      color: #333333;
      font-style: italic;
      font-size: 13px;
    }

    #type-input:focus { border-bottom-color: #555555; }
    #type-input.error { border-bottom-color: #333333; color: #444444; }
    #type-input.success { border-bottom-color: #e0e0e0; color: #e0e0e0; }

    #hint-text {
      margin-top: 14px;
      font-size: 12px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      color: transparent;
      font-style: italic;
      min-height: 18px;
      transition: color 0.2s;
    }

    #hint-text.visible { color: #555555; }

    /* ── LOCKED VIEW ── */
    #locked-view {
      display: none;
      text-align: center;
      max-width: 560px;
      width: 100%;
    }

    #locked-heading {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 48px;
    }

    .locked-item {
      margin-bottom: 32px;
      text-align: left;
    }

    .locked-category {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 8px;
    }

    .locked-text {
      font-family: 'Lustria', serif;
      font-size: 16px;
      line-height: 1.8;
      color: #e0e0e0;
    }

    #time-remaining {
      margin-top: 52px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 11px;
      color: #333333;
      letter-spacing: 0.1em;
    }

    @media (max-width: 480px) {
      #main { padding: 32px 20px; justify-content: flex-start; padding-top: 48px; }
    }
  </style>
</head>
<body>

<div id="site-header"></div>
<script src="/header.js"></script>

<div id="streak-display">
  Streak <span id="streak-count">0</span>
</div>

<div id="main">

  <div id="loading-view">Loading…</div>

  <div id="active-view">
    <div id="dots"></div>
    <div id="progress-indicator"></div>
    <div id="category-label"></div>
    <div id="prompt-text"></div>
    <input
      id="type-input"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="type it here and press Enter"
    />
    <div id="hint-text"></div>
  </div>

  <div id="locked-view">
    <div id="locked-heading">Today's Five</div>
    <div id="locked-items-list"></div>
    <div id="time-remaining"></div>
  </div>

</div>

<!-- Supabase library loaded from CDN (CDN = a public server that hosts the library for free) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/affirmations/data.js"></script>
<script>

  // ── SUPABASE SETUP ──
  // Replace the two values below with your own from the Supabase dashboard
  const SUPABASE_URL  = 'https://rvwyjipseusvqjqbwken.supabase.co';
  const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2d3lqaXBzZXVzdnFqcWJ3a2VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDA4MDAsImV4cCI6MjA5MjAxNjgwMH0.UFYPZndWuY3uDOWovjxa7qreidWM9sacUlIS9iteMXc';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);
  const ROW_ID = 'me';

  // ── DATABASE HELPERS ──

  async function loadFromDB() {
    const { data, error } = await db
      .from('affirmations_progress')
      .select('*')
      .eq('id', ROW_ID)
      .single();
    if (error) { console.error('Load error:', error); return null; }
    return data;
  }

  async function saveToDB(streak, lastDay, sess) {
    const { error } = await db
      .from('affirmations_progress')
      .upsert({ id: ROW_ID, streak: streak, last_day: lastDay, session: sess });
    if (error) { console.error('Save error:', error); }
  }

  // ── HELPERS ──

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pickFive() {
    const affPick  = shuffle(AFFIRMATIONS)[0];
    const goalPick = shuffle(GOALS)[0];
    const used = [
      { text: affPick,  category: 'Affirmation' },
      { text: goalPick, category: 'Goal' },
    ];
    const remaining = [
      ...AFFIRMATIONS.filter(x => x !== affPick).map(x => ({ text: x, category: 'Affirmation' })),
      ...GOALS.filter(x => x !== goalPick).map(x => ({ text: x, category: 'Goal' })),
    ];
    const extra = shuffle(remaining).slice(0, 3);
    return shuffle([...used, ...extra]);
  }

  function updateStreakDisplay(n) {
    document.getElementById('streak-count').textContent = n;
  }

  // ── STATE ──
  // These variables hold the current state while the page is open
  let currentStreak  = 0;
  let currentLastDay = '';
  let session        = null;
  let currentIndex   = 0;
  let timerInterval  = null;

  // ── COUNTDOWN ──

  function startCountdown() {
    function tick() {
      const midnight = new Date();
      midnight.setHours(24, 0, 0, 0);
      const diff = midnight.getTime() - Date.now();
      if (diff <= 0) {
        clearInterval(timerInterval);
        setTimeout(() => location.reload(), 1000);
        return;
      }
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      document.getElementById('time-remaining').textContent =
        `Resets in ${h}h ${m}m ${s}s`;
    }
    tick();
    timerInterval = setInterval(tick, 1000);
  }

  // ── VIEWS ──

  function showLocked(sess) {
    document.getElementById('loading-view').style.display = 'none';
    document.getElementById('active-view').style.display  = 'none';
    document.getElementById('locked-view').style.display  = 'block';
    const list = document.getElementById('locked-items-list');
    list.innerHTML = '';
    sess.items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'locked-item';
      div.innerHTML = `
        <div class="locked-category">${item.category}</div>
        <div class="locked-text">${item.text}</div>
      `;
      list.appendChild(div);
    });
    startCountdown();
  }

  function buildDots(items, idx) {
    const dotsEl = document.getElementById('dots');
    dotsEl.innerHTML = '';
    items.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i < idx ? ' done' : i === idx ? ' current' : '');
      dotsEl.appendChild(dot);
    });
  }

  function showItem(idx) {
    const item = session.items[idx];
    document.getElementById('progress-indicator').textContent = `${idx + 1} of 5`;
    document.getElementById('category-label').textContent = item.category;
    document.getElementById('prompt-text').textContent = item.text;
    document.getElementById('type-input').value = '';
    document.getElementById('type-input').className = '';
    document.getElementById('hint-text').textContent = '';
    document.getElementById('hint-text').className = 'hint-text';
    buildDots(session.items, idx);
    setTimeout(() => document.getElementById('type-input').focus(), 50);
  }

  function showActiveView() {
    document.getElementById('loading-view').style.display = 'none';
    document.getElementById('active-view').style.display  = 'block';
    document.getElementById('locked-view').style.display  = 'none';
    currentIndex = session.completedCount;
    showItem(currentIndex);
  }

  // ── INPUT HANDLER ──

  document.getElementById('type-input').addEventListener('keydown', async function(e) {
    if (e.key !== 'Enter') return;
    const typed   = this.value.trim();
    const correct = session.items[currentIndex].text.trim();

    if (typed === correct) {
      this.className = 'success';
      session.completedCount++;

      if (session.completedCount === 5) {
        // All five done — update streak
        const today = todayStr();
        if (currentLastDay !== today) {
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          const yStr = `${yesterday.getFullYear()}-${yesterday.getMonth()}-${yesterday.getDate()}`;
          if (currentLastDay === yStr) {
            currentStreak++;
          } else {
            currentStreak = 1;
          }
          currentLastDay = today;
        }
        updateStreakDisplay(currentStreak);
        // Save completed session + updated streak to database
        await saveToDB(currentStreak, currentLastDay, session);
        setTimeout(() => showLocked(session), 700);
      } else {
        // Save progress so far to database
        await saveToDB(currentStreak, currentLastDay, session);
        setTimeout(() => { currentIndex = session.completedCount; showItem(currentIndex); }, 700);
      }

    } else {
      this.className = 'error';
      const hint = document.getElementById('hint-text');
      hint.textContent = 'Not quite — type it exactly as shown above.';
      hint.className = 'hint-text visible';
      setTimeout(() => {
        this.value = '';
        this.className = '';
        hint.textContent = '';
        hint.className = 'hint-text';
      }, 1400);
    }
  });

  // ── INIT ──

  async function init() {
    // Show loading while we fetch from the database
    document.getElementById('loading-view').style.display = 'block';
    document.getElementById('active-view').style.display  = 'none';
    document.getElementById('locked-view').style.display  = 'none';

    const record = await loadFromDB();
    const today  = todayStr();

    if (record) {
      currentStreak  = record.streak    || 0;
      currentLastDay = record.last_day  || '';
      const savedSession = record.session || null;

      updateStreakDisplay(currentStreak);

      if (savedSession && savedSession.day === today) {
        session = savedSession;
        if (session.completedCount >= 5) {
          showLocked(session);
        } else {
          showActiveView();
        }
      } else {
        // New day — pick fresh five
        session = { day: today, items: pickFive(), completedCount: 0 };
        await saveToDB(currentStreak, currentLastDay, session);
        showActiveView();
      }
    } else {
      // No record found — start fresh
      updateStreakDisplay(0);
      session = { day: today, items: pickFive(), completedCount: 0 };
      await saveToDB(0, '', session);
      showActiveView();
    }
  }

  init();
</script>
</body>
</html>
