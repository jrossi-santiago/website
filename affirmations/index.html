<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Affirmations</title>
  <link href="https://fonts.googleapis.com/css2?family=Lustria&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111111;
      color: #e8e8e8;
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── PROFILE PIC ── */
    .site-image {
      padding: 60px 0 40px;
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
      padding-left: 32px;
      padding-right: 32px;
    }

    .site-image a { display: inline-block; }

    .site-image img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      filter: invert(1);
      border: 1px solid #333333;
      transition: opacity 0.2s;
    }

    .site-image img:hover { opacity: 0.7; }

    /* ── STREAK ── */
    #streak-display {
      text-align: center;
      padding: 12px 24px;
      font-size: 11px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: #555555;
      border-bottom: 1px solid #2a2a2a;
      text-transform: uppercase;
    }

    #streak-display span {
      font-family: 'Lustria', serif;
      color: #e0e0e0;
      font-size: 14px;
      margin-left: 6px;
    }

    /* ── MAIN ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
    }

    /* ── ACTIVE VIEW ── */
    #active-view {
      display: none;
      text-align: center;
      max-width: 560px;
      width: 100%;
    }

    #dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 48px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2a2a2a;
      transition: background 0.3s;
    }

    .dot.done { background: #555555; }
    .dot.current { background: #e0e0e0; }

    #progress-indicator {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #333333;
      margin-bottom: 10px;
    }

    #category-label {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 32px;
    }

    #prompt-text {
      font-family: 'Lustria', serif;
      font-size: clamp(18px, 3vw, 24px);
      line-height: 1.8;
      color: #e0e0e0;
      margin-bottom: 52px;
    }

    #type-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #2a2a2a;
      color: #e0e0e0;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 16px;
      padding: 10px 0;
      outline: none;
      text-align: center;
      caret-color: #e0e0e0;
      transition: border-color 0.2s;
    }

    #type-input::placeholder {
      color: #333333;
      font-style: italic;
      font-size: 13px;
    }

    #type-input:focus { border-bottom-color: #555555; }
    #type-input.error { border-bottom-color: #333333; color: #444444; }
    #type-input.success { border-bottom-color: #e0e0e0; color: #e0e0e0; }

    #hint-text {
      margin-top: 14px;
      font-size: 12px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      color: transparent;
      font-style: italic;
      min-height: 18px;
      transition: color 0.2s;
    }

    #hint-text.visible { color: #555555; }

    /* ── LOCKED VIEW ── */
    #locked-view {
      display: none;
      text-align: center;
      max-width: 560px;
      width: 100%;
    }

    #locked-heading {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 48px;
    }

    .locked-item {
      margin-bottom: 32px;
      text-align: left;
    }

    .locked-category {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 8px;
    }

    .locked-text {
      font-family: 'Lustria', serif;
      font-size: 16px;
      line-height: 1.8;
      color: #e0e0e0;
    }

    #time-remaining {
      margin-top: 52px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 11px;
      color: #333333;
      letter-spacing: 0.1em;
    }

    @media (max-width: 480px) {
      .site-image { padding: 40px 20px 28px; }
      #main { padding: 32px 20px; justify-content: flex-start; padding-top: 48px; }
    }
  </style>
</head>
<body>

  <div class="site-image">
    <a href="/"><img src="/sketch.png" alt="home"></a>
  </div>

  <div id="streak-display">
    Streak <span id="streak-count">0</span>
  </div>

  <div id="main">

    <div id="active-view">
      <div id="dots"></div>
      <div id="progress-indicator"></div>
      <div id="category-label"></div>
      <div id="prompt-text"></div>
      <input
        id="type-input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="type it here and press Enter"
      />
      <div id="hint-text"></div>
    </div>

    <div id="locked-view">
      <div id="locked-heading">Today's Five</div>
      <div id="locked-items-list"></div>
      <div id="time-remaining"></div>
    </div>

  </div>

  <script src="/affirmations/data.js"></script>
  <script>
    const KEY_SESSION  = 'dp_session';
    const KEY_STREAK   = 'dp_streak';
    const KEY_LAST_DAY = 'dp_last_day';

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickFive() {
      const affPick  = shuffle(AFFIRMATIONS)[0];
      const goalPick = shuffle(GOALS)[0];
      const used = [
        { text: affPick,  category: 'Affirmation' },
        { text: goalPick, category: 'Goal' },
      ];
      const remaining = [
        ...AFFIRMATIONS.filter(x => x !== affPick).map(x => ({ text: x, category: 'Affirmation' })),
        ...GOALS.filter(x => x !== goalPick).map(x => ({ text: x, category: 'Goal' })),
      ];
      const extra = shuffle(remaining).slice(0, 3);
      return shuffle([...used, ...extra]);
    }

    function saveSession(s) {
      localStorage.setItem(KEY_SESSION, JSON.stringify(s));
    }

    function loadSession() {
      try { return JSON.parse(localStorage.getItem(KEY_SESSION)); }
      catch { return null; }
    }

    function loadStreak() {
      return parseInt(localStorage.getItem(KEY_STREAK) || '0', 10);
    }

    function getLastDay() {
      return localStorage.getItem(KEY_LAST_DAY) || '';
    }

    function updateStreakDisplay(n) {
      document.getElementById('streak-count').textContent = n;
    }

    let timerInterval = null;

    function startCountdown() {
      function tick() {
        const midnight = new Date();
        midnight.setHours(24, 0, 0, 0);
        const diff = midnight.getTime() - Date.now();
        if (diff <= 0) {
          clearInterval(timerInterval);
          setTimeout(() => location.reload(), 1000);
          return;
        }
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        document.getElementById('time-remaining').textContent =
          `Resets in ${h}h ${m}m ${s}s`;
      }
      tick();
      timerInterval = setInterval(tick, 1000);
    }

    function showLocked(sess) {
      document.getElementById('active-view').style.display = 'none';
      document.getElementById('locked-view').style.display = 'block';
      const list = document.getElementById('locked-items-list');
      list.innerHTML = '';
      sess.items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'locked-item';
        div.innerHTML = `
          <div class="locked-category">${item.category}</div>
          <div class="locked-text">${item.text}</div>
        `;
        list.appendChild(div);
      });
      startCountdown();
    }

    let currentIndex = 0;
    let session = null;

    function buildDots(items, idx) {
      const dotsEl = document.getElementById('dots');
      dotsEl.innerHTML = '';
      items.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'dot' + (i < idx ? ' done' : i === idx ? ' current' : '');
        dotsEl.appendChild(dot);
      });
    }

    function showItem(idx) {
      const item = session.items[idx];
      document.getElementById('progress-indicator').textContent = `${idx + 1} of 5`;
      document.getElementById('category-label').textContent = item.category;
      document.getElementById('prompt-text').textContent = item.text;
      document.getElementById('type-input').value = '';
      document.getElementById('type-input').className = '';
      document.getElementById('hint-text').textContent = '';
      document.getElementById('hint-text').className = 'hint-text';
      buildDots(session.items, idx);
      setTimeout(() => document.getElementById('type-input').focus(), 50);
    }

    function showActiveView() {
      document.getElementById('active-view').style.display = 'block';
      document.getElementById('locked-view').style.display = 'none';
      currentIndex = session.completedCount;
      showItem(currentIndex);
    }

    document.getElementById('type-input').addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      const typed   = this.value.trim();
      const correct = session.items[currentIndex].text.trim();
      if (typed === correct) {
        this.className = 'success';
        session.completedCount++;
        saveSession(session);
        if (session.completedCount === 5) {
          const today   = todayStr();
          const lastDay = getLastDay();
          let streak    = loadStreak();
          if (lastDay !== today) {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yStr = `${yesterday.getFullYear()}-${yesterday.getMonth()}-${yesterday.getDate()}`;
            if (lastDay === yStr) {
              streak++;
            } else {
              streak = 1;
            }
            localStorage.setItem(KEY_STREAK, streak);
            localStorage.setItem(KEY_LAST_DAY, today);
          }
          updateStreakDisplay(streak);
          setTimeout(() => showLocked(session), 700);
        } else {
          setTimeout(() => {
            currentIndex = session.completedCount;
            showItem(currentIndex);
          }, 700);
        }
      } else {
        this.className = 'error';
        const hint = document.getElementById('hint-text');
        hint.textContent = 'Not quite — type it exactly as shown above.';
        hint.className = 'hint-text visible';
        setTimeout(() => {
          this.value = '';
          this.className = '';
          hint.textContent = '';
          hint.className = 'hint-text';
        }, 1400);
      }
    });

    function init() {
      const stored = loadSession();
      const today  = todayStr();
      updateStreakDisplay(loadStreak());
      if (stored && stored.day === today) {
        session = stored;
        if (session.completedCount >= 5) {
          showLocked(session);
        } else {
          showActiveView();
        }
      } else {
        session = { day: today, items: pickFive(), completedCount: 0 };
        saveSession(session);
        showActiveView();
      }
    }

    init();
  </script>
</body>
</html>
