<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No Excuses</title>
  <link href="https://fonts.googleapis.com/css2?family=Lustria&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111111;
      color: #e8e8e8;
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
    }

    /* ── PAGE WRAP ── */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 32px 64px;
    }

    /* ── PROFILE PIC ── */
    .site-image {
      padding: 60px 0 40px;
    }

    .site-image img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      filter: invert(1);
      border: 1px solid #333333;
      transition: opacity 0.2s;
    }

    .site-image img:hover { opacity: 0.7; }

    /* ── PAGE TITLE ── */
    .page-title {
      margin-bottom: 48px;
      padding-bottom: 28px;
      border-bottom: 1px solid #2a2a2a;
    }

    .page-title h1 {
      font-family: 'Lustria', serif;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: normal;
      color: #e0e0e0;
      margin-bottom: 8px;
    }

    .page-title p {
      font-size: 13px;
      color: #555555;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-style: italic;
    }

    .send-btn {
      float: right;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 13px;
      background: transparent;
      color: #e0e0e0;
      border: 1px solid #e0e0e0;
      padding: 10px 28px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .send-btn:hover {
      background: #e0e0e0;
      color: #111111;
    }

    .send-btn:disabled {
      border-color: #2a2a2a;
      color: #333333;
      cursor: not-allowed;
      background: transparent;
    }

    /* ── SECTION ── */
    .section {
      margin-bottom: 56px;
    }

    .section-title {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a2a;
    }

    /* ── TEXTAREA ── */
    textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #2a2a2a;
      color: #e0e0e0;
      font-family: 'Lustria', serif;
      font-size: 16px;
      padding: 10px 0;
      resize: none;
      min-height: 80px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-bottom-color: #555555; }

    textarea::placeholder {
      color: #333333;
      font-style: italic;
      font-size: 13px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .fire-btn {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 13px;
      background: transparent;
      color: #e0e0e0;
      border: 1px solid #e0e0e0;
      padding: 10px 28px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .fire-btn:hover {
      background: #e0e0e0;
      color: #111111;
    }

    /* ── GOALS LIST ── */
    .goals-list {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
    }

    .goal-item {
      padding: 16px 0;
      border-bottom: 1px solid #1e1e1e;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .goal-item:last-child { border-bottom: none; }

    .goal-item p {
      font-family: 'Lustria', serif;
      font-size: 15px;
      line-height: 1.7;
      flex: 1;
      color: #e0e0e0;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #333333;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 4px;
      line-height: 1;
      flex-shrink: 0;
      font-family: 'Lato', sans-serif;
      transition: color 0.15s;
    }

    .delete-btn:hover { color: #e0e0e0; }

    /* ── UPLOAD ── */
    .upload-area {
      border: 1px solid #2a2a2a;
      padding: 36px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .upload-area:hover { border-color: #555555; }

    .upload-area p {
      color: #555555;
      font-size: 13px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-style: italic;
    }

    .upload-area .upload-icon {
      font-size: 20px;
      margin-bottom: 10px;
      display: block;
      color: #333333;
    }

    /* ── IMAGE GRID ── */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .image-card {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
    }

    .image-card.pinned { border: 2px solid #e0e0e0; }

    .image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-card .img-delete {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(17,17,17,0.85);
      border: none;
      color: #555555;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .image-card .img-delete:hover { color: #e0e0e0; }

    .image-card .img-pin {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(17,17,17,0.85);
      border: none;
      color: #555555;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .image-card .img-pin:hover { color: #e0e0e0; }
    .image-card.pinned .img-pin { color: #e0e0e0; }

    .pin-legend {
      font-size: 11px;
      color: #555555;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      margin-top: 12px;
      font-style: italic;
    }

    .uploading-indicator {
      color: #555555;
      font-size: 13px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-style: italic;
      margin-top: 12px;
      display: none;
    }

    .empty-state {
      color: #333333;
      font-size: 13px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-style: italic;
      padding: 8px 0;
    }

    /* ── STATUS BAR ── */
    .status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      padding: 14px 24px;
      font-size: 13px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-style: italic;
      color: #555555;
      text-align: center;
      transform: translateY(100%);
      transition: transform 0.3s;
      z-index: 100;
    }

    .status-bar.show { transform: translateY(0); }
    .status-bar.success { color: #e0e0e0; }
    .status-bar.error { color: #888888; }

    @media (max-width: 480px) {
      .container { padding: 0 20px 48px; }
      .site-image { padding: 40px 0 28px; }
      .upload-area { padding: 24px; }
      .page-title h1 { font-size: 24px; }
      .send-btn { float: none; width: 100%; margin-bottom: 16px; }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="site-image">
      <a href="/"><img src="/sketch.jpg" alt="home"></a>
    </div>

    <div class="page-title">
      <button class="send-btn" id="sendNowBtn">Send Now</button>
      <h1>No Excuses</h1>
      <p>Your personal accountability system</p>
    </div>

    <div class="section">
      <div class="section-title">Goals &amp; Why You're Doing This</div>
      <textarea id="goalInput" placeholder="What are you working toward? Be specific."></textarea>
      <div class="btn-row">
        <button class="fire-btn" id="addGoalBtn">Add Goal</button>
      </div>
      <div class="goals-list" id="goalsList">
        <p class="empty-state">No goals yet. Add one above.</p>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Motivation Images</div>
      <div class="upload-area" id="uploadArea">
        <span class="upload-icon">↑</span>
        <p>Tap to upload an image that fires you up</p>
        <p style="font-size:11px; margin-top:6px;">JPG, PNG, WEBP accepted</p>
      </div>
      <input type="file" id="imageInput" accept="image/*" style="display:none;" />
      <p class="uploading-indicator" id="uploadingIndicator">Uploading image…</p>
      <p class="pin-legend">Tap the pin icon on any image to pin it — pinned images appear in every email.</p>
      <div class="image-grid" id="imageGrid"></div>
    </div>

  </div>

  <div class="status-bar" id="statusBar"></div>

  <script>
    const SUPABASE_URL = 'https://urfsijczxmngbixprdkq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZnNpamN6eG1uZ2JpeHByZGtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0OTU1NzIsImV4cCI6MjA5MTA3MTU3Mn0.KxNLu5Rg0A0IdxQbaAapDa-vmTkVmeUlub689o0ZOaM';
    const CLOUDINARY_CLOUD_NAME = 'dasjoaf0h';
    const CLOUDINARY_UPLOAD_PRESET = 'motivation_uploads';

    async function sbFetch(path, method, body) {
      method = method || 'GET';
      const opts = {
        method: method,
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Prefer': 'return=representation'
        }
      };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(SUPABASE_URL + path, opts);
      if (!res.ok) throw new Error(await res.text());
      const text = await res.text();
      return text ? JSON.parse(text) : [];
    }

    function showStatus(msg, type) {
      var bar = document.getElementById('statusBar');
      bar.textContent = msg;
      bar.className = 'status-bar show ' + (type || 'success');
      setTimeout(function() { bar.className = 'status-bar'; }, 3500);
    }

    var goals = [];

    function loadGoals() {
      sbFetch('/rest/v1/goals?order=created_at.asc')
        .then(function(data) { goals = data; renderGoals(); })
        .catch(function(e) { console.error('Load goals error:', e); });
    }

    function renderGoals() {
      var list = document.getElementById('goalsList');
      list.innerHTML = '';
      if (goals.length === 0) {
        list.innerHTML = '<p class="empty-state">No goals yet. Add one above.</p>';
        return;
      }
      goals.forEach(function(g) {
        var div = document.createElement('div');
        div.className = 'goal-item';
        div.innerHTML = '<p>' + escapeHtml(g.text) + '</p><button class="delete-btn" data-id="' + g.id + '">✕</button>';
        div.querySelector('.delete-btn').addEventListener('click', function() { deleteGoal(g.id); });
        list.appendChild(div);
      });
    }

    function addGoal() {
      var input = document.getElementById('goalInput');
      var text = input.value.trim();
      if (!text) { showStatus('Type a goal first.', 'error'); return; }
      sbFetch('/rest/v1/goals', 'POST', { text: text })
        .then(function(result) {
          goals.push(result[0]);
          renderGoals();
          input.value = '';
          showStatus('Goal saved.', 'success');
        })
        .catch(function() { showStatus('Error saving goal.', 'error'); });
    }

    function deleteGoal(id) {
      sbFetch('/rest/v1/goals?id=eq.' + id, 'DELETE')
        .then(function() {
          goals = goals.filter(function(g) { return g.id !== id; });
          renderGoals();
        })
        .catch(function() { showStatus('Error deleting goal.', 'error'); });
    }

    var images = [];

    function loadImages() {
      sbFetch('/rest/v1/images?order=created_at.asc')
        .then(function(data) { images = data; renderImages(); })
        .catch(function(e) { console.error('Load images error:', e); });
    }

    function renderImages() {
      var grid = document.getElementById('imageGrid');
      grid.innerHTML = '';
      images.forEach(function(img) {
        var card = document.createElement('div');
        card.className = 'image-card' + (img.pinned ? ' pinned' : '');
        card.innerHTML =
          '<img src="' + img.url + '" alt="motivation" loading="lazy" />' +
          '<button class="img-delete">✕</button>' +
          '<button class="img-pin">📌</button>';
        card.querySelector('.img-delete').addEventListener('click', function() { deleteImage(img.id); });
        card.querySelector('.img-pin').addEventListener('click', function() { pinImage(img.id, img.pinned); });
        grid.appendChild(card);
      });
    }

    function pinImage(id, currentlyPinned) {
      sbFetch('/rest/v1/images?pinned=not.is.null', 'PATCH', { pinned: false })
        .then(function() {
          if (!currentlyPinned) {
            return sbFetch('/rest/v1/images?id=eq.' + id, 'PATCH', { pinned: true })
              .then(function() { showStatus('Pinned — this image will appear in every email.', 'success'); });
          } else {
            showStatus('Unpinned.', 'success');
          }
        })
        .then(function() { return sbFetch('/rest/v1/images?order=created_at.asc'); })
        .then(function(data) { images = data; renderImages(); })
        .catch(function(e) { console.error(e); showStatus('Error pinning image.', 'error'); });
    }

    function handleImageUpload(event) {
      var file = event.target.files[0];
      if (!file) return;
      document.getElementById('uploadingIndicator').style.display = 'block';
      var formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/image/upload', {
        method: 'POST',
        body: formData
      })
      .then(function(r) { return r.json(); })
      .then(function(cloudData) {
        if (!cloudData.secure_url) throw new Error('Cloudinary upload failed');
        return sbFetch('/rest/v1/images', 'POST', { url: cloudData.secure_url, pinned: false });
      })
      .then(function(result) {
        images.push(result[0]);
        renderImages();
        showStatus('Image uploaded.', 'success');
      })
      .catch(function(e) {
        console.error(e);
        showStatus('Image upload failed. Try again.', 'error');
      })
      .finally(function() {
        document.getElementById('uploadingIndicator').style.display = 'none';
        document.getElementById('imageInput').value = '';
      });
    }

    function deleteImage(id) {
      sbFetch('/rest/v1/images?id=eq.' + id, 'DELETE')
        .then(function() {
          images = images.filter(function(i) { return i.id !== id; });
          renderImages();
        })
        .catch(function() { showStatus('Error deleting image.', 'error'); });
    }

    function sendNow() {
      var btn = document.getElementById('sendNowBtn');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      fetch('/api/send-motivation', { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            showStatus('Email sent. Check your inbox.', 'success');
          } else {
            showStatus('Send failed: ' + (data.error || 'unknown error'), 'error');
          }
        })
        .catch(function() { showStatus('Send failed. Check console.', 'error'); })
        .finally(function() {
          btn.disabled = false;
          btn.textContent = 'Send Now';
        });
    }

    function escapeHtml(text) {
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(text));
      return d.innerHTML;
    }

    document.getElementById('sendNowBtn').addEventListener('click', sendNow);
    document.getElementById('addGoalBtn').addEventListener('click', addGoal);
    document.getElementById('uploadArea').addEventListener('click', function() {
      document.getElementById('imageInput').click();
    });
    document.getElementById('imageInput').addEventListener('change', handleImageUpload);

    loadGoals();
    loadImages();
  </script>
</body>
</html>
