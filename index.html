<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    color: #1a1a1a;
    font-family: Georgia, serif;
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
  }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ── HEADER ── */
  header {
    padding: 24px 0 20px;
    border-bottom: 1px solid #e0e0e0;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }

  .header-home {
    font-size: 13px;
    font-style: italic;
    color: #1a1a1a;
    text-decoration: none;
    transition: color 0.2s;
  }

  .header-home:hover { color: #aaaaaa; }

  .header-handle {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #aaaaaa;
  }

  .header-nav {
    display: flex;
    gap: 0;
    border-top: 1px solid #f0f0f0;
    padding-top: 14px;
    flex-wrap: wrap;
  }

  .header-nav a {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #aaaaaa;
    text-decoration: none;
    margin-right: 24px;
    padding-bottom: 2px;
    transition: color 0.2s;
  }

  .header-nav a:hover { color: #1a1a1a; }
  .header-nav a.active {
    color: #1a1a1a;
    border-bottom: 1px solid #1a1a1a;
  }

  /* ── PAGE CONTENT ── */
  .page-content {
    padding: 48px 0;
  }

</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-top">
      <a href="https://josephrossi.co" class="header-home">Never Stop</a>
      <span class="header-handle">@thejosephrossi</span>
    </div>
    <nav class="header-nav">
      <a href="https://joerossi.co" class="active">Home</a>
      <a href="https://joerossi.co/sop">SOP</a>
      <a href="https://joerossi.co/motivation">Motivation</a>
      <a href="https://joerossi.co/affirmation">Affirmations</a>
      <a href="https://joerossi.co/daily-practice">Daily Practice</a>
    </nav>
  </header>

  <div class="page-content">
  </div>

</div>
</body>
</html>
