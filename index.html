<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <!-- Google Fonts: Lustria for headings, Lato for body text -->
  <!-- "Google Fonts" is a free service that loads beautiful fonts from the internet -->
  <link href="https://fonts.googleapis.com/css2?family=Lustria&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111111;
      color: #e8e8e8;
      font-family: 'Lato', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* ── SKETCH IMAGE ── */
    .site-image {
      padding: 60px 0 40px;
    }

    .site-image img {
      width: 220px;
      max-width: 100%;
      opacity: 0.85;
      display: block;
    }

    /* ── NAV GROUPS ── */
    .nav-groups {
      padding-bottom: 80px;
    }

    .nav-group {
      margin-bottom: 28px;
    }

    /* Small uppercase category labels use Lato light */
    .nav-group-label {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 8px;
    }

    .nav-group a {
      display: flex;
      align-items: baseline;
      gap: 12px;
      text-decoration: none;
      padding: 3px 0;
    }

    /* Big link titles use Lustria (serif heading font) */
    .nav-link-title {
      font-size: 22px;
      font-family: 'Lustria', serif;
      color: #e0e0e0;
      font-weight: normal;
      transition: color 0.2s;
    }

    /* Descriptions use Lato light italic */
    .nav-link-desc {
      font-size: 13px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-style: italic;
      color: #555555;
      transition: color 0.2s;
    }

    .nav-group a:hover .nav-link-title {
      color: #ffffff;
    }

    .nav-group a:hover .nav-link-desc {
      color: #888888;
    }

    /* ── MOBILE ── */
    @media (max-width: 480px) {
      .site-image {
        padding: 40px 0 28px;
      }
      .site-image img {
        width: 160px;
      }
      .nav-link-title {
        font-size: 19px;
      }
      .nav-group a {
        flex-wrap: wrap;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- SKETCH IMAGE — replace src with your own image path, or delete this block if you don't have one -->
    <div class="site-image">
      <img src="/sketch.png" alt="site illustration">
    </div>

    <!-- NAV GROUPS -->
    <nav class="nav-groups">

      <div class="nav-group">
        <a href="/affirmations">
          <span class="nav-link-title">Affirmations</span>
        </a>
      </div>

      <div class="nav-group">
        <a href="/sop">
          <span class="nav-link-title">SOP</span>
        </a>
      </div>

      <div class="nav-group">
        <a href="/motivation">
          <span class="nav-link-title">Motivation</span>
        </a>
      </div>

      <div class="nav-group">
        <a href="/bookmarks">
          <span class="nav-link-title">Bookmarks</span>
        </a>
      </div>

    </nav>

  </div>
</body>
</html>
