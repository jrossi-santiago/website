<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111111;
      color: #e8e8e8;
      font-family: Georgia, serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* ── SKETCH IMAGE ── */
    .site-image {
      padding: 60px 0 40px;
    }

    .site-image img {
      width: 220px;
      max-width: 100%;
      opacity: 0.85;
      display: block;
    }

    /* ── NAV GROUPS ── */
    .nav-groups {
      padding-bottom: 80px;
    }

    .nav-group {
      margin-bottom: 28px;
    }

    .nav-group-label {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 8px;
    }

    .nav-group a {
      display: flex;
      align-items: baseline;
      gap: 12px;
      text-decoration: none;
      padding: 3px 0;
    }

    .nav-link-title {
      font-size: 22px;
      font-family: Georgia, serif;
      color: #e0e0e0;
      font-weight: normal;
      transition: color 0.2s;
    }

    .nav-link-desc {
      font-size: 13px;
      font-family: Georgia, serif;
      font-style: italic;
      color: #555555;
      transition: color 0.2s;
    }

    .nav-group a:hover .nav-link-title {
      color: #ffffff;
    }

    .nav-group a:hover .nav-link-desc {
      color: #888888;
    }

    /* ── MOBILE ── */
    @media (max-width: 480px) {
      .site-image {
        padding: 40px 0 28px;
      }
      .site-image img {
        width: 160px;
      }
      .nav-link-title {
        font-size: 19px;
      }
      .nav-group a {
        flex-wrap: wrap;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- SKETCH IMAGE — replace the src with your own image path if you have one -->
    <div class="site-image">
      <img src="/sketch.png" alt="site illustration">
    </div>

    <!-- NAV GROUPS -->
    <nav class="nav-groups">

      <div class="nav-group">
        <div class="nav-group-label">Practice</div>
        <a href="/case-studies">
          <span class="nav-link-title">Case Studies</span>
          <span class="nav-link-desc">Selected client work</span>
        </a>
        <a href="/playground">
          <span class="nav-link-title">Playground</span>
          <span class="nav-link-desc">Personal experiments</span>
        </a>
        <a href="/notes">
          <span class="nav-link-title">Notes</span>
          <span class="nav-link-desc">Short mind extracts</span>
        </a>
      </div>

      <div class="nav-group">
        <div class="nav-group-label">Career</div>
        <a href="/past">
          <span class="nav-link-title">Past</span>
          <span class="nav-link-desc">Where I've been</span>
        </a>
        <a href="/now">
          <span class="nav-link-title">Now</span>
          <span class="nav-link-desc">What I'm doing</span>
        </a>
      </div>

      <div class="nav-group">
        <div class="nav-group-label">Info</div>
        <a href="/contact">
          <span class="nav-link-title">Contact</span>
          <span class="nav-link-desc">Get in touch</span>
        </a>
        <a href="/socials">
          <span class="nav-link-title">Socials</span>
        </a>
      </div>

    </nav>

  </div>
</body>
</html>
