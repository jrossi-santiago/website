<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Lustria&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111111;
      color: #e8e8e8;
      font-family: 'Lato', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* ── PROFILE IMAGE ── */
    .site-image {
      padding: 60px 0 40px;
    }

    .site-image img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      filter: invert(1);
      border: 1px solid #333333;
    }

    /* ── NAV GROUPS ── */
    .nav-groups {
      padding-bottom: 80px;
    }

    .nav-group {
      margin-bottom: 32px;
    }

    .nav-group-label {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 10px;
    }

    .nav-group a {
      display: flex;
      align-items: baseline;
      gap: 10px;
      text-decoration: none;
      padding: 4px 0;
    }

    .nav-link-title {
      font-size: 22px;
      font-family: 'Lustria', serif;
      color: #e0e0e0;
      font-weight: normal;
      transition: color 0.2s;
      white-space: nowrap;
    }

    .nav-link-desc {
      font-size: 13px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-style: italic;
      color: #555555;
      transition: color 0.2s;
    }

    .nav-group a:hover .nav-link-title {
      color: #ffffff;
    }

    .nav-group a:hover .nav-link-desc {
      color: #888888;
    }

    /* ── MOBILE ── */
    @media (max-width: 480px) {
      .site-image {
        padding: 40px 0 28px;
      }
      .nav-link-title {
        font-size: 19px;
      }
      .nav-group a {
        flex-wrap: wrap;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="site-image">
      <img src="/sketch.png" alt="profile image">
    </div>

    <nav class="nav-groups">

      <div class="nav-group">
        <div class="nav-group-label">Business</div>
        <a href="/sop">
          <span class="nav-link-title">SOP</span>
          <span class="nav-link-desc">Preempt Global's Consistency</span>
        </a>
      </div>

      <div class="nav-group">
        <div class="nav-group-label">Personal</div>
        <a href="/affirmations">
          <span class="nav-link-title">Affirmations</span>
          <span class="nav-link-desc">Daily Catholic Meditations</span>
        </a>
        <a href="/motivation">
          <span class="nav-link-title">Motivation</span>
          <span class="nav-link-desc">Constant Reminder Emails</span>
        </a>
        <a href="/bookmarks">
          <span class="nav-link-title">Bookmarks</span>
          <span class="nav-link-desc">Search My Twitter Saves</span>
        </a>
      </div>

    </nav>

  </div>
</body>
</html>
