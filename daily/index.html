<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily — Analog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Karla:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #2B2D22;
      --card-today:    #F5F2EB;
      --card-wb:       #E8E4DA;
      --text-dark:     #2A2825;
      --text-mid:      #76706A;
      --text-light:    #B3ADA5;
      --circle-stroke: #C5BFB7;
      --line-rule:     rgba(42, 40, 37, 0.07);
      --streak-gold:   #C4A066;
      --shadow-card:   0 6px 32px rgba(0,0,0,0.28), 0 1px 6px rgba(0,0,0,0.14);
      --radius-lg:     14px;
      --radius-md:     10px;
      --font-display:  'Cormorant Garamond', Georgia, serif;
      --font-body:     'Karla', system-ui, sans-serif;
    }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      font-family: var(--font-body);
      color: var(--text-dark);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Noise texture — same as card app */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* ── PAGE ── */
    #page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 56px;
    }

    /* ── HEADER ── */
    .page-header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 500;
      color: rgba(255,255,255,0.32);
      letter-spacing: 0.03em;
    }

    .page-date {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── SPLIT LAYOUT ── */
    .split-layout {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    /* ── CARD BASE ── */
    .panel-card {
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
      animation: cardRise 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .panel-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255,255,255,0.55);
      pointer-events: none;
      z-index: 2;
    }

    .aff-card { background: var(--card-today); animation-delay: 0s; }
    .mot-card { background: var(--card-wb);    animation-delay: 0.07s; }

    @keyframes cardRise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── CARD TOP ── */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--line-rule);
    }

    .card-label {
      font-family: var(--font-display);
      font-size: 23px;
      font-weight: 500;
      color: var(--text-dark);
      letter-spacing: 0.01em;
      line-height: 1;
    }

    .card-top-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
    }

    .card-date-label {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 400;
      color: var(--text-mid);
      letter-spacing: 0.08em;
    }

    .card-dots {
      display: flex;
      flex-direction: column;
      gap: 3.5px;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      border: 1px solid var(--circle-stroke);
      display: block;
    }

    .dot-filled {
      background: var(--circle-stroke);
      border-color: var(--circle-stroke);
    }

    /* ── CARD BODY ── */
    .card-body {
      padding: 24px 22px 22px;
      display: flex;
      flex-direction: column;
    }

    /* ── LOADING STATE ── */
    .panel-loading {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 300;
      font-style: italic;
      color: var(--text-light);
      text-align: center;
      padding: 40px 0;
    }

    /* =============================================
       AFFIRMATIONS PANEL
    ============================================= */

    .aff-dots-row {
      display: flex;
      gap: 7px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .aff-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      border: 1px solid var(--circle-stroke);
      background: transparent;
      transition: background 0.25s, border-color 0.25s;
    }

    .aff-dot.done    { background: var(--text-light); border-color: var(--text-light); }
    .aff-dot.current { background: var(--text-dark);  border-color: var(--text-dark); }

    .aff-progress {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 400;
      color: var(--text-light);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 4px;
    }

    .aff-category {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 400;
      color: var(--text-mid);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 24px;
    }

    .aff-prompt {
      font-family: var(--font-display);
      font-size: clamp(15px, 1.5vw, 21px);
      font-weight: 500;
      line-height: 1.75;
      color: var(--text-dark);
      text-align: center;
      margin-bottom: 30px;
    }

    .aff-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--circle-stroke);
      color: var(--text-dark);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 300;
      padding: 8px 0;
      outline: none;
      text-align: center;
      caret-color: var(--text-dark);
      transition: border-color 0.2s;
    }

    .aff-input::placeholder {
      color: var(--text-light);
      font-style: italic;
      font-size: 13px;
    }

    .aff-input:focus   { border-bottom-color: var(--text-mid); }
    .aff-input.error   { border-bottom-color: rgba(160,80,60,0.45); color: var(--text-light); }
    .aff-input.success { border-bottom-color: var(--text-dark); }

    .aff-hint {
      margin-top: 10px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 300;
      color: transparent;
      font-style: italic;
      text-align: center;
      min-height: 16px;
      transition: color 0.2s;
    }

    .aff-hint.visible { color: var(--text-mid); }

    /* Streak bar */
    .aff-streak-bar {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--line-rule);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .aff-streak-icon { width: 11px; height: 13px; color: var(--streak-gold); flex-shrink: 0; }

    .aff-streak-num {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      color: var(--streak-gold);
    }

    .aff-streak-lbl {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 300;
      color: rgba(196,160,102,0.55);
    }

    /* Locked view */
    .aff-locked-heading {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-mid);
      text-align: center;
      margin-bottom: 20px;
    }

    .aff-locked-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--line-rule);
    }

    .aff-locked-item:last-of-type { border-bottom: none; }

    .aff-locked-cat {
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 4px;
    }

    .aff-locked-text {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.7;
      color: var(--text-dark);
    }

    .aff-countdown {
      margin-top: 20px;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 300;
      color: var(--text-light);
      letter-spacing: 0.06em;
      text-align: center;
    }

    /* =============================================
       MOTIVATION PANEL
    ============================================= */

    .mot-quote {
      font-family: var(--font-display);
      font-size: clamp(16px, 1.6vw, 22px);
      font-weight: 500;
      line-height: 1.78;
      color: var(--text-dark);
      margin-bottom: 28px;
      padding-left: 16px;
      border-left: 2px solid var(--circle-stroke);
    }

    .mot-section-label {
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 8px;
    }

    .mot-goal-text {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.75;
      color: var(--text-dark);
      margin-bottom: 24px;
    }

    .mot-image-wrap {
      margin-bottom: 16px;
    }

    .mot-image-wrap img {
      width: 100%;
      display: block;
      border-radius: var(--radius-md);
      border: 1px solid rgba(42,40,37,0.07);
    }

    /* =============================================
       UTILITY
    ============================================= */
    .hidden { display: none !important; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(42,40,37,0.18); border-radius: 4px; }

    /* =============================================
       RESPONSIVE
    ============================================= */
    @media (max-width: 720px) {
      .split-layout {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    @media (max-width: 400px) {
      #page { padding: 16px 12px 48px; }
      .card-label { font-size: 20px; }
    }
  </style>
</head>
<body>

<div id="page">

  <!-- HEADER -->
  <header class="page-header">
    <span class="page-title">Daily</span>
    <span class="page-date" id="header-date"></span>
  </header>

  <!-- SPLIT LAYOUT -->
  <div class="split-layout">

    <!-- ===== LEFT: AFFIRMATIONS ===== -->
    <div class="panel-card aff-card">
      <div class="card-top">
        <span class="card-label">Affirmations</span>
        <div class="card-top-right">
          <span class="card-date-label" id="aff-date"></span>
          <div class="card-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot dot-filled"></span>
          </div>
        </div>
      </div>

      <div class="card-body">
        <!-- Loading -->
        <p class="panel-loading" id="aff-loading">Loading…</p>

        <!-- Active: type-to-confirm -->
        <div id="aff-active" class="hidden">
          <div class="aff-dots-row" id="aff-dots-row"></div>
          <div class="aff-progress"  id="aff-progress"></div>
          <div class="aff-category"  id="aff-category"></div>
          <div class="aff-prompt"    id="aff-prompt"></div>
          <input
            id="aff-input"
            class="aff-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="type it here and press Enter"
          />
          <div class="aff-hint" id="aff-hint"></div>
        </div>

        <!-- Locked: done for today -->
        <div id="aff-locked" class="hidden">
          <div class="aff-locked-heading">Today's Five</div>
          <div id="aff-locked-list"></div>
          <div class="aff-countdown" id="aff-countdown"></div>
        </div>

        <!-- Streak — always visible at bottom -->
        <div class="aff-streak-bar" id="aff-streak-bar">
          <svg class="aff-streak-icon" viewBox="0 0 20 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M10 1C10 1 4 8.5 4 13.5C4 16.99 6.69 19.8 10 19.8C13.31 19.8 16 16.99 16 13.5C16 8.5 10 1 10 1Z" fill="currentColor"/>
            <path d="M10 13C10 13 7.5 11 8 8.5C6.5 10 6 11.5 6 13.5C6 15.71 7.79 17.5 10 17.5C12.21 17.5 14 15.71 14 13.5C14 12 13.5 10.8 12.5 10C12.5 12 10 13 10 13Z" fill="rgba(196,160,102,0.22)"/>
          </svg>
          <span class="aff-streak-num"  id="aff-streak-count">0</span>
          <span class="aff-streak-lbl">day streak</span>
        </div>
      </div>
    </div>

    <!-- ===== RIGHT: NO EXCUSES ===== -->
    <div class="panel-card mot-card">
      <div class="card-top">
        <span class="card-label">No Excuses</span>
        <div class="card-top-right">
          <span class="card-date-label" id="mot-date"></span>
          <div class="card-dots">
            <span class="dot"></span>
            <span class="dot dot-filled"></span>
            <span class="dot dot-filled"></span>
          </div>
        </div>
      </div>

      <div class="card-body">
        <!-- Loading -->
        <p class="panel-loading" id="mot-loading">Loading…</p>

        <!-- Content -->
        <div id="mot-content" class="hidden">
          <div class="mot-quote" id="mot-quote"></div>
          <div id="mot-goal-wrap">
            <div class="mot-section-label">What you're fighting for</div>
            <div class="mot-goal-text" id="mot-goal"></div>
          </div>
          <div id="mot-images"></div>
        </div>
      </div>
    </div>

  </div><!-- /split-layout -->
</div><!-- /page -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/affirmations/data.js"></script>
<script>

  // ============================================================
  // CONFIGURATION
  // Your affirmations Supabase project:
  const AFF_URL = 'https://rvwyjipseusvqjqbwken.supabase.co';
  const AFF_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2d3lqaXBzZXVzdnFqcWJ3a2VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDA4MDAsImV4cCI6MjA5MjAxNjgwMH0.UFYPZndWuY3uDOWovjxa7qreidWM9sacUlIS9iteMXc';

  // Your No Excuses Supabase project:
  const MOT_URL = 'https://urfsijczxmngbixprdkq.supabase.co';
  const MOT_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZnNpamN6eG1uZ2JpeHByZGtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0OTU1NzIsImV4cCI6MjA5MTA3MTU3Mn0.KxNLu5Rg0A0IdxQbaAapDa-vmTkVmeUlub689o0ZOaM';
  // ============================================================

  const { createClient } = supabase;
  const affDB = createClient(AFF_URL, AFF_KEY);

  // ── SHARED HELPERS ──

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // ── HEADER DATE ──
  (function() {
    const d = new Date();
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const days   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const label  = days[d.getDay()] + ' ' + months[d.getMonth()] + ' ' + d.getDate();
    document.getElementById('header-date').textContent = label;
    document.getElementById('aff-date').textContent    = label;
    document.getElementById('mot-date').textContent    = label;
  })();

  // ============================================================
  //  AFFIRMATIONS
  // ============================================================

  let affStreak  = 0;
  let affLastDay = '';
  let affSession = null;
  let affIndex   = 0;
  let affTimer   = null;

  function pickFive() {
    const affPick  = shuffle(AFFIRMATIONS)[0];
    const goalPick = shuffle(GOALS)[0];
    const used = [
      { text: affPick,  category: 'Affirmation' },
      { text: goalPick, category: 'Goal' },
    ];
    const remaining = [
      ...AFFIRMATIONS.filter(x => x !== affPick).map(x => ({ text: x, category: 'Affirmation' })),
      ...GOALS.filter(x => x !== goalPick).map(x => ({ text: x, category: 'Goal' })),
    ];
    return shuffle([...used, ...shuffle(remaining).slice(0, 3)]);
  }

  async function affLoad() {
    const { data, error } = await affDB
      .from('affirmations_progress')
      .select('*')
      .eq('id', 'me')
      .single();
    if (error) { console.error('Aff load:', error); return null; }
    return data;
  }

  async function affSave(streak, lastDay, sess) {
    const { error } = await affDB
      .from('affirmations_progress')
      .upsert({ id: 'me', streak, last_day: lastDay, session: sess });
    if (error) { console.error('Aff save:', error); }
  }

  function affSetStreak(n) {
    affStreak = n;
    document.getElementById('aff-streak-count').textContent = n;
  }

  function affBuildDots(idx) {
    const row = document.getElementById('aff-dots-row');
    row.innerHTML = '';
    affSession.items.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'aff-dot' + (i < idx ? ' done' : i === idx ? ' current' : '');
      row.appendChild(dot);
    });
  }

  function affShowItem(idx) {
    const item = affSession.items[idx];
    document.getElementById('aff-progress').textContent = `${idx + 1} of 5`;
    document.getElementById('aff-category').textContent = item.category;
    document.getElementById('aff-prompt').textContent   = item.text;
    const inp  = document.getElementById('aff-input');
    const hint = document.getElementById('aff-hint');
    inp.value       = '';
    inp.className   = 'aff-input';
    hint.textContent = '';
    hint.className  = 'aff-hint';
    affBuildDots(idx);
    setTimeout(() => inp.focus(), 50);
  }

  function affShowActive() {
    document.getElementById('aff-loading').classList.add('hidden');
    document.getElementById('aff-active').classList.remove('hidden');
    document.getElementById('aff-locked').classList.add('hidden');
    affIndex = affSession.completedCount;
    affShowItem(affIndex);
  }

  function affShowLocked(sess) {
    document.getElementById('aff-loading').classList.add('hidden');
    document.getElementById('aff-active').classList.add('hidden');
    document.getElementById('aff-locked').classList.remove('hidden');

    const list = document.getElementById('aff-locked-list');
    list.innerHTML = '';
    sess.items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'aff-locked-item';
      div.innerHTML =
        `<div class="aff-locked-cat">${escHtml(item.category)}</div>` +
        `<div class="aff-locked-text">${escHtml(item.text)}</div>`;
      list.appendChild(div);
    });

    function tick() {
      const midnight = new Date();
      midnight.setHours(24, 0, 0, 0);
      const diff = midnight.getTime() - Date.now();
      if (diff <= 0) { clearInterval(affTimer); setTimeout(() => location.reload(), 1000); return; }
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      document.getElementById('aff-countdown').textContent = `Resets in ${h}h ${m}m ${s}s`;
    }
    tick();
    affTimer = setInterval(tick, 1000);
  }

  document.getElementById('aff-input').addEventListener('keydown', async function(e) {
    if (e.key !== 'Enter') return;
    const typed   = this.value.trim();
    const correct = affSession.items[affIndex].text.trim();
    const hint    = document.getElementById('aff-hint');

    if (typed === correct) {
      this.className = 'aff-input success';
      affSession.completedCount++;

      if (affSession.completedCount === 5) {
        const today = todayStr();
        if (affLastDay !== today) {
          const yest = new Date();
          yest.setDate(yest.getDate() - 1);
          const yStr = `${yest.getFullYear()}-${yest.getMonth()}-${yest.getDate()}`;
          affStreak  = (affLastDay === yStr) ? affStreak + 1 : 1;
          affLastDay = today;
        }
        affSetStreak(affStreak);
        await affSave(affStreak, affLastDay, affSession);
        setTimeout(() => affShowLocked(affSession), 700);
      } else {
        await affSave(affStreak, affLastDay, affSession);
        setTimeout(() => { affIndex = affSession.completedCount; affShowItem(affIndex); }, 700);
      }
    } else {
      this.className = 'aff-input error';
      hint.textContent = 'Not quite — type it exactly as shown above.';
      hint.className   = 'aff-hint visible';
      setTimeout(() => {
        this.value       = '';
        this.className   = 'aff-input';
        hint.textContent = '';
        hint.className   = 'aff-hint';
      }, 1400);
    }
  });

  async function affInit() {
    const record = await affLoad();
    const today  = todayStr();

    if (record) {
      affSetStreak(record.streak || 0);
      affLastDay = record.last_day || '';
      const saved = record.session || null;

      if (saved && saved.day === today) {
        affSession = saved;
        affSession.completedCount >= 5 ? affShowLocked(affSession) : affShowActive();
      } else {
        affSession = { day: today, items: pickFive(), completedCount: 0 };
        await affSave(record.streak || 0, affLastDay, affSession);
        affShowActive();
      }
    } else {
      affSetStreak(0);
      affSession = { day: today, items: pickFive(), completedCount: 0 };
      await affSave(0, '', affSession);
      affShowActive();
    }
  }

  // ============================================================
  //  NO EXCUSES / MOTIVATION
  // ============================================================

  const HOURS_18 = 18 * 60 * 60 * 1000;

  const QUOTES = [
    'You said this mattered. Prove it.',
    'Everyone who doubted you is watching. What are you doing right now?',
    'The version of you that achieves this doesn\'t make excuses. Be that person TODAY.',
    'Stop waiting to feel ready. You will never feel ready. Move anyway.',
    'Your competition isn\'t resting. What\'s your excuse?',
    'This is the work. Not the glamour. Not the results. THIS moment, right now. Do the work.',
    'You\'ve been comfortable long enough. Comfortable doesn\'t build anything.',
    'Future you is either grateful or disappointed. You\'re deciding which one right now.',
    'No one is coming to save you. No one is going to do this for you. Get up.',
    'The goal doesn\'t care how you feel today. Show up anyway.',
    'Discipline is doing it when you don\'t want to. You don\'t want to right now. Do it anyway.',
    'Every day you delay is a day you hand to someone else who wants it more.',
    'You already know what you need to do. Stop pretending you don\'t.',
    'Mediocrity is comfortable. Is that what you came here for?',
    'The people living the life you want didn\'t get there by being soft.',
    'What would the hardest version of you do right now? Go do that.',
    'You\'re not tired. You\'re avoiding. There\'s a difference.',
    'This is your reminder that time is running out and excuses don\'t age well.',
    'The gap between who you are and who you want to be is closed by action. Not intentions.',
    'You set these goals for a reason. Remember that reason. NOW MOVE.',
    'You are not special enough to skip the work. Nobody is.',
    'The life you want is on the other side of the effort you keep avoiding.',
    'Stop treating rest like you\'ve earned it. You haven\'t yet.',
    'Every excuse you make is a brick in the wall between you and everything you want.',
    'You talk about it more than you do it. That ends today.',
    'Comfort is a trap and you keep walking into it with a smile.',
    'You don\'t get to be proud of goals you haven\'t hit yet. Earn it first.',
    'Other people are outworking you right now. While you read this. Think about that.',
    'Stop waiting for motivation. Motivation is for amateurs. You move because you decided to.'
  ];

  function motFetch(path, method, body) {
    const opts = {
      method: method || 'GET',
      headers: {
        'Content-Type': 'application/json',
        'apikey': MOT_KEY,
        'Authorization': 'Bearer ' + MOT_KEY,
        'Prefer': 'return=representation'
      }
    };
    if (body) opts.body = JSON.stringify(body);
    return fetch(MOT_URL + path, opts).then(res => {
      if (!res.ok) return res.text().then(t => { throw new Error(t); });
      return res.text().then(t => t ? JSON.parse(t) : []);
    });
  }

  function motIsStale(record) {
    if (!record || !record.saved_at || !record.card) return true;
    if (Date.now() - record.saved_at >= HOURS_18) return true;
    return new Date(record.saved_at).toDateString() !== new Date().toDateString();
  }

  function motRender(card) {
    document.getElementById('mot-loading').classList.add('hidden');
    document.getElementById('mot-content').classList.remove('hidden');
    document.getElementById('mot-quote').textContent = card.quote;

    if (card.goal) {
      document.getElementById('mot-goal').textContent = card.goal;
      document.getElementById('mot-goal-wrap').style.display = 'block';
    } else {
      document.getElementById('mot-goal-wrap').style.display = 'none';
    }

    const imagesEl = document.getElementById('mot-images');
    imagesEl.innerHTML = '';

    if (card.pinnedImageUrl) {
      const wrap = document.createElement('div');
      wrap.className = 'mot-image-wrap';
      wrap.innerHTML =
        '<div class="mot-section-label" style="margin-bottom:8px;">Always remember this</div>' +
        '<img src="' + escHtml(card.pinnedImageUrl) + '" alt="pinned motivation" loading="lazy" />';
      imagesEl.appendChild(wrap);
    }

    if (card.randomImageUrl) {
      const wrap = document.createElement('div');
      wrap.className = 'mot-image-wrap';
      wrap.innerHTML =
        '<div class="mot-section-label" style="margin-top:16px;margin-bottom:8px;">Remember why</div>' +
        '<img src="' + escHtml(card.randomImageUrl) + '" alt="motivation" loading="lazy" />';
      imagesEl.appendChild(wrap);
    }
  }

  async function motInit() {
    try {
      const rows   = await motFetch('/rest/v1/daily_card?id=eq.today');
      const record = (rows && rows.length > 0) ? rows[0] : null;

      if (!motIsStale(record)) {
        motRender(record.card);
        return;
      }

      const [goals, images] = await Promise.all([
        motFetch('/rest/v1/goals?order=created_at.asc'),
        motFetch('/rest/v1/images?order=created_at.asc')
      ]);

      const pinned = images.find(i => i.pinned) || null;
      const random = (() => {
        const u = images.filter(i => !i.pinned);
        return u.length > 0 ? pickRandom(u) : null;
      })();

      const card = {
        quote:          pickRandom(QUOTES),
        goal:           goals.length > 0 ? pickRandom(goals).text : null,
        pinnedImageUrl: pinned ? pinned.url : null,
        randomImageUrl: random ? random.url : null
      };

      await motFetch('/rest/v1/daily_card?id=eq.today', 'PATCH', {
        card,
        saved_at: Date.now()
      });

      motRender(card);
    } catch(e) {
      console.error('Mot error:', e);
      document.getElementById('mot-loading').textContent = 'Could not load — check connection.';
    }
  }

  // ── BOOT ──
  affInit();
  motInit();

</script>
</body>
</html>
