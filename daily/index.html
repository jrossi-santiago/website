<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily — Analog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Karla:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #2B2D22;
      --card-today:    #F5F2EB;
      --card-wb:       #E8E4DA;
      --text-dark:     #2A2825;
      --text-mid:      #76706A;
      --text-light:    #B3ADA5;
      --circle-stroke: #C5BFB7;
      --line-rule:     rgba(42, 40, 37, 0.07);
      --streak-gold:   #C4A066;
      --shadow-card:   0 6px 32px rgba(0,0,0,0.28), 0 1px 6px rgba(0,0,0,0.14);
      --radius-lg:     14px;
      --radius-md:     10px;
      --font-display:  'Cormorant Garamond', Georgia, serif;
      --font-body:     'Karla', system-ui, sans-serif;
    }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      font-family: var(--font-body);
      color: var(--text-dark);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    #page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 56px;
    }

    .page-header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 500;
      color: rgba(255,255,255,0.32);
      letter-spacing: 0.03em;
    }

    .page-date {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .split-layout {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel-card {
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
      animation: cardRise 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .panel-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255,255,255,0.55);
      pointer-events: none;
      z-index: 2;
    }

    .aff-card { background: var(--card-today); animation-delay: 0s; }
    .mot-card { background: var(--card-wb);    animation-delay: 0.07s; }

    @keyframes cardRise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--line-rule);
    }

    .card-label {
      font-family: var(--font-display);
      font-size: 23px;
      font-weight: 500;
      color: var(--text-dark);
      letter-spacing: 0.01em;
      line-height: 1;
    }

    .card-top-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
    }

    .card-date-label {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 400;
      color: var(--text-mid);
      letter-spacing: 0.08em;
    }

    .card-dots {
      display: flex;
      flex-direction: column;
      gap: 3.5px;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      border: 1px solid var(--circle-stroke);
      display: block;
    }

    .dot-filled {
      background: var(--circle-stroke);
      border-color: var(--circle-stroke);
    }

    .card-body {
      padding: 24px 22px 22px;
      display: flex;
      flex-direction: column;
    }

    .panel-loading {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 300;
      font-style: italic;
      color: var(--text-light);
      text-align: center;
      padding: 40px 0;
    }

    /* =============================================
       PRAYER PANEL
    ============================================= */

    .prayer-eyebrow {
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-light);
      text-align: center;
      margin-bottom: 18px;
    }

    .prayer-image-wrap {
      width: 100%;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid rgba(42,40,37,0.07);
      background: rgba(42,40,37,0.04);
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .prayer-image-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: var(--radius-md);
    }

    .prayer-footer {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line-rule);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .prayer-footer-icon {
      width: 12px;
      height: 12px;
      color: var(--circle-stroke);
      flex-shrink: 0;
    }

    .prayer-footer-text {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 300;
      color: var(--text-light);
      letter-spacing: 0.08em;
    }

    .prayer-error {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 300;
      font-style: italic;
      color: var(--text-light);
      text-align: center;
      padding: 30px 0;
    }

    /* =============================================
       MOTIVATION PANEL
    ============================================= */

    .mot-quote {
      font-family: var(--font-display);
      font-size: clamp(16px, 1.6vw, 22px);
      font-weight: 500;
      line-height: 1.78;
      color: var(--text-dark);
      margin-bottom: 28px;
      padding-left: 16px;
      border-left: 2px solid var(--circle-stroke);
    }

    .mot-section-label {
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 8px;
    }

    .mot-goal-text {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.75;
      color: var(--text-dark);
      margin-bottom: 24px;
    }

    .mot-image-wrap {
      margin-bottom: 16px;
    }

    .mot-image-wrap img {
      width: 100%;
      display: block;
      border-radius: var(--radius-md);
      border: 1px solid rgba(42,40,37,0.07);
    }

    .hidden { display: none !important; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(42,40,37,0.18); border-radius: 4px; }

    @media (max-width: 720px) {
      .split-layout { grid-template-columns: 1fr; gap: 16px; }
    }

    @media (max-width: 400px) {
      #page { padding: 16px 12px 48px; }
      .card-label { font-size: 20px; }
    }
  </style>
</head>
<body>
<div id="site-header"></div>
<script src="/header.js"></script>
<div id="page">

  <header class="page-header">
    <span class="page-title">Daily</span>
    <span class="page-date" id="header-date"></span>
  </header>

  <div class="split-layout">

    <!-- ===== LEFT: PRAYER ===== -->
    <div class="panel-card aff-card">
      <div class="card-top">
        <span class="card-label">Prayer</span>
        <div class="card-top-right">
          <span class="card-date-label" id="aff-date"></span>
          <div class="card-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot dot-filled"></span>
          </div>
        </div>
      </div>

      <div class="card-body">
        <p class="panel-loading" id="prayer-loading">Loading…</p>

        <div id="prayer-content" class="hidden">
          <div class="prayer-eyebrow">Today's Prayer</div>
          <div class="prayer-image-wrap">
            <img id="prayer-img" src="" alt="Today's prayer" />
          </div>
          <div class="prayer-footer">
            <svg class="prayer-footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1M4.22 4.22l.71.71m13.66 13.66.71.71M3 12H2m20 0h-1M4.22 19.78l.71-.71M18.36 5.64l.71-.71" />
            </svg>
            <span class="prayer-footer-text" id="prayer-countdown"></span>
          </div>
        </div>

        <p class="prayer-error hidden" id="prayer-error">Could not load — check connection.</p>
      </div>
    </div>

    <!-- ===== RIGHT: NO EXCUSES ===== -->
    <div class="panel-card mot-card">
      <div class="card-top">
        <span class="card-label">No Excuses</span>
        <div class="card-top-right">
          <span class="card-date-label" id="mot-date"></span>
          <div class="card-dots">
            <span class="dot"></span>
            <span class="dot dot-filled"></span>
            <span class="dot dot-filled"></span>
          </div>
        </div>
      </div>

      <div class="card-body">
        <p class="panel-loading" id="mot-loading">Loading…</p>

        <div id="mot-content" class="hidden">
          <div class="mot-quote" id="mot-quote"></div>
          <div id="mot-goal-wrap">
            <div class="mot-section-label">What you're fighting for</div>
            <div class="mot-goal-text" id="mot-goal"></div>
          </div>
          <div id="mot-images"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

  // ============================================================
  // CONFIGURATION
  const AFF_URL = 'https://rvwyjipseusvqjqbwken.supabase.co';
  const AFF_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2d3lqaXBzZXVzdnFqcWJ3a2VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDA4MDAsImV4cCI6MjA5MjAxNjgwMH0.UFYPZndWuY3uDOWovjxa7qreidWM9sacUlIS9iteMXc';

  const MOT_URL = 'https://urfsijczxmngbixprdkq.supabase.co';
  const MOT_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZnNpamN6eG1uZ2JpeHByZGtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0OTU1NzIsImV4cCI6MjA5MTA3MTU3Mn0.KxNLu5Rg0A0IdxQbaAapDa-vmTkVmeUlub689o0ZOaM';

  const PRAYER_BUCKET = 'prayers';
  // ============================================================

  const { createClient } = supabase;
  const affDB = createClient(AFF_URL, AFF_KEY);

  // ── HELPERS ──

  function todayDateString() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }

  // ── HEADER DATE ──
  (function() {
    const d = new Date();
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const days   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const label  = days[d.getDay()] + ' ' + months[d.getMonth()] + ' ' + d.getDate();
    document.getElementById('header-date').textContent = label;
    document.getElementById('aff-date').textContent    = label;
    document.getElementById('mot-date').textContent    = label;
  })();

  // ── COUNTDOWN ──
  let countdownTimer = null;
  function startCountdown() {
    function tick() {
      const midnight = new Date();
      midnight.setHours(24, 0, 0, 0);
      const diff = midnight.getTime() - Date.now();
      if (diff <= 0) { clearInterval(countdownTimer); setTimeout(() => location.reload(), 1000); return; }
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      const el = document.getElementById('prayer-countdown');
      if (el) el.textContent = 'New prayer in ' + h + 'h ' + m + 'm ' + s + 's';
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  // ============================================================
  //  PRAYER PANEL
  //  Uses direct fetch() calls to the Supabase Storage REST API
  //  instead of the JS client library, which has a bug with .list()
  // ============================================================

  // Lists all files in the bucket by calling the Storage API directly
  async function listPrayerFiles() {
    const res = await fetch(AFF_URL + '/storage/v1/object/list/' + PRAYER_BUCKET, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': AFF_KEY,
        'Authorization': 'Bearer ' + AFF_KEY
      },
      body: JSON.stringify({ prefix: '', limit: 500, offset: 0 })
    });
    if (!res.ok) throw new Error('Storage list failed: ' + res.status);
    return res.json();
  }

  // Saves today's chosen image name to the daily_prayer table
  async function saveDailyPrayer(imageName, today) {
    await fetch(AFF_URL + '/rest/v1/daily_prayer', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': AFF_KEY,
        'Authorization': 'Bearer ' + AFF_KEY,
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({ id: 'today', image_path: imageName, day: today })
    });
  }

  // Reads today's saved choice from the daily_prayer table
  async function loadDailyPrayer() {
    const res = await fetch(AFF_URL + '/rest/v1/daily_prayer?id=eq.today', {
      headers: {
        'apikey': AFF_KEY,
        'Authorization': 'Bearer ' + AFF_KEY
      }
    });
    if (!res.ok) return null;
    const rows = await res.json();
    return rows && rows.length > 0 ? rows[0] : null;
  }

  async function prayerInit() {
    try {
      const today = todayDateString();

      // Check if we already picked a prayer for today
      const existing = await loadDailyPrayer();

      if (existing && existing.day === today && existing.image_path) {
        // Already have today's prayer — show it
        prayerShow(existing.image_path);
        return;
      }

      // No prayer yet — list all images and pick one randomly
      const files = await listPrayerFiles();

      // Filter out hidden/system files (filenames starting with a dot)
      const imageFiles = files.filter(f => f.name && !f.name.startsWith('.'));

      if (!imageFiles || imageFiles.length === 0) {
        throw new Error('No images found in bucket — did you upload your prayer screenshots?');
      }

      const chosen = pickRandom(imageFiles);

      // Save the choice so it stays the same all day
      await saveDailyPrayer(chosen.name, today);

      prayerShow(chosen.name);

    } catch (err) {
      console.error('Prayer error:', err);
      document.getElementById('prayer-loading').classList.add('hidden');
      document.getElementById('prayer-error').classList.remove('hidden');
    }
  }

  function prayerShow(imageName) {
    // Build the public URL directly — no JS client needed
    // Public URL format: [project-url]/storage/v1/object/public/[bucket]/[filename]
    const publicUrl = AFF_URL + '/storage/v1/object/public/' + PRAYER_BUCKET + '/' + encodeURIComponent(imageName);

    const img = document.getElementById('prayer-img');
    img.src = publicUrl;
    img.onload = function() {
      document.getElementById('prayer-loading').classList.add('hidden');
      document.getElementById('prayer-content').classList.remove('hidden');
      startCountdown();
    };
    img.onerror = function() {
      console.error('Image failed to load:', publicUrl);
      document.getElementById('prayer-loading').classList.add('hidden');
      document.getElementById('prayer-error').classList.remove('hidden');
    };
  }

  // ============================================================
  //  NO EXCUSES / MOTIVATION  (unchanged)
  // ============================================================

  const HOURS_18 = 18 * 60 * 60 * 1000;

  const QUOTES = [
    'You said this mattered. Prove it.',
    'Everyone who doubted you is watching. What are you doing right now?',
    'The version of you that achieves this doesn\'t make excuses. Be that person TODAY.',
    'Stop waiting to feel ready. You will never feel ready. Move anyway.',
    'Your competition isn\'t resting. What\'s your excuse?',
    'This is the work. Not the glamour. Not the results. THIS moment, right now. Do the work.',
    'You\'ve been comfortable long enough. Comfortable doesn\'t build anything.',
    'Future you is either grateful or disappointed. You\'re deciding which one right now.',
    'No one is coming to save you. No one is going to do this for you. Get up.',
    'The goal doesn\'t care how you feel today. Show up anyway.',
    'Discipline is doing it when you don\'t want to. You don\'t want to right now. Do it anyway.',
    'Every day you delay is a day you hand to someone else who wants it more.',
    'You already know what you need to do. Stop pretending you don\'t.',
    'Mediocrity is comfortable. Is that what you came here for?',
    'The people living the life you want didn\'t get there by being soft.',
    'What would the hardest version of you do right now? Go do that.',
    'You\'re not tired. You\'re avoiding. There\'s a difference.',
    'This is your reminder that time is running out and excuses don\'t age well.',
    'The gap between who you are and who you want to be is closed by action. Not intentions.',
    'You set these goals for a reason. Remember that reason. NOW MOVE.',
    'You are not special enough to skip the work. Nobody is.',
    'The life you want is on the other side of the effort you keep avoiding.',
    'Stop treating rest like you\'ve earned it. You haven\'t yet.',
    'Every excuse you make is a brick in the wall between you and everything you want.',
    'You talk about it more than you do it. That ends today.',
    'Comfort is a trap and you keep walking into it with a smile.',
    'You don\'t get to be proud of goals you haven\'t hit yet. Earn it first.',
    'Other people are outworking you right now. While you read this. Think about that.',
    'Stop waiting for motivation. Motivation is for amateurs. You move because you decided to.'
  ];

  function motFetch(path, method, body) {
    const opts = {
      method: method || 'GET',
      headers: {
        'Content-Type': 'application/json',
        'apikey': MOT_KEY,
        'Authorization': 'Bearer ' + MOT_KEY,
        'Prefer': 'return=representation'
      }
    };
    if (body) opts.body = JSON.stringify(body);
    return fetch(MOT_URL + path, opts).then(res => {
      if (!res.ok) return res.text().then(t => { throw new Error(t); });
      return res.text().then(t => t ? JSON.parse(t) : []);
    });
  }

  function motIsStale(record) {
    if (!record || !record.saved_at || !record.card) return true;
    if (Date.now() - record.saved_at >= HOURS_18) return true;
    return new Date(record.saved_at).toDateString() !== new Date().toDateString();
  }

  function motRender(card) {
    document.getElementById('mot-loading').classList.add('hidden');
    document.getElementById('mot-content').classList.remove('hidden');
    document.getElementById('mot-quote').textContent = card.quote;

    if (card.goal) {
      document.getElementById('mot-goal').textContent = card.goal;
      document.getElementById('mot-goal-wrap').style.display = 'block';
    } else {
      document.getElementById('mot-goal-wrap').style.display = 'none';
    }

    const imagesEl = document.getElementById('mot-images');
    imagesEl.innerHTML = '';

    if (card.pinnedImageUrl) {
      const wrap = document.createElement('div');
      wrap.className = 'mot-image-wrap';
      wrap.innerHTML =
        '<div class="mot-section-label" style="margin-bottom:8px;">Always remember this</div>' +
        '<img src="' + escHtml(card.pinnedImageUrl) + '" alt="pinned motivation" loading="lazy" />';
      imagesEl.appendChild(wrap);
    }

    if (card.randomImageUrl) {
      const wrap = document.createElement('div');
      wrap.className = 'mot-image-wrap';
      wrap.innerHTML =
        '<div class="mot-section-label" style="margin-top:16px;margin-bottom:8px;">Remember why</div>' +
        '<img src="' + escHtml(card.randomImageUrl) + '" alt="motivation" loading="lazy" />';
      imagesEl.appendChild(wrap);
    }
  }

  async function motInit() {
    try {
      const rows   = await motFetch('/rest/v1/daily_card?id=eq.today');
      const record = (rows && rows.length > 0) ? rows[0] : null;

      if (!motIsStale(record)) {
        motRender(record.card);
        return;
      }

      const [goals, images] = await Promise.all([
        motFetch('/rest/v1/goals?order=created_at.asc'),
        motFetch('/rest/v1/images?order=created_at.asc')
      ]);

      const pinned = images.find(i => i.pinned) || null;
      const random = (() => {
        const u = images.filter(i => !i.pinned);
        return u.length > 0 ? pickRandom(u) : null;
      })();

      const card = {
        quote:          pickRandom(QUOTES),
        goal:           goals.length > 0 ? pickRandom(goals).text : null,
        pinnedImageUrl: pinned ? pinned.url : null,
        randomImageUrl: random ? random.url : null
      };

      await motFetch('/rest/v1/daily_card?id=eq.today', 'PATCH', {
        card,
        saved_at: Date.now()
      });

      motRender(card);
    } catch(e) {
      console.error('Mot error:', e);
      document.getElementById('mot-loading').textContent = 'Could not load — check connection.';
    }
  }

  // ── BOOT ──
  prayerInit();
  motInit();

</script>
</body>
</html>
