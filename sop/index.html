<div id="site-header"></div>

<div id="pgos-wrap">

  <div id="biz-tabs">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {

  color: #e8e8e8;
  font-family: 'Lato', sans-serif;
  min-height: 100vh;
}

#pgos-wrap {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 32px 64px;
}

/* ── Business tab switcher ── */
#biz-tabs {
  display: flex;
  margin: 40px 0 0;
  border-bottom: 1px solid #2a2a2a;
}

.biz-tab {

  font-weight: 300;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 10px 22px 10px 0;
  margin-right: 28px;
  background: transparent;
  color: #444444;
  border: none;
  border-bottom: 1px solid transparent;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  margin-bottom: -1px;
}

.biz-tab:hover { color: #999999; }
.biz-tab.biz-active { color: #e0e0e0; border-bottom-color: #e0e0e0; }

/* ── Title block ── */
#pgos-title-block {
  margin: 36px 0 48px;
  padding-bottom: 28px;
  border-bottom: 1px solid #2a2a2a;
}

#pgos-title {
  font-family: 'Lustria', serif;
  font-size: clamp(24px, 4vw, 36px);
  font-weight: normal;
  color: #e0e0e0;
  line-height: 1.2;
  margin: 0 0 10px;
  transition: opacity 0.2s;
}

#pgos-slogan {
  font-size: 13px;
  color: #555555;
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  font-style: italic;
}

/* ── Grid ── */
#pgos-grid-wrap { margin-bottom: 40px; }

#pgos-grid-label {
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #555555;
  margin-bottom: 14px;
}

#pgos-grid-scroll { overflow-x: auto; padding-bottom: 4px; }

#pgos-grid {
  display: flex;
  flex-direction: row;
  gap: 3px;
  min-width: max-content;
}

.pgos-grid-col { display: flex; flex-direction: column; gap: 3px; }

.pgos-grid-cell {
  width: 13px;
  height: 13px;
  border-radius: 2px;
  background: #222222;
  flex-shrink: 0;
  position: relative;
  cursor: default;
}

.pgos-grid-cell[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: #1a1a1a;
  border: 1px solid #333333;
  color: #e0e0e0;
  font-family: 'Lato', sans-serif;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 2px;
  white-space: nowrap;
  pointer-events: none;
  z-index: 10;
}

#pgos-grid-legend {
  display: flex;
  align-items: center;
  gap: 4px;
  justify-content: flex-end;
  margin-top: 10px;
}

.pgos-legend-cell {
  width: 13px;
  height: 13px;
  border-radius: 2px;
  display: inline-block;
}

.pgos-legend-text {
  font-size: 11px;
  color: #555555;
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  font-style: italic;
  margin: 0 2px;
}

/* ── Day buttons ── */
#pgos-days {
  display: flex;
  gap: 8px;
  margin-bottom: 36px;
  flex-wrap: wrap;
}

.pgos-day-btn {
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  padding: 7px 18px;
  font-size: 14px;
  background: transparent;
  color: #555555;
  border: 1px solid #2a2a2a;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  letter-spacing: 0.08em;
}

.pgos-day-btn:hover { color: #e0e0e0; border-color: #555555; }
.pgos-day-btn.pgos-active { color: #e0e0e0; border-color: #e0e0e0; }

/* ── Section labels ── */
.pgos-section-label {
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #555555;
  margin: 32px 0 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid #2a2a2a;
}

/* ── Active tasks ── */
.pgos-task {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 16px 0;
  border-bottom: 1px solid #1e1e1e;
  cursor: pointer;
}

.pgos-task:last-child { border-bottom: none; }

.pgos-check {
  width: 16px;
  height: 16px;
  min-width: 16px;
  border: 1px solid #333333;
  background: transparent;
  margin-top: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, border-color 0.15s;
  cursor: pointer;
  flex-shrink: 0;
}

.pgos-check.pgos-done { background: #e0e0e0; border-color: #e0e0e0; }

.pgos-check.pgos-done::after {
  content: '';
  display: block;
  width: 8px;
  height: 4px;
  border-left: 1.5px solid #111111;
  border-bottom: 1.5px solid #111111;
  transform: rotate(-45deg) translateY(-1px);
}

.pgos-task-text {
  font-family: 'Lustria', serif;
  font-size: 16px;
  color: #e0e0e0;
  line-height: 1.5;
  transition: color 0.15s;

.pgos-task-text.pgos-done-text {
  color: #333333;
  text-decoration: line-through;
  text-decoration-color: #2a2a2a;
}

.pgos-task-sub {
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  font-size: 13px;
  font-style: italic;
  color: #555555;
  line-height: 1.7;
  margin-top: 5px;
}

/* ── Locked phases ── */
#pgos-locked {
  margin-top: 56px;
}

.pgos-locked-divider {
  border: none;
  border-top: 1px solid #1c1c1c;
  margin-bottom: 44px;
}

.pgos-locked-phase {
  margin-bottom: 40px;
  opacity: 0.28;
  pointer-events: none;
  user-select: none;
}

.pgos-locked-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 10px;
  border-bottom: 1px solid #1e1e1e;
  margin-bottom: 12px;
}

.pgos-locked-label {
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #555555;
}

.pgos-lock-badge {
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #333333;
  border: 1px solid #2a2a2a;
  padding: 2px 8px;
}

.pgos-locked-gate {
  font-size: 11px;
  font-style: italic;
  color: #444444;
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  margin-bottom: 16px;
  line-height: 1.7;
  padding-left: 0;
}

.pgos-locked-task {
  padding: 11px 0;
  border-bottom: 1px solid #191919;
  font-family: 'Lustria', serif;
  font-size: 14px;
  color: #3a3a3a;
  line-height: 1.55;
}

.pgos-locked-task:last-child { border-bottom: none; }

/* ── Submit ── */
#pgos-submit-wrap {
  margin-top: 48px;
  padding-top: 28px;
  border-top: 1px solid #2a2a2a;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;

#pgos-submit-btn {
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  font-size: 14px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: transparent;
  color: #e0e0e0;
  border: 1px solid #e0e0e0;
  padding: 12px 40px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;

#pgos-submit-btn:hover { background: #e0e0e0; color: #111111; }
#pgos-submit-btn:disabled { border-color: #2a2a2a; color: #333333; cursor: not-allowed; background: transparent; }

#pgos-submit-status {

  font-weight: 300;
  font-size: 13px;
  font-style: italic;
  color: #555555;
  text-align: center;
  min-height: 18px;

/* ── Mobile ── */
@media (max-width: 600px) {
  #pgos-wrap { padding: 0 20px 48px; }
  #pgos-title { font-size: 26px; }
  .pgos-day-btn { padding: 7px 13px; font-size: 13px; }
  .biz-tab { font-size: 10px; padding: 9px 18px 9px 0; margin-right: 20px; }
}

            'apikey': SUPABASE_ANON_KEY,

        var data = await res.json();
        return { error: data };
      }
    };
  }

/* ─────────────────────────────────────────────
   UTILITY FUNCTIONS
───────────────────────────────────────────── */
function todayStr() {
  var d = new Date();
  var mm = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + mm + '-' + dd;
}

// PG uses plain dates (preserves existing Supabase data).
// WB uses wb- prefix so scores never collide.
function bizDateKey() {
  var raw = todayStr();
  return currentBiz === 'pg' ? raw : ('wb-' + raw);
}

function countTotalTasks() {
  if (!currentDay) return 0;
  var total = 0;
  bizConfig[currentBiz].days[currentDay].sections.forEach(function(s){ total += s.tasks.length; });
  return total;
}

function countChecked() {
  if (!currentDay) return 0;
  var count = 0;
  bizConfig[currentBiz].days[currentDay].sections.forEach(function(s){
    s.tasks.forEach(function(t){ if(pgosChecked[t.id]) count++; });
  });
  return count;
}

function scoreToColor(score, total) {
  if (!total || score === 0) return '#222222';
  var ratio = score / total;
  if (ratio <= 0.25) return '#2a2a2a';
  if (ratio <= 0.50) return '#3d3d3d';
  if (ratio <= 0.75) return '#666666';
  if (ratio < 1.00)  return '#999999';
  return '#e0e0e0';
}

/* ─────────────────────────────────────────────
   GRID
───────────────────────────────────────────── */
function pgosRenderGrid(savedScores) {
  var grid = document.getElementById('pgos-grid');
  grid.innerHTML = '';
  var today = new Date();
  today.setHours(0,0,0,0);
  var start = new Date(today);
  start.setDate(start.getDate() - (26 * 7));
  var dow = start.getDay();
  var rewind = dow === 0 ? -6 : 1 - dow;
  start.setDate(start.getDate() + rewind);
  var cursor = new Date(start);
  while (cursor <= today) {
    var col = document.createElement('div');
    col.className = 'pgos-grid-col';
    for (var r = 0; r < 7; r++) {
      var cellDate = new Date(cursor);
      cellDate.setDate(cellDate.getDate() + r);
      var cell = document.createElement('div');
      cell.className = 'pgos-grid-cell';
      var cellDow = cellDate.getDay();
      if (cellDow === 0 || cellDow === 6) {
        cell.style.background = 'transparent';
        cell.style.border = 'none';
      } else if (cellDate > today) {
        cell.style.background = 'transparent';
      } else {
        var mm = String(cellDate.getMonth()+1).padStart(2,'0');
        var dd2 = String(cellDate.getDate()).padStart(2,'0');
        var rawDate = cellDate.getFullYear() + '-' + mm + '-' + dd2;
        // PG uses plain date, WB uses wb- prefix
        var storeKey = currentBiz === 'pg' ? rawDate : ('wb-' + rawDate);
        if (savedScores[storeKey]) {
          var s = savedScores[storeKey];
          cell.style.background = scoreToColor(s.score, s.total);
          cell.setAttribute('data-tip', rawDate + ' — ' + s.score + '/' + s.total + ' tasks');
        } else {
          cell.setAttribute('data-tip', rawDate);
        }
      }
      col.appendChild(cell);
    }
    grid.appendChild(col);
    cursor.setDate(cursor.getDate() + 7);
  }
  setTimeout(function(){
    var scroll = document.getElementById('pgos-grid-scroll');
    scroll.scrollLeft = scroll.scrollWidth;
  }, 50);
}

async function pgosLoadGrid() {
  try {
    var result = await db.from('daily_scores').select('date,score,total');
    var map = {};
    if (result.data && Array.isArray(result.data)) {
      result.data.forEach(function(row){ map[row.date] = { score: row.score, total: row.total }; });
    }
    pgosRenderGrid(map);
  } catch(e) {
    console.error('Grid load error:', e);
    pgosRenderGrid({});
  }
}

/* ─────────────────────────────────────────────
   LOCKED PHASES RENDER
───────────────────────────────────────────── */
function pgosRenderLocked() {
  var phases = bizConfig[currentBiz].lockedPhases;
  var html = '';
  if (phases && phases.length > 0) {
    html += '<hr class="pgos-locked-divider">';
    phases.forEach(function(phase) {
      html += '<div class="pgos-locked-phase">';
      html += '<div class="pgos-locked-header">';
      html += '<div class="pgos-locked-label">' + phase.label + '</div>';
      html += '<div class="pgos-lock-badge">Locked</div>';
      html += '</div>';
      html += '<div class="pgos-locked-gate">' + phase.gate + '</div>';
      phase.tasks.forEach(function(task) {
        html += '<div class="pgos-locked-task">' + task + '</div>';
      });
      html += '</div>';
    });
  }
  document.getElementById('pgos-locked').innerHTML = html;
}

/* ─────────────────────────────────────────────
   BUSINESS TAB SWITCH
───────────────────────────────────────────── */
window.switchBiz = function(biz, btn) {
  currentBiz = biz;
  currentDay = null;

  document.querySelectorAll('.biz-tab').forEach(function(b){ b.classList.remove('biz-active'); });
  btn.classList.add('biz-active');

  document.getElementById('pgos-title').textContent = bizConfig[biz].title;
  document.getElementById('pgos-slogan').textContent = bizConfig[biz].slogan;

  document.getElementById('pgos-tasks').innerHTML = '';
  document.getElementById('pgos-locked').innerHTML = '';
  document.getElementById('pgos-submit-status').textContent = '';
  document.getElementById('pgos-submit-btn').disabled = false;

  document.querySelectorAll('.pgos-day-btn').forEach(function(b){ b.classList.remove('pgos-active'); });

  pgosLoadGrid();

  // Auto-select today for the new tab
  var todayMap = [null,'mon','tue','wed','thu','fri',null];
  var todayDay = todayMap[new Date().getDay()] || 'mon';
  var dayOrder = ['mon','tue','wed','thu','fri'];
  var idx = dayOrder.indexOf(todayDay);
  var btns = document.querySelectorAll('.pgos-day-btn');
  if (btns[idx]) pgosShowDay(todayDay, btns[idx]);
};

/* ─────────────────────────────────────────────
   SUBMIT
───────────────────────────────────────────── */
window.pgosSubmitDay = async function() {
  var btn = document.getElementById('pgos-submit-btn');
  var status = document.getElementById('pgos-submit-status');
  var checked = countChecked();
  var total = countTotalTasks();
  var dateKey = bizDateKey();
  if (total === 0) { status.textContent = 'Select a day tab first.'; return; }
  btn.disabled = true;
  status.textContent = 'Saving…';
  try {
    var result = await db.from('daily_scores').upsert({ date: dateKey, score: checked, total: total });
    if (result.error) throw result.error;
    status.textContent = '✓ Saved — ' + checked + '/' + total + ' tasks for ' + todayStr();
    await pgosLoadGrid();
  } catch(e) {
    console.error('Submit error:', e);
    status.textContent = 'Error saving. Check your Supabase connection.';
  }
  btn.disabled = false;
};

/* ─────────────────────────────────────────────
   SHOW DAY
───────────────────────────────────────────── */
window.pgosShowDay = function(day, btn) {
  currentDay = day;
  document.querySelectorAll('.pgos-day-btn').forEach(function(b){ b.classList.remove('pgos-active'); });
  if (btn) btn.classList.add('pgos-active');

  var d = bizConfig[currentBiz].days[day];
  var html = '';
  d.sections.forEach(function(section){
    html += '<div class="pgos-section-label">' + section.label + '</div>';
    section.tasks.forEach(function(task){
      var done = !!pgosChecked[task.id];
      html += '<div class="pgos-task" onclick="pgosToggle(\'' + task.id + '\')">';
      html += '<div class="pgos-check' + (done ? ' pgos-done' : '') + '"></div>';
      html += '<div>';
      html += '<div class="pgos-task-text' + (done ? ' pgos-done-text' : '') + '">' + task.text + '</div>';
      html += '<div class="pgos-task-sub">' + task.sub + '</div>';
      html += '</div></div>';
    });
  });
  document.getElementById('pgos-tasks').innerHTML = html;
  document.getElementById('pgos-submit-status').textContent = '';
  document.getElementById('pgos-submit-btn').disabled = false;

  pgosRenderLocked();
};

/* ─────────────────────────────────────────────
   TOGGLE CHECKBOX
───────────────────────────────────────────── */
window.pgosToggle = function(id) {
  pgosChecked[id] = !pgosChecked[id];
  pgosShowDay(currentDay, null);
  var dayOrder = ['mon','tue','wed','thu','fri'];
  var idx = dayOrder.indexOf(currentDay);
  var btns = document.querySelectorAll('.pgos-day-btn');
  if (btns[idx]) btns[idx].classList.add('pgos-active');
};
