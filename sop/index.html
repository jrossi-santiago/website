  from: function(table) {
    return {
      select: async function(cols) {
        var res = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?select=' + (cols||'*'), {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY

        return { data: data, error: res.ok ? null : data };
      },
      upsert: async function(row) {
        var res = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify(row)
        });
        if (res.status === 204 || res.ok) return { error: null };
        var data = await res.json();
        return { error: data };
      }
    };
  }
};

// ── HELPERS ──

function todayStr() {
  var d = new Date();
  var mm = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + mm + '-' + dd;
}

function countTotalTasks() {
  if (!pgosCurrentDay) return 0;
  var total = 0;
  pgosData[pgosCurrentDay].sections.forEach(function(s){ total += s.tasks.length; });
  return total;
}

function countChecked() {
  if (!pgosCurrentDay) return 0;
  var count = 0;
  pgosData[pgosCurrentDay].sections.forEach(function(s){
    s.tasks.forEach(function(t){ if(pgosChecked[t.id]) count++; });
  });
  return count;
}

function scoreToColor(score, total) {
  if (!total || score === 0) return '#1C2B3A';
  var ratio = score / total;
  if (ratio <= 0.25) return '#3A2E14';
  if (ratio <= 0.50) return '#5C4A1E';
  if (ratio <= 0.75) return '#8B6A20';
  if (ratio < 1.00)  return '#B8832A';
  return '#D4A84B';
}

// ── GRID ──

function pgosRenderGrid(savedScores) {
  var grid = document.getElementById('pgos-grid');
  grid.innerHTML = '';

  var today = new Date();
  today.setHours(0,0,0,0);

  // Find the Monday 26 weeks ago
  var start = new Date(today);
  start.setDate(start.getDate() - (26 * 7));
  // Rewind to Monday
  var dow = start.getDay();
  var rewind = dow === 0 ? -6 : 1 - dow;
  start.setDate(start.getDate() + rewind);

  // Each column = one week, rows = Mon(0) to Sun(6)
  var cursor = new Date(start);
  while (cursor <= today) {
    var col = document.createElement('div');
    col.className = 'pgos-grid-col';

    for (var r = 0; r < 7; r++) {
      var cellDate = new Date(cursor);
      cellDate.setDate(cellDate.getDate() + r);
      var cell = document.createElement('div');
      cell.className = 'pgos-grid-cell';

      var cellDow = cellDate.getDay();

      if (cellDow === 0 || cellDow === 6) {
        // Weekend — invisible spacer so Mon–Fri align correctly
        cell.style.background = 'transparent';
        cell.style.border = 'none';
      } else if (cellDate > today) {
        cell.style.background = 'transparent';
      } else {
        var mm = String(cellDate.getMonth()+1).padStart(2,'0');
        var dd2 = String(cellDate.getDate()).padStart(2,'0');
        var dateStr = cellDate.getFullYear() + '-' + mm + '-' + dd2;

        if (savedScores[dateStr]) {
          var s = savedScores[dateStr];
          cell.style.background = scoreToColor(s.score, s.total);
          cell.setAttribute('data-tip', dateStr + ' — ' + s.score + '/' + s.total + ' tasks');
        } else {
          cell.setAttribute('data-tip', dateStr);
        }
      }

      col.appendChild(cell);
    }

    grid.appendChild(col);
    cursor.setDate(cursor.getDate() + 7);
  }

  // Auto-scroll grid to the right so the most recent weeks are visible
  setTimeout(function(){
    var scroll = document.getElementById('pgos-grid-scroll');
    scroll.scrollLeft = scroll.scrollWidth;
  }, 50);
}

async function pgosLoadGrid() {
  try {
    var result = await db.from('daily_scores').select('date,score,total');
    var map = {};
    if (result.data && Array.isArray(result.data)) {
      result.data.forEach(function(row){ map[row.date] = { score: row.score, total: row.total }; });
    }
    pgosRenderGrid(map);
  } catch(e) {
    console.error('Grid load error:', e);
    pgosRenderGrid({});
  }
}

// ── SUBMIT ──

window.pgosSubmitDay = async function() {
  var btn = document.getElementById('pgos-submit-btn');
  var status = document.getElementById('pgos-submit-status');
  var checked = countChecked();
  var total = countTotalTasks();
  var date = todayStr();

  if (total === 0) {
    status.textContent = 'Select a day tab first.';
    return;
  }

  btn.disabled = true;
  status.textContent = 'Saving…';

  try {
    var result = await db.from('daily_scores').upsert({ date: date, score: checked, total: total });
    if (result.error) throw result.error;
    status.textContent = '✓ Saved — ' + checked + '/' + total + ' tasks for ' + date;
    await pgosLoadGrid();
  } catch(e) {
    console.error('Submit error:', e);
    status.textContent = 'Error saving. Check your Supabase URL and key above.';
  }

  btn.disabled = false;
};

  pgosCurrentDay = day;
  document.querySelectorAll('.pgos-day-btn').forEach(function(b){ b.classList.remove('pgos-active'); });
  if (btn) btn.classList.add('pgos-active');

  var d = pgosData[day];
  var html = '';
  d.sections.forEach(function(section){
    html += '<div class="pgos-section-label">' + section.label + '</div>';
    section.tasks.forEach(function(task){
      var done = !!pgosChecked[task.id];
      html += '<div class="pgos-task" onclick="pgosToggle(\'' + task.id + '\')">';
      html += '<div class="pgos-check' + (done ? ' pgos-done' : '') + '"></div>';
      html += '<div>';
      html += '<div class="pgos-task-text' + (done ? ' pgos-done-text' : '') + '">' + task.text + '</div>';
      html += '<div class="pgos-task-sub">' + task.sub + '</div>';
      html += '</div></div>';
    });
  });
  document.getElementById('pgos-tasks').innerHTML = html;
  document.getElementById('pgos-submit-status').textContent = '';
  document.getElementById('pgos-submit-btn').disabled = false;
};

window.pgosToggle = function(id) {
  pgosChecked[id] = !pgosChecked[id];
  pgosShowDay(pgosCurrentDay, null);
  var dayOrder = ['mon','tue','wed','thu','fri'];
  var idx = dayOrder.indexOf(pgosCurrentDay);
  var btns = document.querySelectorAll('.pgos-day-btn');
  if (btns[idx]) btns[idx].classList.add('pgos-active');
};

// ── INIT ──
var todayMap = [null,'mon','tue','wed','thu','fri',null];
var todayDay = todayMap[new Date().getDay()] || 'mon';
var dayOrder = ['mon','tue','wed','thu','fri'];
var idx = dayOrder.indexOf(todayDay);
var initBtns = document.querySelectorAll('.pgos-day-btn');
if (initBtns[idx]) pgosShowDay(todayDay, initBtns[idx]);

pgosLoadGrid();

})();
</script>
