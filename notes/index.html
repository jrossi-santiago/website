<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg:       #0d0d0f;
    --surface:  #16161a;
    --surface2: #1e1e24;
    --border:   #2a2a35;
    --border2:  #3a3a48;
    --text:     #e8e8f0;
    --muted:    #6b6b80;
    --accent:   #7c6af7;
    --accent2:  #5b4fd4;
    --success:  #3ecf8e;
    --warn:     #f5a623;
    --danger:   #f04747;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* LAYOUT */
  .page { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }

  /* PAGE HEADER */
  .page-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .page-header h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -.03em;
    line-height: 1;
  }
  .page-header h1 span {
    display: block;
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-bottom: 6px;
    letter-spacing: .04em;
  }

  /* ADD NOTE BUTTON */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--border2); }
  .btn-danger {
    background: rgba(240,71,71,.1);
    color: var(--danger);
    border: 1px solid rgba(240,71,71,.2);
  }
  .btn-danger:hover { background: rgba(240,71,71,.2); }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    width: fit-content;
  }
  .tab {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 7px 16px;
    border-radius: 7px;
    cursor: pointer;
    color: var(--muted);
    transition: all .2s;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--surface2); color: var(--text); }
  .tab .count {
    background: var(--border);
    color: var(--muted);
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    min-width: 18px;
    text-align: center;
  }
  .tab.active .count { background: rgba(124,106,247,.2); color: var(--accent); }

  /* SEARCH */
  .search-wrap {
    position: relative;
    margin-bottom: 20px;
  }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px 11px 38px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color .2s;
    caret-color: var(--accent);
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); }

  /* NOTES GRID */
  .notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  /* NOTE CARD */
  .note-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    cursor: pointer;
    transition: all .2s;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 120px;
  }
  .note-card:hover {
    border-color: var(--border2);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
  }
  .note-card.reference { border-top: 2px solid var(--accent); }
  .note-card.fleeting  { border-top: 2px solid var(--warn); }
  .note-card.overdue   { border-top: 2px solid var(--danger); }

  .note-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .note-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    flex: 1;
  }
  .note-type-badge {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 20px;
    flex-shrink: 0;
  }
  .note-type-badge.reference {
    background: rgba(124,106,247,.12);
    color: var(--accent);
    border: 1px solid rgba(124,106,247,.2);
  }
  .note-type-badge.fleeting {
    background: rgba(245,166,35,.1);
    color: var(--warn);
    border: 1px solid rgba(245,166,35,.2);
  }

  .note-body {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    flex: 1;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
  }

  .note-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }
  .note-date {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }
  .note-reminder {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--warn);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .note-reminder.overdue { color: var(--danger); }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    grid-column: 1 / -1;
  }
  .empty-state .empty-icon {
    font-size: 32px;
    margin-bottom: 12px;
    opacity: .4;
  }
  .empty-state p { font-size: 14px; margin-bottom: 16px; }

  /* MODAL OVERLAY */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  /* MODAL */
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 16px;
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
    transform: translateY(12px);
    transition: transform .2s;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-header h2 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -.02em;
  }
  .modal-close {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 32px; height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--muted);
    font-size: 18px;
    transition: all .2s;
    flex-shrink: 0;
  }
  .modal-close:hover { color: var(--text); border-color: var(--border2); }

  /* FORM */
  .form-group { display: flex; flex-direction: column; gap: 7px; }
  .form-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .form-input, .form-textarea, .form-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color .2s;
    caret-color: var(--accent);
    width: 100%;
  }
  .form-input::placeholder,
  .form-textarea::placeholder { color: var(--muted); }
  .form-input:focus,
  .form-textarea:focus,
  .form-select:focus { border-color: var(--accent); }
  .form-textarea {
    resize: vertical;
    min-height: 160px;
    line-height: 1.6;
  }
  .form-select { cursor: pointer; }
  .form-select option { background: var(--surface2); }

  .type-toggle {
    display: flex;
    gap: 8px;
  }
  .type-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .2s;
    text-align: center;
  }
  .type-btn.active-ref {
    background: rgba(124,106,247,.12);
    color: var(--accent);
    border-color: rgba(124,106,247,.3);
  }
  .type-btn.active-flt {
    background: rgba(245,166,35,.1);
    color: var(--warn);
    border-color: rgba(245,166,35,.3);
  }

  .reminder-row {
    display: none;
  }
  .reminder-row.visible { display: flex; flex-direction: column; gap: 7px; }

  .modal-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-top: 4px;
    border-top: 1px solid var(--border);
  }
  .modal-actions-right { display: flex; gap: 8px; }

  /* SAVING INDICATOR */
  .saving-indicator {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    opacity: 0;
    transition: opacity .3s;
  }
  .saving-indicator.visible { opacity: 1; color: var(--success); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 13px;
    color: var(--text);
    opacity: 0;
    transform: translateY(8px);
    transition: all .3s;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error   { border-color: var(--danger);  color: var(--danger); }

  /* LOADING */
  .skeleton {
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 12px;
    height: 120px;
  }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  @media (max-width: 600px) {
    .page { padding: 24px 16px 60px; }
    .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .notes-grid { grid-template-columns: 1fr; }
    .modal { padding: 24px 20px; }
  }
</style>
</head>
<body>

<script>
  const SUPABASE_URL      = 'https://YOUR_PROJECT.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
</script>

<script src="/header.js"></script>

<!-- HEADER -->
<div id="site-header"></div>
<script>renderHeader('notes', { showStatus: true });</script>

<div class="page">

  <!-- HEADER -->
  <div class="page-header">
    <h1>
      <span>knowledge base</span>
      Notes
    </h1>
    <button class="btn btn-primary" onclick="openModal()">
      + New note
    </button>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" data-tab="all" onclick="switchTab('all')">
      All <span class="count" id="countAll">0</span>
    </button>
    <button class="tab" data-tab="reference" onclick="switchTab('reference')">
      Reference <span class="count" id="countRef">0</span>
    </button>
    <button class="tab" data-tab="fleeting" onclick="switchTab('fleeting')">
      Fleeting <span class="count" id="countFlt">0</span>
    </button>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input
      class="search-input"
      type="text"
      placeholder="Search notes…"
      id="searchInput"
      oninput="renderNotes()"
    >
  </div>

  <!-- NOTES GRID -->
  <div class="notes-grid" id="notesGrid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

</div>

<!-- ADD / EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">New note</h2>
      <div class="modal-close" onclick="closeModal()">×</div>
    </div>

    <!-- TYPE TOGGLE -->
    <div class="form-group">
      <div class="form-label">Type</div>
      <div class="type-toggle">
        <button class="type-btn active-ref" id="typeRef" onclick="setType('reference')">📌 Reference</button>
        <button class="type-btn" id="typeFlt" onclick="setType('fleeting')">⏳ Fleeting</button>
      </div>
    </div>

    <!-- TITLE -->
    <div class="form-group">
      <div class="form-label">Title</div>
      <input class="form-input" type="text" id="noteTitle" placeholder="What is this note about?">
    </div>

    <!-- BODY -->
    <div class="form-group">
      <div class="form-label">Content</div>
      <textarea class="form-textarea" id="noteBody" placeholder="Write anything…"></textarea>
    </div>

    <!-- REMINDER (fleeting only) -->
    <div class="reminder-row" id="reminderRow">
      <div class="form-label">Reminder date (optional)</div>
      <input class="form-input" type="date" id="noteReminder">
    </div>

    <!-- ACTIONS -->
    <div class="modal-actions">
      <div>
        <button class="btn btn-danger" id="deleteBtn" onclick="deleteNote()" style="display:none">Delete</button>
        <span class="saving-indicator" id="savingIndicator">saved</span>
      </div>
      <div class="modal-actions-right">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveNote()">Save note</button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!--
  SUPABASE SQL — run in SQL editor:

  CREATE TABLE notes (
    id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
    type text NOT NULL DEFAULT 'reference' CHECK (type IN ('reference','fleeting')),
    title text NOT NULL DEFAULT '',
    body text DEFAULT '',
    reminder_date date,
    created_at timestamptz DEFAULT now(),
    updated_at timestamptz DEFAULT now()
  );

  ALTER TABLE notes ENABLE ROW LEVEL SECURITY;
  CREATE POLICY "allow all" ON notes FOR ALL USING (true);
-->

<script>
// ── Supabase client
const supa = (() => {
  const headers = {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
  const base = `${SUPABASE_URL}/rest/v1`;

  async function query(table, params = {}) {
    const url = new URL(`${base}/${table}`);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
    const r = await fetch(url, { headers });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  async function upsert(table, data) {
    const r = await fetch(`${base}/${table}`, {
      method: 'POST',
      headers: { ...headers, 'Prefer': 'resolution=merge-duplicates,return=representation' },
      body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  async function remove(table, id) {
    const url = new URL(`${base}/${table}`);
    url.searchParams.set('id', `eq.${id}`);
    const r = await fetch(url, { method: 'DELETE', headers });
    if (!r.ok) throw new Error(await r.text());
  }

  return { query, upsert, remove };
})();

// ── State
let notes = [];
let currentTab = 'all';
let editingId = null;
let currentType = 'reference';

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ── Helpers
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  setTimeout(() => el.className = 'toast', 2400);
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + (iso.includes('T') ? '' : 'T12:00:00'));
  return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function isOverdue(reminderDate) {
  if (!reminderDate) return false;
  const today = new Date().toISOString().split('T')[0];
  return reminderDate < today;
}

function getFilteredNotes() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  return notes.filter(n => {
    const matchTab = currentTab === 'all' || n.type === currentTab;
    const matchSearch = !q ||
      n.title.toLowerCase().includes(q) ||
      (n.body || '').toLowerCase().includes(q);
    return matchTab && matchSearch;
  });
}

// ── Tabs
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  renderNotes();
}

// ── Render
function renderNotes() {
  const grid = document.getElementById('notesGrid');
  const filtered = getFilteredNotes();

  // Update counts
  document.getElementById('countAll').textContent = notes.length;
  document.getElementById('countRef').textContent = notes.filter(n => n.type === 'reference').length;
  document.getElementById('countFlt').textContent = notes.filter(n => n.type === 'fleeting').length;

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${currentTab === 'reference' ? '📌' : currentTab === 'fleeting' ? '⏳' : '📝'}</div>
        <p>${notes.length === 0 ? 'No notes yet. Create your first one.' : 'No notes match your search.'}</p>
        ${notes.length === 0 ? '<button class="btn btn-primary" onclick="openModal()">+ New note</button>' : ''}
      </div>
    `;
    return;
  }

  // Sort: fleeting overdue first, then by updated_at desc
  const sorted = [...filtered].sort((a, b) => {
    const aOver = isOverdue(a.reminder_date) ? -1 : 0;
    const bOver = isOverdue(b.reminder_date) ? -1 : 0;
    if (aOver !== bOver) return aOver - bOver;
    return new Date(b.updated_at) - new Date(a.updated_at);
  });

  grid.innerHTML = '';
  sorted.forEach(note => {
    const overdue = isOverdue(note.reminder_date);
    const card = document.createElement('div');
    card.className = `note-card ${note.type}${overdue ? ' overdue' : ''}`;
    card.onclick = () => openModal(note);

    let reminderHtml = '';
    if (note.reminder_date) {
      reminderHtml = `
        <span class="note-reminder${overdue ? ' overdue' : ''}">
          ${overdue ? '⚠' : '🔔'} ${formatDate(note.reminder_date)}
        </span>
      `;
    }

    card.innerHTML = `
      <div class="note-card-header">
        <div class="note-title">${note.title || '(untitled)'}</div>
        <span class="note-type-badge ${note.type}">${note.type}</span>
      </div>
      ${note.body ? `<div class="note-body">${note.body}</div>` : ''}
      <div class="note-footer">
        <span class="note-date">${formatDate(note.updated_at)}</span>
        ${reminderHtml}
      </div>
    `;
    grid.appendChild(card);
  });
}

// ── Modal
function openModal(note = null) {
  editingId = note ? note.id : null;
  currentType = note ? note.type : 'reference';

  document.getElementById('modalTitle').textContent = note ? 'Edit note' : 'New note';
  document.getElementById('noteTitle').value   = note ? note.title : '';
  document.getElementById('noteBody').value    = note ? (note.body || '') : '';
  document.getElementById('noteReminder').value = note?.reminder_date || '';
  document.getElementById('deleteBtn').style.display = note ? 'inline-flex' : 'none';
  document.getElementById('savingIndicator').className = 'saving-indicator';

  setType(currentType);

  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('noteTitle').focus(), 200);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function setType(type) {
  currentType = type;
  const refBtn = document.getElementById('typeRef');
  const fltBtn = document.getElementById('typeFlt');
  const remRow = document.getElementById('reminderRow');

  refBtn.className = `type-btn${type === 'reference' ? ' active-ref' : ''}`;
  fltBtn.className = `type-btn${type === 'fleeting'  ? ' active-flt' : ''}`;
  remRow.className = `reminder-row${type === 'fleeting' ? ' visible' : ''}`;
}

// ── Save
async function saveNote() {
  const title    = document.getElementById('noteTitle').value.trim();
  const body     = document.getElementById('noteBody').value.trim();
  const reminder = currentType === 'fleeting'
    ? document.getElementById('noteReminder').value || null
    : null;

  if (!title) {
    document.getElementById('noteTitle').focus();
    toast('Please add a title', 'error');
    return;
  }

  const indicator = document.getElementById('savingIndicator');
  indicator.textContent = 'saving…';
  indicator.className   = 'saving-indicator visible';

  const data = {
    type: currentType,
    title,
    body,
    reminder_date: reminder,
    updated_at: new Date().toISOString()
  };
  if (editingId) data.id = editingId;

  try {
    const [saved] = await supa.upsert('notes', [data]);

    if (editingId) {
      const idx = notes.findIndex(n => n.id === editingId);
      if (idx !== -1) notes[idx] = saved;
    } else {
      notes.unshift(saved);
    }

    indicator.textContent = 'saved ✓';
    setTimeout(() => {
      indicator.className = 'saving-indicator';
      closeModal();
    }, 600);

    renderNotes();
    toast(editingId ? 'Note updated' : 'Note saved', 'success');
  } catch(e) {
    indicator.className = 'saving-indicator';
    toast('Save failed — check connection', 'error');
  }
}

// ── Delete
async function deleteNote() {
  if (!editingId) return;
  if (!confirm('Delete this note? This cannot be undone.')) return;

  try {
    await supa.remove('notes', editingId);
    notes = notes.filter(n => n.id !== editingId);
    closeModal();
    renderNotes();
    toast('Note deleted');
  } catch(e) {
    toast('Delete failed', 'error');
  }
}

// ── Keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    openModal();
  }
});

// ── Init
async function init() {
  try {
    notes = await supa.query('notes', {
      order: 'updated_at.desc',
      select: 'id,type,title,body,reminder_date,created_at,updated_at'
    });
    document.getElementById('statusDot').className = 'status-dot connected';
    document.getElementById('statusText').textContent = 'connected';
  } catch(e) {
    document.getElementById('statusText').textContent = 'offline';
    notes = [];
    toast('Could not load notes — check your config', 'error');
  }
  renderNotes();
}

init().catch(console.error);
</script>
</body>
